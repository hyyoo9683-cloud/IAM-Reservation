<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주차 할인 — 본인 확인</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #f5f7fa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,.10);
    width: 100%;
    max-width: 400px;
    padding: 40px 32px;
  }

  .logo { text-align: center; margin-bottom: 32px; }
  .logo .icon { font-size: 44px; margin-bottom: 10px; }
  .logo h1   { font-size: 20px; font-weight: 700; color: #1a1a2e; }
  .logo p    { font-size: 13px; color: #999; margin-top: 6px; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #555;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    color: #222;
    transition: border-color .2s;
  }
  .field input:focus { outline: none; border-color: #4f6ef7; }
  .hint { font-size: 12px; color: #bbb; margin-top: 5px; }

  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    background: #4f6ef7;
    color: #fff;
    cursor: pointer;
    margin-top: 8px;
    transition: background .2s, opacity .2s;
  }
  .btn:hover    { background: #3b57e0; }
  .btn:disabled { opacity: .5; cursor: default; }

  .alert {
    display: none;
    background: #fff5f5;
    border: 1px solid #fed7d7;
    color: #c53030;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .notice {
    display: none;
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #92400e;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    line-height: 1.6;
    text-align: center;
  }

  .spinner {
    display: inline-block;
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .contact-box {
    margin-top: 20px;
    background: #f8f9ff;
    border: 1px solid #dde3ff;
    border-radius: 10px;
    padding: 16px 18px;
  }
  .contact-box .contact-title {
    font-size: 13px; font-weight: 700; color: #444; margin-bottom: 12px;
  }
  .contact-item {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #333;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 4px;
  }
  .contact-item + .contact-item { margin-top: 4px; }
  .contact-box .ci { font-size: 18px; }

  /* 관리자 버튼 — 우측 하단 고정 */
  #admin-btn {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: rgba(0,0,0,.12);
    color: #888;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
    cursor: pointer;
    transition: background .2s;
  }
  #admin-btn:hover { background: rgba(0,0,0,.22); color: #555; }

  /* 관리자 모달 */
  #admin-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 24px;
  }
  #admin-modal .modal-card {
    background: #fff;
    border-radius: 14px;
    padding: 32px 28px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 8px 32px rgba(0,0,0,.18);
  }
  #admin-modal h3 {
    font-size: 16px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 18px;
    text-align: center;
  }
  #admin-modal .modal-alert {
    display: none;
    background: #fff5f5;
    border: 1px solid #fed7d7;
    color: #c53030;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 12px;
    margin-bottom: 12px;
    text-align: center;
  }
  #admin-modal input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 18px;
    text-align: center;
    letter-spacing: 6px;
    color: #222;
    margin-bottom: 12px;
  }
  #admin-modal input:focus { outline: none; border-color: #4f6ef7; }
  #admin-modal .modal-btns { display: flex; gap: 8px; }
  #admin-modal .modal-btns button {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  #admin-modal .modal-btns .confirm { background: #4f6ef7; color: #fff; }
  #admin-modal .modal-btns .confirm:hover { background: #3b57e0; }
  #admin-modal .modal-btns .cancel  { background: #eee; color: #555; }
  #admin-modal .modal-btns .cancel:hover { background: #ddd; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="icon">🅿️</div>
    <h1>주차 할인 신청</h1>
    <p>본인 확인 후 신청 페이지로 이동합니다</p>
  </div>

  <div id="notice" class="notice">
    ✅ 신청 완료 후 <strong>뒤로가기</strong>를 눌러<br>다음 분을 위해 이 페이지로 돌아와 주세요.
  </div>

  <div id="alert" class="alert"></div>

  <div class="field">
    <label for="inp-name">청지기(실사용자) 성함 <span style="color:#e53e3e">*</span></label>
    <input type="text" id="inp-name" placeholder="예) 홍길동" autocomplete="off">
  </div>

  <div class="field">
    <label for="inp-phone">휴대전화 뒷 4자리 <span style="color:#e53e3e">*</span></label>
    <input type="text" id="inp-phone" placeholder="예) 1234" maxlength="4"
           inputmode="numeric" autocomplete="off">
    <div class="hint">등록된 연락처의 마지막 4자리를 입력해 주세요.</div>
  </div>

  <button class="btn" id="btn" onclick="doVerify()">확인</button>

  <div class="contact-box">
    <div class="contact-title">관리자에게 문의하기</div>
    <div class="contact-item"><span class="ci">📞</span> 070-7018-1439</div>
    <div class="contact-item"><span class="ci">💬</span> 카카오톡 채널 검색 '아이엠센터'</div>
  </div>
</div>

<!-- 관리자 버튼 -->
<button id="admin-btn" onclick="openAdminModal()">관리자</button>

<!-- 관리자 모달 -->
<div id="admin-modal">
  <div class="modal-card">
    <h3>🔒 관리자 확인</h3>
    <div id="modal-alert" class="modal-alert"></div>
    <input type="password" id="admin-pw" placeholder="••••" maxlength="20"
           inputmode="numeric" autocomplete="off">
    <div class="modal-btns">
      <button class="cancel" onclick="closeAdminModal()">취소</button>
      <button class="confirm" onclick="doAdminLogin()">확인</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp }   from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, collection, getDocs }
    from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey:            "AIzaSyCSHQFknw_hsxNMCvrBDer3z0cB4mG347w",
    authDomain:        "iamreservation.firebaseapp.com",
    projectId:         "iamreservation",
    storageBucket:     "iamreservation.firebasestorage.app",
    messagingSenderId: "634977833386",
    appId:             "1:634977833386:web:043a9acab5b2b229f75bd3"
  });
  const db = getFirestore(app);

  const PARKING_URL  = "https://a12299.parkingweb.kr/discount/registration";
  const ADMIN_PW     = "1439";

  // 뒤로가기로 돌아왔을 때 입력 초기화
  window.addEventListener('pageshow', () => {
    document.getElementById('inp-name').value  = '';
    document.getElementById('inp-phone').value = '';
    document.getElementById('alert').style.display  = 'none';
    document.getElementById('notice').style.display = '';
  });

  /* ── 본인 확인 ── */
  window.doVerify = async function () {
    const name  = document.getElementById('inp-name').value.trim();
    const phone = document.getElementById('inp-phone').value.trim();
    const btn   = document.getElementById('btn');

    document.getElementById('alert').style.display = 'none';

    if (!name)                  return showAlert('청지기 성함을 입력해 주세요.');
    if (!/^\d{4}$/.test(phone)) return showAlert('휴대전화 뒷 4자리를 정확히 입력해 주세요.');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>확인 중...';

    try {
      const snap  = await getDocs(collection(db, 'reservations'));
      const found = snap.docs.some(d => {
        const r      = d.data();
        const nameOk = (r.stewardName || '').trim() === name;
        const tel    = (r.stewardTel  || '').replace(/\D/g, '');
        const telOk  = tel.length >= 4 && tel.slice(-4) === phone;
        return nameOk && telOk;
      });

      if (!found) {
        showAlert('입력하신 정보와 일치하는 청지기 정보를 찾을 수 없습니다.\n성함과 휴대전화 번호를 다시 확인해 주세요.\n실사용자 대표자 성함을 입력해 주세요.');
        return;
      }

      btn.innerHTML = '✅ 확인되었습니다. 이동 중...';
      location.href = PARKING_URL;

    } catch (e) {
      console.error(e);
      showAlert('서버 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '확인';
    }
  };

  /* ── 관리자 모달 ── */
  window.openAdminModal = function () {
    document.getElementById('admin-pw').value      = '';
    document.getElementById('modal-alert').style.display = 'none';
    document.getElementById('admin-modal').style.display = 'flex';
    setTimeout(() => document.getElementById('admin-pw').focus(), 100);
  };

  window.closeAdminModal = function () {
    document.getElementById('admin-modal').style.display = 'none';
  };

  window.doAdminLogin = function () {
    const pw = document.getElementById('admin-pw').value;
    if (pw === ADMIN_PW) {
      closeAdminModal();
      location.href = PARKING_URL;
    } else {
      const el = document.getElementById('modal-alert');
      el.style.display = '';
      el.textContent   = '비밀번호가 올바르지 않습니다.';
      document.getElementById('admin-pw').value = '';
      document.getElementById('admin-pw').focus();
    }
  };

  // 모달 배경 클릭 시 닫기
  document.getElementById('admin-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('admin-modal')) closeAdminModal();
  });

  function showAlert(msg) {
    const el = document.getElementById('alert');
    el.style.display = 'block';
    el.textContent   = msg;
  }

  document.getElementById('inp-phone').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  });
  document.getElementById('inp-name').addEventListener('keydown',  e => { if (e.key === 'Enter') document.getElementById('inp-phone').focus(); });
  document.getElementById('inp-phone').addEventListener('keydown', e => { if (e.key === 'Enter') window.doVerify(); });
  document.getElementById('admin-pw').addEventListener('keydown',  e => { if (e.key === 'Enter') window.doAdminLogin(); });
</script>

</body>
</html>
