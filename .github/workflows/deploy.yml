name: Firebase 자동 배포

on:
  push:
    branches:
      - claude/space-reservation-system-N6xIM
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Firebase Tools 설치
        run: npm install -g firebase-tools

      - name: Firebase Hosting + Firestore 규칙 배포
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting,firestore:rules --project iamreservation
