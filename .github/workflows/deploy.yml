name: Firebase 자동 배포

on:
  push:
    branches:
      - claude/space-reservation-system-N6xIM
      - claude/merge-bundle-commits-5fgy0e
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Firebase Tools 설치
        run: npm install -g firebase-tools

      - name: Functions 의존성 설치
        working-directory: functions
        run: npm install

      - name: Functions 환경변수(.env) 생성
        working-directory: functions
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ADMIN_NOTIFY_EMAIL: ${{ secrets.ADMIN_NOTIFY_EMAIL }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          ALIGO_KEY: ${{ secrets.ALIGO_KEY }}
          ALIGO_USER_ID: ${{ secrets.ALIGO_USER_ID }}
          ALIGO_SENDER: ${{ secrets.ALIGO_SENDER }}
          ADMIN_NOTIFY_PHONE: ${{ secrets.ADMIN_NOTIFY_PHONE }}
        run: |
          echo "RESEND_API_KEY=${RESEND_API_KEY}" > .env
          if [ -n "$RESEND_FROM_EMAIL" ]; then echo "RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}" >> .env; fi
          if [ -n "$ADMIN_NOTIFY_EMAIL" ]; then echo "ADMIN_NOTIFY_EMAIL=${ADMIN_NOTIFY_EMAIL}" >> .env; fi
          if [ -n "$KAKAO_REST_API_KEY" ]; then echo "KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}" >> .env; fi
          if [ -n "$KAKAO_CLIENT_SECRET" ]; then echo "KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}" >> .env; fi
          if [ -n "$ALIGO_KEY" ]; then echo "ALIGO_KEY=${ALIGO_KEY}" >> .env; fi
          if [ -n "$ALIGO_USER_ID" ]; then echo "ALIGO_USER_ID=${ALIGO_USER_ID}" >> .env; fi
          if [ -n "$ALIGO_SENDER" ]; then echo "ALIGO_SENDER=${ALIGO_SENDER}" >> .env; fi
          if [ -n "$ADMIN_NOTIFY_PHONE" ]; then echo "ADMIN_NOTIFY_PHONE=${ADMIN_NOTIFY_PHONE}" >> .env; fi

      - name: Firebase Hosting + Firestore 규칙 + Functions 배포
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting:main,firestore:rules,functions --project iamreservation --force

      # 센터 홈페이지(home/)는 별도 사이트 iamcenter.web.app으로도 배포 — 예약 시스템 배포가 끝난 뒤
      # 따로 실행해서, 이 단계가 실패해도 예약 시스템 배포에는 영향이 없게 함
      - name: 센터 홈페이지 사이트(iamcenter) 확인 — 없으면 생성
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase hosting:sites:get iamcenter --project iamreservation || firebase hosting:sites:create iamcenter --project iamreservation

      - name: 센터 홈페이지(iamcenter.web.app) 배포
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting:home --project iamreservation
