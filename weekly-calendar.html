<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" href="img/app-icon-cal.png">
<link rel="icon" type="image/png" href="img/app-icon-cal.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js">
<title>전체 예약 현황 — 아이엠센터</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #4C7660; --blue-lt: #E8F0EA;
    --green: #3B6D11; --green-lt: #EAF3DE;
    --red: #A32D2D; --red-lt: #FCEBEB;
    --bg: #FFFFFF; --bg2: #fff;
    --border: #DADFDB; --border2: #EDF0ED;
    --text: #2B2E2C; --text2: #585A5C; --text3: #9A968E;
    --brand: #4C7660; --line: rgba(43,46,44,.13);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Noto Sans KR', sans-serif;
         background: var(--bg); color: var(--text); font-size: 15px; min-height: 100vh; padding-bottom: 40px; }

  .header { background: var(--blue); color: #fff; padding: 14px 16px;
             display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .header h1 { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .date-label { font-size: 15px; font-weight: 700; flex: 1; text-align: center; }
  .nav-btns { display: flex; gap: 4px; }
  .nav-btns button { background: rgba(255,255,255,.18); border: none; color: #fff;
                      padding: 6px 13px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .nav-btns button:hover { background: rgba(255,255,255,.3); }

  .date-jump-wrap { display: flex; align-items: center; gap: 2px; background: rgba(255,255,255,.18);
                     border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .date-jump-wrap:hover { background: rgba(255,255,255,.3); }
  .date-jump-label { color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; pointer-events: none; }
  .date-jump-wrap input[type=date] { background: transparent; border: none; color: transparent;
                     width: 16px; padding: 0; font-size: 14px; font-family: inherit; cursor: pointer; }
  .date-jump-wrap input[type=date]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

  .view-toggle { display: flex; width: 100%; gap: 6px; padding: 10px 16px 0; }
  .vt-btn { flex: 1; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); color: #fff;
            padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; font-weight: 700; }
  .vt-btn.active { background: #fff; border-color: #fff; color: var(--blue); }

  .blocked-banner { margin: 12px 14px 0; background: #F5F5F5; color: #777; border-radius: 8px;
                     padding: 10px 14px; font-size: 13px; text-align: center; }

  .occupancy-bar {
    margin: 12px 14px 0; background: var(--blue-lt); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--blue);
    font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .occupancy-bar .oc-hint { display: block; margin-top: 2px; font-size: 11.5px; font-weight: 400; color: var(--text3); }
  .occupancy-bar .oc-arrow { transition: transform .15s; flex-shrink: 0; }
  .occupancy-bar.open .oc-arrow { transform: rotate(180deg); }
  .occupancy-detail {
    margin: 0 14px; background: var(--bg2); border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 8px 8px; padding: 10px 14px; display: none;
  }
  .occupancy-detail.open { display: block; }
  .oc-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; color: var(--text2); }
  .oc-row .oc-hour { flex-shrink: 0; width: 52px; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
  .oc-row .oc-bar-track { flex: 1; background: var(--border2); border-radius: 999px; height: 8px; overflow: hidden; }
  .oc-row .oc-bar-fill { background: var(--blue); height: 100%; border-radius: 999px; }
  .oc-row .oc-count { flex-shrink: 0; width: 48px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text); }

  /* 주간 보기 — 요일 카드별 이용객 추정(더 컴팩트한 버전) */
  .occ-week-bar {
    background: var(--blue-lt); padding: 7px 16px; font-size: 12px; color: var(--blue);
    font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    border-top: 1px solid var(--border2);
  }
  .occ-week-bar .oc-arrow { transition: transform .15s; flex-shrink: 0; font-weight: 400; }
  .occ-week-bar.open .oc-arrow { transform: rotate(180deg); }
  .occ-week-detail { display: none; padding: 8px 16px; border-top: 1px solid var(--border2); }
  .occ-week-detail.open { display: block; }

  /* 하루 일정 문자 형식 보기 (관리자) */
  .daytext-bar {
    margin: 12px 14px 0; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--blue);
    font-weight: 700; cursor: pointer; display: none; align-items: center; justify-content: space-between; gap: 8px;
  }
  .daytext-bar:hover { background: var(--blue-lt); }
  .daytext-opts { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; color: var(--text2); }
  .daytext-opts label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .daytext-area { width: 100%; height: 320px; border: 1px solid var(--border); border-radius: 8px; padding: 10px;
                  font-family: inherit; font-size: 13.5px; line-height: 1.6; color: var(--text); resize: vertical; }
  .daytext-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .daytext-copy { background: var(--blue); color: #fff; border: none; border-radius: 8px; padding: 9px 16px;
                  font-size: 14px; font-weight: 700; cursor: pointer; }
  .daytext-msg { font-size: 12.5px; color: var(--green); font-weight: 600; }
  .modal.wide { max-width: 520px; }

  .cat { margin: 14px 14px 0; background: var(--bg2); border-radius: 12px; overflow: hidden;
         box-shadow: 0 1px 4px rgba(24,95,165,.06); }
  .cat-hd { padding: 11px 16px; font-size: 13px; font-weight: 700; color: var(--blue);
            background: var(--blue-lt); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cat-hd-title { min-width: 0; }
  .cat-body { padding: 4px 0; }
  .item { display: flex; align-items: center; gap: 10px; padding: 11px 16px;
          border-top: 1px solid var(--border2); cursor: pointer; transition: background .12s; }
  .item:first-child { border-top: none; }
  .item:hover { background: var(--bg); }
  .item-time { font-weight: 700; font-size: 13px; color: var(--blue); flex-shrink: 0; min-width: 96px; }
  .item-purpose { font-size: 14px; color: var(--text); flex: 1; min-width: 0;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-room { font-size: 11px; color: var(--text3); flex-shrink: 0; white-space: nowrap; }
  .item-lodging { background: #FAEEDA; }
  .item-lodging:hover { background: #F5E3C4; }
  .item-lodging .item-time { color: #854F0B; }
  .item-lodging .item-purpose-main { color: #854F0B; }
  .item-main-event { background: #DDEBE1; }
  .item-main-event:hover { background: #CFE3D5; }
  .item-main-event .item-time { color: #2F5A43; }
  .item-main-event .item-purpose, .item-main-event .item-purpose-main { color: #2F5A43; font-weight: 700; }
  .item-5f.item-main-event:hover { background: #CFE3D5; }
  .item-5f.item-main-event .item-5f-purpose { color: #2F5A43; }
  /* 시간/장소·목적을 줄바꿈해 좁은 컬럼에서도 텍스트가 잘리지 않게 하는 2줄 레이아웃 */
  /* 예약 목적을 첫 줄에 볼드로, 시간·장소는 둘째 줄에 보조 텍스트로 표시 */
  .item-stack { flex-direction: column; align-items: flex-start; gap: 3px; }
  .item-purpose-main { font-size: 13px; font-weight: 700; color: var(--text); width: 100%;
                        white-space: normal; overflow-wrap: anywhere; }
  .item-meta { font-size: 12px; color: var(--text3); width: 100%; white-space: normal; overflow-wrap: anywhere; }
  .empty-row { padding: 18px 16px; text-align: center; color: var(--text3); font-size: 13px; }
  .loading { text-align: center; padding: 60px; color: var(--text3); }

  /* 주간 보기: 5층 소그룹실 요약 컬럼 (오른쪽, 자체 스크롤) */
  .cat-body-split { display: flex; align-items: stretch; }
  .cat-body-main, .cat-body-5f {
    overflow-y: scroll; scrollbar-width: thin; scrollbar-color: var(--text3) transparent;
  }
  .cat-body-main::-webkit-scrollbar, .cat-body-5f::-webkit-scrollbar { width: 6px; }
  .cat-body-main::-webkit-scrollbar-track, .cat-body-5f::-webkit-scrollbar-track { background: transparent; }
  .cat-body-main::-webkit-scrollbar-thumb, .cat-body-5f::-webkit-scrollbar-thumb {
    background: var(--text3); border-radius: 3px;
  }
  .cat-body-main { flex: 1; min-width: 0; max-height: 280px; }
  .cat-body-5f { flex: 1; min-width: 0; max-height: 280px;
                 border-left: 1px solid var(--border2); background: #F7F9F7; }
  .cat-5f-hd { padding: 8px 10px 4px; font-size: 10.5px; font-weight: 700; color: var(--text3);
               position: sticky; top: 0; background: #F7F9F7; }
  .item-5f { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px;
             border-top: 1px solid var(--border2); cursor: pointer; transition: background .12s; }
  .item-5f:first-child { border-top: none; }
  .item-5f:hover { background: #EEF3EF; }
  .item-5f-purpose { font-size: 12px; font-weight: 700; color: var(--text); }
  .item-5f-meta { font-size: 11.5px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-body-5f .empty-row { padding: 14px 10px; font-size: 12px; }

  /* 상세 모달 */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 999;
              display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; max-width: 420px; width: 100%;
           padding: 26px; position: relative; }
  .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none;
                 font-size: 22px; cursor: pointer; color: var(--text3); }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; padding-right: 20px; }
  .modal-row { display: flex; gap: 10px; padding: 7px 0; font-size: 14px; border-top: 1px solid var(--border2); }
  .modal-row:first-of-type { border-top: none; }
  .modal-row .k { color: var(--text3); width: 76px; flex-shrink: 0; }
  .modal-row .v { color: var(--text); flex: 1; word-break: break-word; }
  .status-badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
  .status-대기 { background: #FAEEDA; color: #854F0B; }
  .status-확정 { background: var(--green-lt); color: var(--green); }

  /* PC 화면에서는 글자가 작아 보여서 데스크톱 폭에서는 크게 + 본문 폭 제한 */
  @media (min-width: 768px) {
    body { font-size: 17px; }
    .header h1 { font-size: 20px; }
    .date-label { font-size: 19px; }
    .nav-btns button { font-size: 15px; padding: 8px 16px; }
    .date-jump-wrap { font-size: 15px; padding: 8px 16px; }
    .date-jump-label { font-size: 15px; }
    .vt-btn { font-size: 15px; padding: 11px 14px; }
    .daytext-bar { max-width: 732px; margin-left: auto; margin-right: auto; }
    .blocked-banner, .cat { max-width: 760px; margin-left: auto; margin-right: auto; }
    .blocked-banner { font-size: 14px; }
    .cat-hd { font-size: 16px; padding: 13px 20px; }
    .item { padding: 14px 20px; }
    .item-time { font-size: 16px; min-width: 112px; }
    .item-purpose { font-size: 17px; }
    .item-room { font-size: 13px; }
    .item-purpose-main { font-size: 16px; }
    .item-meta { font-size: 14px; }
    .modal-title { font-size: 20px; }
    .modal-row { font-size: 15px; }
    .cat-body-main, .cat-body-5f { max-height: 360px; }
    .cat-5f-hd { font-size: 12px; padding: 10px 14px 5px; }
    .item-5f { padding: 10px 14px; }
    .item-5f-purpose { font-size: 14px; }
    .item-5f-meta { font-size: 13px; }
  }

  /* ── 리디자인: 흰 배경 + 초록, 상단 메뉴 / 모바일 하단 탭, 일·주·월 ── */
  html, body { height: 100%; }
  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; overflow: hidden; padding-bottom: 0 !important; height: 100vh; height: 100dvh; min-height: 0; }
  #page-scroll { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 60px; }
  #appnav { display: flex; align-items: center; gap: 30px; height: 60px; padding: 0 32px; background: #fff; border-bottom: 1px solid var(--border2); }
  #appnav .an-logo { display: block; height: 22px; aspect-ratio: 720/167; background: var(--brand); -webkit-mask: url(home/logo-iam.png) left center/contain no-repeat; mask: url(home/logo-iam.png) left center/contain no-repeat; flex-shrink: 0; }
  #appnav .an-links { display: flex; align-items: stretch; gap: 28px; height: 100%; }
  #appnav .an-link { display: flex; align-items: center; position: relative; font-size: 15px; font-weight: 600; color: var(--text2); text-decoration: none; white-space: nowrap; }
  #appnav .an-link:hover { color: var(--brand); }
  #appnav .an-link.on { color: var(--brand); font-weight: 800; }
  #appnav .an-link.on:after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--brand); }
  #appnav .an-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  #admin-login-btn { font-size: 13px !important; padding: 7px 16px !important; border: 1px solid var(--brand) !important; color: var(--brand) !important; background: #fff !important; border-radius: 999px !important; font-weight: 700; cursor: pointer; font-family: inherit; }
  #tabbar { display: none; }
  .pg-head { max-width: 1040px; margin: 0 auto; padding: 30px 24px 6px; }
  .pg-eb { font-size: 12px; font-weight: 700; letter-spacing: .2em; color: var(--text3); }
  .pg-head h1 { font-size: 46px; font-weight: 800; letter-spacing: -.045em; line-height: 1.05; margin: 6px 0 14px; color: var(--text); }
  .pg-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 2px solid var(--text); }
  .pg-date { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .date-label { font-size: 20px; font-weight: 800; letter-spacing: -.03em; color: var(--text); text-align: left; flex: none; }
  .nav-btns button { background: #fff; border: 1px solid var(--brand); color: var(--brand); padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .nav-btns button:hover { background: var(--blue-lt); }
  .pg-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .date-jump-wrap { background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; gap: 6px; }
  .date-jump-wrap:hover { background: var(--blue-lt); }
  .date-jump-label { color: var(--text2); font-size: 13.5px; }
  .date-jump-wrap input[type=date] { color: var(--text); width: auto; font-size: 13.5px; }
  .date-jump-wrap input[type=date]::-webkit-calendar-picker-indicator { filter: none; }
  .view-toggle { display: inline-grid; grid-template-columns: repeat(3, auto); width: auto; padding: 0; gap: 0; border: 1px solid var(--brand); border-radius: 999px; overflow: hidden; }
  .vt-btn { background: #fff; border: 0; color: var(--brand); padding: 9px 22px; border-radius: 0; font-size: 14px; font-weight: 800; font-family: inherit; }
  .vt-btn.active { background: var(--brand); color: #fff; }
  .blocked-banner, .occupancy-bar, .daytext-bar { max-width: 1000px; margin-left: auto; margin-right: auto; }
  .occupancy-bar, .daytext-bar { border-radius: 12px; }
  .occupancy-detail { max-width: 1000px; margin-left: auto; margin-right: auto; }
  #body { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  .cat { margin: 22px 0 0 !important; max-width: none !important; background: #fff; border-radius: 0; box-shadow: none; border-top: 2px solid var(--text); overflow: visible; }
  .cat-hd { background: none; padding: 12px 0 !important; font-size: 17px !important; font-weight: 800; letter-spacing: -.03em; color: var(--text); }
  .item { padding: 13px 4px !important; }
  .item[onclick] { cursor: pointer; } .item:not([onclick]) { cursor: default; }
  .item:hover { background: #F7F9F7; }
  .item-time { color: var(--brand); }
  .item-main-event { background: var(--blue-lt) !important; }
  .cat-body-5f { background: #F7F9F7; }
  .occ-week-bar { background: var(--blue-lt); }

  /* 사용자용: 공간 탭 + 5층 호실별 보기 */
  .rt-tabs { display: none; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .rt-chip { border: 1px solid var(--brand); background: #fff; color: var(--brand); border-radius: 999px; padding: 9px 20px; font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .rt-chip.on { background: var(--brand); color: #fff; }
  .rm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; }
  .rm { border-top: 2px solid var(--text); padding: 14px 2px 16px; margin-top: 18px; }
  .rm h3 { font-size: 20px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 10px; display: flex; align-items: baseline; gap: 10px; }
  .rm h3 small { font-size: 12.5px; font-weight: 600; color: var(--text3); letter-spacing: 0; }
  .tm-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tm { background: var(--blue-lt); color: #2F5A43; border-radius: 10px; padding: 8px 14px; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tm-none { color: var(--text3); font-size: 14px; padding: 8px 2px; }
  .u-wk { width: 100%; border-collapse: collapse; min-width: 700px; table-layout: fixed; }
  .u-wk th:first-child, .u-wk td.rn { width: 64px; }
  .u-wk th { font-size: 12.5px; font-weight: 800; color: var(--text3); letter-spacing: .06em; text-align: center; padding: 10px 4px; border-bottom: 2px solid var(--text); }
  .u-wk th.today { color: var(--brand); }
  .u-wk td { border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); padding: 8px 4px; vertical-align: top; text-align: center; }
  .u-wk td.rn { border-left: 0; font-weight: 800; font-size: 15px; text-align: left; white-space: nowrap; padding-left: 2px; }
  .u-wk .tm { display: block; margin: 0 0 4px; padding: 5px 4px; font-size: 12.5px; border-radius: 8px; }
  .u-wk .none { color: #c3c8c3; font-size: 12px; }
  .u-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .u-day { border-top: 2px solid var(--text); margin-top: 18px; padding: 14px 2px 14px; }
  .u-day h3 { font-size: 18px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 10px; }
  .u-day h3.today { color: var(--brand); }
  @media (max-width: 640px) {
    .rm-grid { grid-template-columns: 1fr; }
    .rm.empty { padding: 12px 2px; margin-top: 10px; }
    .rm.empty h3 { margin-bottom: 0; }
    .rm.empty .tm-none { display: none; }
    .rt-chip { padding: 9px 16px; font-size: 14.5px; }
    .u-wk { min-width: 640px; }
  }
  /* 월간 */
  .mc-wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  .mc-dow, .mc-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .mc-dow div { text-align: center; padding: 10px 0; font-size: 12.5px; font-weight: 800; color: var(--text3); letter-spacing: .08em; }
  .mc-dow .su, .mc-cell.su .mc-d { color: #D04F7B; }
  .mc-grid { border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .mc-cell { min-height: 112px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 6px 8px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; transition: background .12s; }
  .mc-cell:hover { background: #F7F9F7; }
  .mc-cell.out { background: #FAFBFA; } .mc-cell.out .mc-d { color: #C4C8C4; }
  .mc-cell.blk { background: #F4F4F2; }

// 관리자가 아니면 모임명·기관·인원은 보이지 않고 예약된 시간과 공간만 보임(예전 공개 캘린더와 같은 수준)

const toDateStr = d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const tsToday = () => toDateStr(new Date());
// 지혜홀은 start/end가 항상 00:00~23:59(충돌 체크용 전일 블록)로 고정 저장되므로,
// 실제 입력된 체크인/체크아웃 시간(checkinTime/checkoutTime, 선택 입력)이 있으면 그걸 표시에 사용.
// 단, 연박(여러 밤)인 경우 체크인은 첫날에만, 체크아웃은 마지막날에만 적용 (중간 밤은 그대로 00:00~23:59)
function jihyeGroupBounds(r) {
  if (!r.recurGroup) return { first: r.date, last: r.date };
  const dates = reservations.filter(x => x.recurGroup === r.recurGroup && x.room === '지혜홀').map(x => x.date).sort();
  return dates.length ? { first: dates[0], last: dates[dates.length - 1] } : { first: r.date, last: r.date };

  if (r.room !== '지혜홀' || !r.checkinTime) return r.start;
  return r.date === jihyeGroupBounds(r).first ? r.checkinTime : r.start;
};
const dispEnd = r => {
  if (r.room !== '지혜홀' || !r.checkoutTime) return r.end;
  return r.date === jihyeGroupBounds(r).last ? r.checkoutTime : r.end;
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function curDate() {
  const d = new Date();
  d.setDate(d.getDate() + dayOffset);
  return d;
}

function weekStart() {
  const d = new Date();
  d.setDate(d.getDate() - d.getDay() + weekOffset * 7); // 이번 주 일요일 기준

}

window.changeMonth = (dir) => { monthOffset = dir === 0 ? 0 : monthOffset + dir; render(); };

function viewLastDate() {
  if (mode === 'day') return toDateStr(curDate());
  if (mode === 'week') { const e = weekStart(); e.setDate(e.getDate() + 6); return toDateStr(e); }

  return toDateStr(new Date(b.getFullYear(), b.getMonth(), dim + (6 - new Date(b.getFullYear(), b.getMonth(), dim).getDay())));

function viewFirstDate() {
  if (mode === 'day') return toDateStr(curDate());

// 그날 확정 예약들의 인원(people)을 시간대별로 겹쳐서 더해 대략적인 동시간대 이용객 수를 추정
// (정확한 실제 입퇴실 집계가 아니라 예약 인원 기준 러프한 추정치)
function estimateOccupancy(items) {
  if (!items.length) return null;
  const total = items.reduce((s, r) => s + (parseInt(r.people) || 0), 0);
  let minH = 24, maxH = 0;
  items.forEach(r => {
    const sh = parseInt((r.start || '00:00').split(':')[0]);
    const [eh, em] = (r.end || '00:00').split(':').map(Number);
    const ehRounded = em > 0 ? eh + 1 : eh;
    if (sh < minH) minH = sh;
    if (ehRounded > maxH) maxH = ehRounded;
  });
  if (maxH <= minH) maxH = minH + 1;
  let peak = 0;
  const hourly = [];
  for (let h = minH; h < maxH; h++) {
    const hs = String(h).padStart(2, '0') + ':00';
    const he = String(h + 1).padStart(2, '0') + ':00';
    const count = items
      .filter(r => !(he <= r.start || hs >= r.end))
      .reduce((s, r) => s + (parseInt(r.people) || 0), 0);
    hourly.push({ hour: hs, count });
    if (count > peak) peak = count;
  }
  return { total, hourly, peak };
}

function renderOccupancy(ds) {

  const oc = estimateOccupancy(items);

    detail.classList.remove('open');

function dayTextItems(ds) {
  // 공간 분류 순서(5층 소그룹실 → 아론홀 → …)대로, 같은 분류 안에서는 시간순
  const catIdx = (room) => {
    const i = CATS.findIndex(c => c.match ? c.match(room) : c.rooms.includes(room));
    return i === -1 ? 99 : i;
  };
  return reservations
    .filter(r => r.date === ds && r.status === '확정')
    .sort((a, b) => catIdx(a.room) - catIdx(b.room) || dispStart(a).localeCompare(dispStart(b)) || roomRank(a.room) - roomRank(b.room));
}
function updateDayTextBar(ds) {
  const bar = document.getElementById('daytext-bar');
  if (!bar) return;
  dayTextDate = ds;
  const n = viewerIsAdmin ? dayTextItems(ds).length : 0;
  bar.style.display = (mode === 'day' && viewerIsAdmin) ? 'flex' : 'none';
  document.getElementById('daytext-summary').textContent = n
    ? `📋 이 날 일정 문자 형식으로 보기 (${n}건 · 장소·시간·청지기·인원)`
    : '📋 이 날 일정 문자 형식으로 보기 (예약 없음)';
}
window.openDayText = () => {
  if (!viewerIsAdmin) return;
  renderDayText();
  document.getElementById('modal-daytext').classList.add('open');
};
window.closeDayText = () => document.getElementById('modal-daytext').classList.remove('open');
document.getElementById('modal-daytext').addEventListener('click', e => {
  if (e.target.id === 'modal-daytext') closeDayText();
});
window.renderDayText = () => {
  const ds = dayTextDate || toDateStr(curDate());
  const d = new Date(ds + 'T00:00:00');
  const head = `${d.getMonth()+1}.${d.getDate()}(${DOWS[d.getDay()]})`;
  const withPeople  = document.getElementById('dt-people').checked;
  const withPurpose = document.getElementById('dt-purpose').checked;
  const withTel     = document.getElementById('dt-tel').checked;
  const items = dayTextItems(ds);
  const blocks = items.map(r => {
    const lines = [
      `장소: ${smsRoomName(r.room)}`,
      `시간: ${dispStart(r)}-${dispEnd(r)}`,
      `청지기: ${(r.stewardName || '-')}${withTel && r.stewardTel ? ' ' + r.stewardTel : ''}`,
    ];
    if (withPeople) lines.push(`인원: ${parseInt(r.people) > 0 ? parseInt(r.people) + '명' : '-'}`);
    if (withPurpose) lines.push(`모임명: ${r.purpose || '-'}`);
    return lines.join('\n');
  });
  document.getElementById('daytext-title').textContent = `${head} 예약 일정 (${items.length}건)`;
  document.getElementById('daytext-area').value = items.length
    ? `[${head} 예약 일정]\n\n${blocks.join('\n\n')}`
    : `[${head} 예약 일정]\n\n확정된 예약이 없습니다.`;
  document.getElementById('daytext-msg').textContent = '';
};
window.copyDayText = async () => {
  const ta = document.getElementById('daytext-area');
  const msg = document.getElementById('daytext-msg');
  try { await navigator.clipboard.writeText(ta.value); }
  catch (_) { ta.select(); document.execCommand('copy'); }
  msg.textContent = '복사되었습니다';
};

// ── 일반 사용자용 보기: 5층 소그룹실 / 아론홀 / 샤론홀만 (지혜홀·로비·아이엠홀은 숨김) ──
const USER_TABS = [
  { key: '5f', label: '5층 소그룹실', rooms: FLOOR5_ROOMS },
  { key: 'aaron', label: '아론홀', rooms: ['아론홀'] },
  { key: 'sharon', label: '샤론홀', rooms: ['샤론홀'] },
];
let userTab = '5f';
try { const t = localStorage.getItem('iamCalTab'); if (USER_TABS.some(x => x.key === t)) userTab = t; } catch (_) {}
const curUserTab = () => USER_TABS.find(t => t.key === userTab) || USER_TABS[0];
const inUserTab = (r) => curUserTab().rooms.includes(r.room);
window.setUserTab = (k) => { userTab = k; try { localStorage.setItem('iamCalTab', k); } catch (_) {} render(); };
function renderRoomTabs() {
  const el = document.getElementById('room-tabs'); if (!el) return;
  if (viewerIsAdmin) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.innerHTML = USER_TABS.map(t => `<button type="button" class="rt-chip${t.key === userTab ? ' on' : ''}" onclick="setUserTab('${t.key}')">${t.label}</button>`).join('');
}
const confirmedOn = (ds, rooms) => reservations
  .filter(r => rooms.includes(r.room) && r.date === ds && r.status === '확정')
  .sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
const timeChip = (r) => `<span class="tm">${esc(dispStart(r))}–${esc(dispEnd(r))}</span>`;
// 일간: 5층은 호실(505~511호)마다 그 방의 예약 시간을 바로 보여줌
function userDayHtml(ds) {
  const tab = curUserTab();
  if (tab.key === '5f') {
    return `<div class="rm-grid">` + tab.rooms.map(room => {
      const items = confirmedOn(ds, [room]);
      return `<div class="rm${items.length ? '' : ' empty'}"><h3>${room}<small>${items.length ? items.length + '건' : '비어 있음'}</small></h3>` +
        (items.length ? `<div class="tm-row">${items.map(timeChip).join('')}</div>` : `<div class="tm-none">예약 없음</div>`) + `</div>`;
    }).join('') + `</div>`;
  }
  const items = confirmedOn(ds, tab.rooms);
  return `<div class="rm"><h3>${tab.label}<small>${items.length ? items.length + '건' : '비어 있음'}</small></h3>` +
    (items.length ? `<div class="tm-row">${items.map(timeChip).join('')}</div>` : `<div class="tm-none">예약 없음</div>`) + `</div>`;
}
// 주간: 5층은 호실×요일 표, 홀은 요일별 목록
function userWeekHtml(start, todayS) {
  const tab = curUserTab();
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return d; });
  if (tab.key === '5f') {
    const head = days.map(d => { const ds = toDateStr(d); return `<th class="${ds === todayS ? 'today' : ''}">${DOWS[d.getDay()]}<br>${d.getMonth() + 1}/${d.getDate()}</th>`; }).join('');
    const rows = tab.rooms.map(room => `<tr><td class="rn">${room}</td>` + days.map(d => {
      const items = confirmedOn(toDateStr(d), [room]);
      return `<td>${items.length ? items.map(timeChip).join('') : '<span class="none">–</span>'}</td>`;
    }).join('') + `</tr>`).join('');
    return `<div class="u-wrap" style="margin-top:18px"><table class="u-wk"><thead><tr><th style="text-align:left">호실</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return days.map(d => {
    const ds = toDateStr(d); const items = confirmedOn(ds, tab.rooms);
    return `<div class="u-day"><h3 class="${ds === todayS ? 'today' : ''}">${d.getMonth() + 1}월 ${d.getDate()}일 (${DOWS[d.getDay()]})${ds === todayS ? ' · 오늘' : ''}</h3>` +
      (items.length ? `<div class="tm-row">${items.map(timeChip).join('')}</div>` : `<div class="tm-none">예약 없음</div>`) + `</div>`;
  }).join('');
}

function renderDay() {

  document.getElementById('date-label').textContent =

      .sort(byMainThenTime);

// 월간 보기: 날짜 칸에 그날 확정 예약을 요약해서 보여주고, 칸을 누르면 그 날짜의 일간 보기로 이동
function renderMonth() {
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + monthOffset);
  const y = base.getFullYear(), m = base.getMonth();
  const startDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const rows = Math.ceil((startDay + daysInMonth) / 7);
  const gridStart = new Date(y, m, 1 - startDay);
  const todayS = tsToday();
  document.getElementById('date-label').textContent = `${y}년 ${m + 1}월${monthOffset === 0 ? ' · 이번달' : ''}`;
  document.getElementById('blocked-banner-wrap').innerHTML = '';
  document.getElementById('occupancy-bar').style.display = 'none';
  document.getElementById('occupancy-detail').classList.remove('open');
  const dtBar = document.getElementById('daytext-bar'); if (dtBar) dtBar.style.display = 'none';

  const byDate = {};
  reservations.forEach(r => { if (r.status === '확정' && r.date && (viewerIsAdmin || inUserTab(r))) (byDate[r.date] = byDate[r.date] || []).push(r); });
  const MAXC = 3;
  let cells = '';
  for (let i = 0; i < rows * 7; i++) {
    const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
    const ds = toDateStr(d);
    const items = (byDate[ds] || []).slice().sort(byMainThenTime);
    const bd = blockedDates.find(b => b.date === ds);
    const hasMain = items.some(isMainEvent);
    const cls = ['mc-cell', d.getMonth() !== m ? 'out' : '', ds === todayS ? 'today' : '', bd ? 'blk' : '', d.getDay() === 0 ? 'su' : ''].filter(Boolean).join(' ');
    const chips = items.slice(0, MAXC).map(r =>
      `<div class="mc-chip${isMainEvent(r) ? ' main' : ''}">${esc(dispStart(r))} ${viewerIsAdmin ? esc(r.purpose || r.room) : esc(r.room)}</div>`).join('');
    const more = items.length > MAXC ? `<div class="mc-more">+${items.length - MAXC}건 더</div>` : '';
    cells += `<div class="${cls}" onclick="jumpToDate('${ds}')"><span class="mc-d">${d.getDate()}</span>${bd ? '<div class="mc-more">🚫 불가</div>' : ''}${chips}${more}${items.length ? `<span class="mc-count${hasMain ? ' m' : ''}">${items.length}</span>` : ''}</div>`;
  }
  document.getElementById('body').innerHTML =
    `<div class="mc-wrap" style="padding:0"><div class="mc-dow">${DOWS.map((w, i) => `<div class="${i === 0 ? 'su' : ''}">${w}</div>`).join('')}</div><div class="mc-grid">${cells}</div></div>`;
}

function renderWeek() {
  const start = weekStart();
  const todayS = tsToday();
  const endD = new Date(start); endD.setDate(endD.getDate() + 6);
  document.getElementById('date-label').textContent =
    `${start.getMonth()+1}.${start.getDate()} ~ ${endD.getMonth()+1}.${endD.getDate()}${weekOffset === 0 ? ' · 이번주' : ''}`;
  document.getElementById('blocked-banner-wrap').innerHTML = '';
  // 일간 보기 전용 상단 요약 바는 숨기고, 주간 보기는 요일 카드마다 자체 요약을 따로 표시
  document.getElementById('occupancy-bar').style.display = 'none';
  document.getElementById('occupancy-detail').classList.remove('open');
  const dtBar = document.getElementById('daytext-bar'); if (dtBar) dtBar.style.display = 'none';

  if (!viewerIsAdmin) { document.getElementById('body').innerHTML = userWeekHtml(start, todayS); return; }
  const html = Array.from({ length: 7 }, (_, i) => {
    const d  = new Date(start); d.setDate(d.getDate() + i);
    const ds = toDateStr(d);
    const dow = DOWS[d.getDay()];
    const items = reservations
      .filter(r => isWeekRoom(r.room) && r.date === ds && r.status === '확정')
      .sort(byMainThenTime);
    const body = !items.length
      ? '<div class="empty-row">예약 없음</div>'
      : items.map(r => `
          <div class="item item-stack${r.room === '지혜홀' ? ' item-lodging' : ''}${isMainEvent(r) ? ' item-main-event' : ''}"${clickAttr(r)}>
            <span class="item-purpose-main">${ttl(r)}</span>
            <span class="item-meta">${dispStart(r)}–${dispEnd(r)} · ${esc(r.room)}</span>
          </div>`).join('');
    const sgItems = reservations
      .filter(r => FLOOR5_ROOMS.includes(r.room) && r.date === ds && r.status === '확정')
      .sort(byMainThenTime);
    const sgBody = !sgItems.length
      ? '<div class="empty-row">예약 없음</div>'
      : sgItems.map(r => `
          <div class="item-5f${isMainEvent(r) ? ' item-main-event' : ''}"${clickAttr(r)}>
            <span class="item-5f-purpose">${ttl(r)}</span>
            <span class="item-5f-meta">${dispStart(r)}–${dispEnd(r)} · ${esc(r.room)}</span>
          </div>`).join('');
    const dayItems = reservations.filter(r => r.date === ds && r.status === '확정' && parseInt(r.people) > 0);
    const oc = viewerIsAdmin ? estimateOccupancy(dayItems) : null;
    const occHtml = !oc ? '' : `
        <div class="occ-week-bar" id="occ-w-bar-${i}" onclick="toggleWeekOccupancy(${i})">
          <span>👥 예상 이용객 약 ${oc.total}명 (동시간대 최대 약 ${oc.peak}명)</span><span class="oc-arrow">▾</span>
        </div>
        <div class="occ-week-detail" id="occ-w-detail-${i}">
          ${oc.hourly.map(h => `
            <div class="oc-row">
              <span class="oc-hour">${h.hour}</span>
              <span class="oc-bar-track"><span class="oc-bar-fill" style="width:${oc.peak ? Math.round(h.count / oc.peak * 100) : 0}%"></span></span>
              <span class="oc-count">${h.count}명</span>
            </div>`).join('')}
        </div>`;
    return `<div class="cat">
        <div class="cat-hd"><span class="cat-hd-title">${d.getMonth()+1}월 ${d.getDate()}일 (${dow})${ds === todayS ? ' · 오늘' : ''}</span></div>
        ${occHtml}
        <div class="cat-body-split">
          <div class="cat-body-main">${body}</div>
          <div class="cat-body-5f"><div class="cat-5f-hd">5층 소그룹실</div>${sgBody}</div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('body').innerHTML = html;
}

// 예약 데이터: 기본은 개인정보가 빠진 공개 사본, 관리자가 로그인하면 원본으로 전환
// 전체 이력을 매번 받으면 느리므로 '보는 기간 근처'(기본: 지난달 1일부터)만 구독하고,
// 더 과거로 이동하면 시작 날짜를 앞당겨 다시 구독함
let resUnsub = null, curCol = null;
const monthFirst = (y, m) => toDateStr(new Date(y, m, 1));
let minBound = (() => { const t = new Date(); return monthFirst(t.getFullYear(), t.getMonth() - 1); })();
// 끝은 '이번 달 + 3개월'까지만 받음(먼 미래의 정기 예약까지 전부 받으면 느림). 더 먼 날짜로 이동하면 다시 구독
let maxBound = (() => { const t = new Date(); return monthFirst(t.getFullYear(), t.getMonth() + 4); })();

// 직전에 받은 예약을 기기에 잠깐 저장해 두었다가 다음 방문 때 먼저 보여줌(그 사이 서버 최신 내용으로 바뀜).
// 저장하는 것은 화면 표시에 필요한 항목뿐(이름·연락처 제외) — 공개 사본에도 있는 정보
const CACHE_FIELDS = ['room','date','start','end','status','purpose','people','type','subOrg','checkinTime','checkoutTime','recurGroup'];
const cacheKey = (admin) => 'iamCalCache:v1:' + (admin ? 'a' : 'p');
function readCache(admin) {
  try {
    const c = JSON.parse(localStorage.getItem(cacheKey(admin)) || 'null');
    if (c && Date.now() - c.t < 3 * 86400000 && Array.isArray(c.d)) return c;
  } catch (_) {}
  return null;
}
let cacheTimer = null;
function writeCache(admin, docs) {
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    try {
      const d = docs.map(r => { const o = { id: r.id }; CACHE_FIELDS.forEach(k => { if (r[k] != null && r[k] !== '') o[k] = r[k]; }); return o; });
      localStorage.setItem(cacheKey(admin), JSON.stringify({ t: Date.now(), min: minBound, max: maxBound, d }));
    } catch (_) {}
  }, 400);
}
function listenReservations(col) {
  if (resUnsub) resUnsub();
  curCol = col;
  resUnsub = onSnapshot(query(collection(db, col), where('date', '>=', minBound), where('date', '<=', maxBound)), snap => {
    reservations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded.res = true; render();
    writeCache(col === 'reservations', reservations);
  }, err => {
    console.warn('예약 불러오기 실패', err);
    // 관리자 힌트가 틀렸거나 권한이 없으면 공개 사본으로 되돌림
    if (col !== 'publicReservations') {
      try { localStorage.removeItem('iamAdminHint'); } catch (_) {}
      viewerIsAdmin = false;
      listenReservations('publicReservations');
    }
  });
}
// 보려는 기간이 구독 범위를 벗어나면 범위를 넓혀 다시 구독
function ensureBound(a, b) {
  if (!curCol) return;
  if (a < minBound) { const d = new Date(a + 'T00:00:00'); minBound = monthFirst(d.getFullYear(), d.getMonth() - 1); }
  if (b > maxBound) { const d = new Date(b + 'T00:00:00'); maxBound = monthFirst(d.getFullYear(), d.getMonth() + 4); }
  loaded.res = false;
  document.getElementById('body').innerHTML = '<div class="loading">불러오는 중…</div>';
  listenReservations(curCol);
}
// 마지막으로 관리자였던 기기는 처음부터 원본을 구독(공개 사본 → 원본 두 번 불러오는 지연 방지)
let adminHint = false;
try { adminHint = localStorage.getItem('iamAdminHint') === '1'; } catch (_) {}
if (adminHint) viewerIsAdmin = true;
{
  const c = readCache(adminHint);
  if (c) { reservations = c.d; loaded.res = true; setTimeout(render, 0); }
}
listenReservations(adminHint ? 'reservations' : 'publicReservations');

onAuthStateChanged(auth, async user => {
  let admin = false;
  if (user) {
    admin = ADMIN_EMAILS.includes(user.email);
    if (!admin) {
      try { admin = (await getDoc(doc(db, 'admins', user.email))).exists(); } catch (_) {}
    }
  }
  try { localStorage.setItem('iamAdminHint', admin ? '1' : '0'); localStorage.setItem('iamLoginHint', user ? '1' : '0'); } catch (_) {}
  const firstSettle = !authSettled; authSettled = true;
  const changedAdmin = admin !== viewerIsAdmin || (admin && curCol !== 'reservations') || (!admin && curCol !== 'publicReservations');
  const changedUser = firstSettle ? (!!user) !== loginHint : (!!user) !== (!!viewerUser);
  viewerUser = user;
  viewerIsAdmin = admin;
  if (changedAdmin) listenReservations(admin ? 'reservations' : 'publicReservations');
  if (changedAdmin || changedUser) { renderAppNav(); if (loaded.res) render(); }
  const btn = document.getElementById('admin-login-btn');
  if (btn) btn.textContent = user ? (admin ? '관리자 로그아웃' : '로그아웃 (관리자 아님)') : '관리자 로그인';
});
window.toggleAdminLogin = async () => {
  if (auth.currentUser) { await signOut(auth); return; }
  try {
    const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    await signInWithPopup(auth, p);
  } catch (e) { if (e.code !== 'auth/popup-closed-by-user') alert('로그인에 실패했습니다.'); }
};
onSnapshot(collection(db, 'blockedDates'), snap => {
  blockedDates = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  loaded.bd = true; render();
});
getDoc(doc(db, 'siteContent', 'weeklyCalendar')).then(snap => {
  MAIN_KEYWORDS = (snap.exists() && Array.isArray(snap.data().mainKeywords)) ? snap.data().mainKeywords : [];
}).catch(() => {}).finally(() => { loaded.mk = true; render(); });
</script>
