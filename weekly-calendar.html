<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전체 예약 현황 — 아이엠센터</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #185FA5; --blue-lt: #EBF4FF;
    --green: #3B6D11; --green-lt: #EAF3DE;
    --red: #A32D2D; --red-lt: #FCEBEB;
    --bg: #F8FAFD; --bg2: #fff;
    --border: #D4E4F4; --border2: #E8EFF7;
    --text: #1A2533; --text2: #4A6078; --text3: #8AA3BC;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Noto Sans KR', sans-serif;
         background: var(--bg); color: var(--text); font-size: 15px; min-height: 100vh; padding-bottom: 40px; }

  .header { background: var(--blue); color: #fff; padding: 14px 16px;
             display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .header h1 { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .date-label { font-size: 15px; font-weight: 700; flex: 1; text-align: center; }
  .nav-btns { display: flex; gap: 4px; }
  .nav-btns button { background: rgba(255,255,255,.18); border: none; color: #fff;
                      padding: 6px 13px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .nav-btns button:hover { background: rgba(255,255,255,.3); }

  .date-jump-wrap { display: flex; align-items: center; gap: 2px; background: rgba(255,255,255,.18);
                     border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .date-jump-wrap:hover { background: rgba(255,255,255,.3); }
  .date-jump-label { color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; pointer-events: none; }
  .date-jump-wrap input[type=date] { background: transparent; border: none; color: transparent;
                     width: 16px; padding: 0; font-size: 14px; font-family: inherit; cursor: pointer; }
  .date-jump-wrap input[type=date]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

  .view-toggle { display: flex; width: 100%; gap: 6px; padding: 10px 16px 0; }
  .vt-btn { flex: 1; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); color: #fff;
            padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; font-weight: 700; }
  .vt-btn.active { background: #fff; border-color: #fff; color: var(--blue); }

  .blocked-banner { margin: 12px 14px 0; background: #F5F5F5; color: #777; border-radius: 8px;
                     padding: 10px 14px; font-size: 13px; text-align: center; }

  .cat { margin: 14px 14px 0; background: var(--bg2); border-radius: 12px; overflow: hidden;
         box-shadow: 0 1px 4px rgba(24,95,165,.06); }
  .cat-hd { padding: 11px 16px; font-size: 13px; font-weight: 700; color: var(--blue);
            background: var(--blue-lt); }
  .cat-body { padding: 4px 0; }
  .item { display: flex; align-items: center; gap: 10px; padding: 11px 16px;
          border-top: 1px solid var(--border2); cursor: pointer; transition: background .12s; }
  .item:first-child { border-top: none; }
  .item:hover { background: var(--bg); }
  .item-time { font-weight: 700; font-size: 13px; color: var(--blue); flex-shrink: 0; min-width: 96px; }
  .item-purpose { font-size: 14px; color: var(--text); flex: 1; min-width: 0;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-room { font-size: 11px; color: var(--text3); flex-shrink: 0; white-space: nowrap; }
  .item-lodging { background: #FAEEDA; }
  .item-lodging:hover { background: #F5E3C4; }
  .item-lodging .item-time { color: #854F0B; }
  .empty-row { padding: 18px 16px; text-align: center; color: var(--text3); font-size: 13px; }
  .loading { text-align: center; padding: 60px; color: var(--text3); }

  /* 상세 모달 */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 999;
              display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; max-width: 420px; width: 100%;
           padding: 26px; position: relative; }
  .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none;
                 font-size: 22px; cursor: pointer; color: var(--text3); }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; padding-right: 20px; }
  .modal-row { display: flex; gap: 10px; padding: 7px 0; font-size: 14px; border-top: 1px solid var(--border2); }
  .modal-row:first-of-type { border-top: none; }
  .modal-row .k { color: var(--text3); width: 76px; flex-shrink: 0; }
  .modal-row .v { color: var(--text); flex: 1; word-break: break-word; }
  .status-badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
  .status-대기 { background: #FAEEDA; color: #854F0B; }
  .status-확정 { background: var(--green-lt); color: var(--green); }

  /* PC 화면에서는 글자가 작아 보여서 데스크톱 폭에서는 크게 + 본문 폭 제한 */
  @media (min-width: 768px) {
    body { font-size: 17px; }
    .header h1 { font-size: 20px; }
    .date-label { font-size: 19px; }
    .nav-btns button { font-size: 15px; padding: 8px 16px; }
    .date-jump-wrap { font-size: 15px; padding: 8px 16px; }
    .date-jump-label { font-size: 15px; }
    .vt-btn { font-size: 15px; padding: 11px 14px; }
    .blocked-banner, .cat { max-width: 760px; margin-left: auto; margin-right: auto; }
    .blocked-banner { font-size: 14px; }
    .cat-hd { font-size: 16px; padding: 13px 20px; }
    .item { padding: 14px 20px; }
    .item-time { font-size: 16px; min-width: 112px; }
    .item-purpose { font-size: 17px; }
    .item-room { font-size: 13px; }
    .modal-title { font-size: 20px; }
    .modal-row { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📅 전체 예약 현황</h1>
  <span class="date-label" id="date-label"></span>
  <div class="nav-btns" id="nav-btns"></div>
  <label class="date-jump-wrap" for="date-jump">
    <span class="date-jump-label">📅 날짜 검색</span>
    <input type="date" id="date-jump" onchange="jumpToDate(this.value)" title="날짜로 바로 보기">
  </label>
  <div class="view-toggle">
    <button class="vt-btn active" id="vt-day" onclick="setMode('day')">일간 (전체 공간)</button>
    <button class="vt-btn" id="vt-week" onclick="setMode('week')">주간 (5층 제외 전체)</button>
  </div>
</div>

<div id="blocked-banner-wrap"></div>
<div id="body"><div class="loading">불러오는 중…</div></div>

<div class="modal-bg" id="modal-detail">
  <div class="modal">
    <button class="modal-close" onclick="closeDetail()">×</button>
    <div id="detail-content"></div>
  </div>
</div>

];
// 주간(홀) 보기 대상 공간 — 5층 소그룹실만 제외하고 전부 표시
const isWeekRoom = (room) => !FLOOR5_ROOMS.includes(room);
const DOWS = ['일','월','화','수','목','금','토'];

let reservations = [], blockedDates = [];
let mode = 'day';
let dayOffset = 0;
let weekOffset = 0;
let loaded = { res: false, bd: false };

const toDateStr = d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const tsToday = () => toDateStr(new Date());
// 지혜홀은 start/end가 항상 00:00~23:59(충돌 체크용 전일 블록)로 고정 저장되므로,
// 실제 입력된 체크인/체크아웃 시간(checkinTime/checkoutTime, 선택 입력)이 있으면 그걸 표시에 사용.
// 단, 연박(여러 밤)인 경우 체크인은 첫날에만, 체크아웃은 마지막날에만 적용 (중간 밤은 그대로 00:00~23:59)
function jihyeGroupBounds(r) {
  if (!r.recurGroup) return { first: r.date, last: r.date };
  const dates = reservations.filter(x => x.recurGroup === r.recurGroup && x.room === '지혜홀').map(x => x.date).sort();
  return dates.length ? { first: dates[0], last: dates[dates.length - 1] } : { first: r.date, last: r.date };
}
const dispStart = r => {
  if (r.room !== '지혜홀' || !r.checkinTime) return r.start;
  return r.date === jihyeGroupBounds(r).first ? r.checkinTime : r.start;
};
const dispEnd = r => {
  if (r.room !== '지혜홀' || !r.checkoutTime) return r.end;
  return r.date === jihyeGroupBounds(r).last ? r.checkoutTime : r.end;
};
const esc = s => String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function curDate() {
  const d = new Date();
  d.setDate(d.getDate() + dayOffset);
  return d;
}

function weekStart() {
  const d = new Date();
  d.setDate(d.getDate() - d.getDay() + weekOffset * 7); // 이번 주 일요일 기준
  return d;
}

window.setMode = (m) => {
  mode = m;
  document.getElementById('vt-day').classList.toggle('active', m === 'day');
  document.getElementById('vt-week').classList.toggle('active', m === 'week');
  render();
};

function renderNav() {
  const navEl = document.getElementById('nav-btns');
  if (mode === 'day') {
    navEl.innerHTML = `
      <button onclick="changeDay(-7)" title="1주 전">◀◀</button>
      <button onclick="changeDay(-1)">◀</button>
      <button onclick="changeDay(0)">오늘</button>
      <button onclick="changeDay(1)">▶</button>
      <button onclick="changeDay(7)" title="1주 후">▶▶</button>`;
  } else {
    navEl.innerHTML = `
      <button onclick="changeWeek(-1)">◀ 이전주</button>
      <button onclick="changeWeek(0)">이번주</button>
      <button onclick="changeWeek(1)">다음주 ▶</button>`;
  }
}

window.changeDay = (dir) => { dayOffset = dir === 0 ? 0 : dayOffset + dir; render(); };
window.changeWeek = (dir) => { weekOffset = dir === 0 ? 0 : weekOffset + dir; render(); };

window.jumpToDate = (dateStr) => {
  if (!dateStr) return;
  const target = new Date(dateStr + 'T00:00:00');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  dayOffset = Math.round((target - today) / 86400000);
  mode = 'day';
  document.getElementById('vt-day').classList.add('active');
  document.getElementById('vt-week').classList.remove('active');
  render();
};

function render() {
  if (!loaded.res || !loaded.bd) return;
  renderNav();
  if (mode === 'day') renderDay();
  else renderWeek();
}

function renderDay() {
  const d     = curDate();
  const ds    = toDateStr(d);
  const todayS = tsToday();
  const dow   = DOWS[d.getDay()];
  document.getElementById('date-label').textContent =
    `${d.getMonth()+1}월 ${d.getDate()}일 (${dow})${ds === todayS ? ' · 오늘' : ''}`;
  const dateJumpEl = document.getElementById('date-jump');
  if (dateJumpEl) dateJumpEl.value = ds;

  const bd = blockedDates.find(b => b.date === ds);
  document.getElementById('blocked-banner-wrap').innerHTML = bd
    ? `<div class="blocked-banner">🚫 이 날짜는 예약이 불가능합니다 (${esc(bd.reason)})</div>`
    : '';

  const html = CATS.map(cat => {
    const inCat = cat.match ? cat.match : (room) => cat.rooms.includes(room);
    const items = reservations
      .filter(r => inCat(r.room) && r.date === ds && r.status === '확정')
      .sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
    const rangeLabel = items.length
      ? ` · ${dispStart(items[0])}-${items.reduce((max, r) => dispEnd(r) > max ? dispEnd(r) : max, dispEnd(items[0]))}`
      : '';
    const body = !items.length
      ? '<div class="empty-row">예약 없음</div>'
      : items.map(r => `
          <div class="item${r.room === '지혜홀' ? ' item-lodging' : ''}" onclick='showDetail(${JSON.stringify(r.id)})'>
            <span class="item-time">${dispStart(r)}–${dispEnd(r)}</span>
            <span class="item-purpose">${esc(r.purpose) || '(목적 미기재)'}</span>
            ${cat.showRoom ? `<span class="item-room">${esc(r.room)}</span>` : ''}
          </div>`).join('');
    return `<div class="cat"><div class="cat-hd">${cat.label}${rangeLabel}</div><div class="cat-body">${body}</div></div>`;
  }).join('');

  document.getElementById('body').innerHTML = html;
}

function renderWeek() {
  const start = weekStart();
  const todayS = tsToday();
  const endD = new Date(start); endD.setDate(endD.getDate() + 6);
  document.getElementById('date-label').textContent =
    `${start.getMonth()+1}.${start.getDate()} ~ ${endD.getMonth()+1}.${endD.getDate()}${weekOffset === 0 ? ' · 이번주' : ''}`;
  document.getElementById('blocked-banner-wrap').innerHTML = '';

  const html = Array.from({ length: 7 }, (_, i) => {
    const d  = new Date(start); d.setDate(d.getDate() + i);
    const ds = toDateStr(d);
    const dow = DOWS[d.getDay()];
    const items = reservations
      .filter(r => isWeekRoom(r.room) && r.date === ds && r.status === '확정')
      .sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
    const body = !items.length
      ? '<div class="empty-row">예약 없음</div>'
      : items.map(r => `
          <div class="item${r.room === '지혜홀' ? ' item-lodging' : ''}" onclick='showDetail(${JSON.stringify(r.id)})'>
            <span class="item-time">${dispStart(r)}–${dispEnd(r)}</span>
            <span class="item-purpose">${esc(r.purpose) || '(목적 미기재)'}</span>
            <span class="item-room">${esc(r.room)}</span>
          </div>`).join('');
    return `<div class="cat"><div class="cat-hd">${d.getMonth()+1}월 ${d.getDate()}일 (${dow})${ds === todayS ? ' · 오늘' : ''}</div><div class="cat-body">${body}</div></div>`;
  }).join('');

  document.getElementById('body').innerHTML = html;
}

window.showDetail = (id) => {
  const r = reservations.find(x => x.id === id);
  if (!r) return;
  const iamRows = r.room === '아이엠홀' ? [
    r.showName                          ? `<div class="modal-row"><span class="k">공연명</span><span class="v">${esc(r.showName)}</span></div>` : '',
    (r.rehearsalStart || r.rehearsalEnd) ? `<div class="modal-row"><span class="k">리허설</span><span class="v">${esc(r.rehearsalStart)||'-'}–${esc(r.rehearsalEnd)||'-'}</span></div>` : '',
    r.audienceCount                     ? `<div class="modal-row"><span class="k">관객 수</span><span class="v">${esc(r.audienceCount)}명</span></div>` : '',
    r.roomsUsed                         ? `<div class="modal-row"><span class="k">사용하는 실</span><span class="v">${esc(r.roomsUsed)}</span></div>` : '',
    r.parking                           ? `<div class="modal-row"><span class="k">주차</span><span class="v">${esc(r.parking)}</span></div>` : '',
    r.etcNote                           ? `<div class="modal-row"><span class="k">기타</span><span class="v">${esc(r.etcNote)}</span></div>` : '',
  ].join('') : '';
  document.getElementById('detail-content').innerHTML = `
    <div class="modal-title">${esc(r.purpose) || '(목적 미기재)'}</div>
    <div class="modal-row"><span class="k">공간</span><span class="v">${esc(r.room)}</span></div>
    <div class="modal-row"><span class="k">일시</span><span class="v">${esc(r.date)} ${esc(r.start)}–${esc(r.end)}</span></div>
    <div class="modal-row"><span class="k">기관</span><span class="v">${esc(r.type)}${r.subOrg ? ' · ' + esc(r.subOrg) : ''}</span></div>
    <div class="modal-row"><span class="k">담당자</span><span class="v">${esc(r.managerName)}</span></div>
    <div class="modal-row"><span class="k">청지기</span><span class="v">${esc(r.stewardName)} ${esc(r.stewardTel)}</span></div>
    <div class="modal-row"><span class="k">인원</span><span class="v">${esc(r.people)}명</span></div>
    ${iamRows}
    <div class="modal-row"><span class="k">상태</span><span class="v"><span class="status-badge status-${esc(r.status)}">${esc(r.status)}</span></span></div>
  `;
  document.getElementById('modal-detail').classList.add('open');
};
window.closeDetail = () => document.getElementById('modal-detail').classList.remove('open');
document.getElementById('modal-detail').addEventListener('click', e => {
  if (e.target.id === 'modal-detail') closeDetail();
});

onSnapshot(collection(db, 'reservations'), snap => {
  reservations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  loaded.res = true; render();
});
onSnapshot(collection(db, 'blockedDates'), snap => {
  blockedDates = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  loaded.bd = true; render();
});
</script>
</body>
</html>
