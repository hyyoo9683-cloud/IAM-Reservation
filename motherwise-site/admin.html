<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마더와이즈 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #fdf6ee; --beige: #f5e6d3; --blush: #f2c4b0;
      --rose: #d97b6c; --rose-dark: #b85c4e; --brown: #7a4a3a;
      --text: #3d2b1f; --text-mid: #6b4c3b; --text-light: #a07060;
      --white: #ffffff; --sidebar: #2d1a12; --success: #4caf7d;
      --danger: #e05c4b; --warning: #f0a050;
    }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f2ec; color: var(--text); min-height: 100vh; }

    /* Login Screen */
    #loginScreen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, var(--cream) 0%, var(--beige) 100%);
    }
    .login-box {
      background: var(--white); border-radius: 20px; padding: 3rem 2.5rem;
      text-align: center; box-shadow: 0 8px 40px rgba(120,70,50,0.15);
      max-width: 380px; width: 90%;
    }
    .login-logo { font-size: 3rem; margin-bottom: 1rem; }
    .login-title { font-size: 1.4rem; font-weight: 700; color: var(--brown); margin-bottom: 0.4rem; }
    .login-sub { font-size: 0.88rem; color: var(--text-light); margin-bottom: 2rem; }
    .btn-google {
      width: 100%; padding: 0.9rem; border-radius: 50px;
      background: var(--rose); color: white; border: none;
      font-family: inherit; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background .2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-google:hover { background: var(--rose-dark); }
    .login-notice { font-size: 0.78rem; color: var(--text-light); margin-top: 1.2rem; }

    /* Admin Layout */
    #adminApp { display: none; min-height: 100vh; }
    .admin-layout { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 240px; background: var(--sidebar); color: rgba(255,255,255,0.85);
      display: flex; flex-direction: column; flex-shrink: 0;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
    }
    .sidebar-brand {
      padding: 1.5rem 1.4rem; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-brand-name { font-size: 1rem; font-weight: 700; color: white; }
    .sidebar-brand-sub { font-size: 0.72rem; color: rgba(255,255,255,0.4); margin-top: 2px; letter-spacing: 0.05em; }

    .sidebar-nav { flex: 1; padding: 1rem 0; }
    .sidebar-section-label {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(255,255,255,0.3);
      padding: 0.8rem 1.4rem 0.4rem;
    }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 0.7rem 1.4rem; cursor: pointer;
      font-size: 0.9rem; transition: background .15s, color .15s;
      border-radius: 8px; margin: 1px 8px;
      text-decoration: none; color: rgba(255,255,255,0.75);
    }
    .sidebar-item:hover { background: rgba(255,255,255,0.07); color: white; }
    .sidebar-item.active { background: var(--rose); color: white; }
    .sidebar-item .icon { font-size: 1rem; width: 20px; text-align: center; }
    .sidebar-badge {
      margin-left: auto; background: var(--rose); color: white;
      font-size: 0.7rem; font-weight: 700; padding: 1px 7px;
      border-radius: 50px; min-width: 20px; text-align: center;
    }
    .sidebar-item.active .sidebar-badge { background: rgba(255,255,255,0.3); }

    .sidebar-footer { padding: 1rem; border-top: 1px solid rgba(255,255,255,0.08); }
    .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 0.5rem; }
    .sidebar-avatar {
      width: 34px; height: 34px; border-radius: 50%; background: var(--rose);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; font-weight: 700; color: white; flex-shrink: 0;
    }
    .sidebar-user-name { font-size: 0.82rem; color: rgba(255,255,255,0.8); font-weight: 500; }
    .sidebar-user-email { font-size: 0.72rem; color: rgba(255,255,255,0.4); }
    .btn-logout {
      width: 100%; padding: 0.55rem; margin-top: 0.5rem;
      background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      font-family: inherit; font-size: 0.82rem; cursor: pointer;
      transition: all .2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.12); color: white; }

    /* Main Content */
    .admin-main {
      flex: 1; margin-left: 240px;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    .admin-topbar {
      background: white; padding: 1rem 2rem;
      border-bottom: 1px solid rgba(160,112,96,0.12);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 5;
    }
    .topbar-title { font-size: 1.1rem; font-weight: 700; color: var(--brown); }
    .topbar-actions { display: flex; gap: 0.7rem; }

    .admin-content { flex: 1; padding: 2rem; }

    /* Tab Panels */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0.6rem 1.2rem; border-radius: 8px;
      font-family: inherit; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; border: none; transition: all .2s;
    }
    .btn-primary { background: var(--rose); color: white; }
    .btn-primary:hover { background: var(--rose-dark); }
    .btn-secondary { background: var(--beige); color: var(--brown); }
    .btn-secondary:hover { background: var(--blush); }
    .btn-danger { background: #fee; color: var(--danger); border: 1px solid #fcc; }
    .btn-danger:hover { background: var(--danger); color: white; }
    .btn-success { background: #e8f5ee; color: var(--success); border: 1px solid #c8e8d8; }
    .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.8rem; }

    /* Cards */
    .card {
      background: white; border-radius: 14px; padding: 1.5rem;
      box-shadow: 0 2px 12px rgba(120,70,50,0.07); margin-bottom: 1.2rem;
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.7rem;
    }
    .card-title { font-size: 1rem; font-weight: 700; color: var(--brown); }

    /* Form Controls */
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-mid); margin-bottom: 0.35rem; }
    input[type="text"], input[type="email"], input[type="url"],
    textarea, select {
      width: 100%; padding: 0.65rem 0.9rem;
      border: 1.5px solid rgba(180,130,110,0.25); border-radius: 9px;
      background: var(--cream); color: var(--text);
      font-family: inherit; font-size: 0.9rem;
      transition: border-color .2s; outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(217,123,108,0.1);
    }
    textarea { resize: vertical; min-height: 90px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-hint { font-size: 0.75rem; color: var(--text-light); margin-top: 0.3rem; }

    /* News List */
    .news-item {
      display: flex; align-items: flex-start; gap: 1rem;
      padding: 1rem; border: 1.5px solid rgba(200,160,140,0.15);
      border-radius: 10px; margin-bottom: 0.7rem;
      transition: border-color .2s;
    }
    .news-item:hover { border-color: var(--blush); }
    .news-item-info { flex: 1; min-width: 0; }
    .news-item-category {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
      color: var(--rose); background: rgba(217,123,108,0.1);
      padding: 0.15rem 0.6rem; border-radius: 50px;
      display: inline-block; margin-bottom: 0.4rem;
    }
    .news-item-title { font-size: 0.95rem; font-weight: 700; color: var(--brown); word-break: keep-all; }
    .news-item-meta { font-size: 0.78rem; color: var(--text-light); margin-top: 0.25rem; }
    .news-item-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card {
      background: white; border-radius: 12px; padding: 1.2rem;
      box-shadow: 0 2px 12px rgba(120,70,50,0.07);
      text-align: center;
    }
    .stat-icon { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .stat-number { font-size: 1.8rem; font-weight: 700; color: var(--rose-dark); }
    .stat-label { font-size: 0.78rem; color: var(--text-light); margin-top: 0.2rem; }

    /* Messages */
    .message-item {
      padding: 1.1rem; border: 1.5px solid rgba(200,160,140,0.15);
      border-radius: 10px; margin-bottom: 0.7rem;
    }
    .message-item.unread { border-color: var(--blush); background: rgba(242,196,176,0.05); }
    .message-header { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .message-name { font-weight: 700; color: var(--brown); font-size: 0.95rem; }
    .message-tag { font-size: 0.72rem; font-weight: 700; background: rgba(217,123,108,0.1); color: var(--rose); padding: 0.15rem 0.6rem; border-radius: 50px; }
    .message-date { font-size: 0.78rem; color: var(--text-light); margin-left: auto; }
    .message-body { font-size: 0.87rem; color: var(--text-mid); line-height: 1.65; word-break: keep-all; }
    .message-contact { font-size: 0.8rem; color: var(--text-light); margin-top: 0.5rem; }

    /* Toast */
    .toast {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 999;
      background: var(--brown); color: white;
      padding: 0.8rem 1.4rem; border-radius: 10px;
      font-size: 0.9rem; font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transform: translateY(20px); opacity: 0;
      transition: all .3s; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 1rem;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: white; border-radius: 16px; padding: 2rem;
      width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
      transform: scale(0.95); transition: transform .25s;
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--brown); }
    .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-light); line-height: 1; padding: 0.2rem; }
    .modal-close:hover { color: var(--text); }
    .modal-footer { display: flex; gap: 0.7rem; justify-content: flex-end; margin-top: 1.5rem; padding-top: 1.2rem; border-top: 1px solid rgba(160,112,96,0.12); }

    /* Programs edit */
    .program-edit-item {
      padding: 1.2rem; border: 1.5px solid rgba(200,160,140,0.18);
      border-radius: 12px; margin-bottom: 1rem;
    }
    .program-edit-header {
      display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem;
      cursor: pointer; user-select: none;
    }
    .program-edit-icon { font-size: 1.5rem; }
    .program-edit-name { font-weight: 700; color: var(--brown); flex: 1; }
    .program-edit-toggle { color: var(--text-light); font-size: 0.9rem; transition: transform .2s; }
    .program-edit-body { display: none; }
    .program-edit-body.open { display: block; }

    /* About editor */
    .about-section { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid rgba(160,112,96,0.1); }
    .about-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .about-section-title { font-size: 0.88rem; font-weight: 700; color: var(--brown); margin-bottom: 1rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--blush); display: inline-block; }

    /* Loading */
    .loading { text-align: center; padding: 3rem; color: var(--text-light); }
    .loading-spinner {
      width: 36px; height: 36px; border: 3px solid var(--beige);
      border-top-color: var(--rose); border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty state */
    .empty-state { text-align: center; padding: 3rem 2rem; color: var(--text-light); }
    .empty-icon { font-size: 3rem; margin-bottom: 0.7rem; }
    .empty-text { font-size: 0.95rem; }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); transition: transform .3s; }
      .sidebar.open { transform: translateX(0); }
      .admin-main { margin-left: 0; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">🌿</div>
    <div class="login-title">마더와이즈 관리자</div>
    <div class="login-sub">승인된 구글 계정으로 로그인하세요</div>
    <button class="btn-google" id="loginBtn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="white" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="rgba(255,255,255,0.8)" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="rgba(255,255,255,0.6)" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="rgba(255,255,255,0.7)" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      구글 계정으로 로그인
    </button>
    <p class="login-notice">※ 승인된 관리자 계정만 접근 가능합니다</p>
  </div>
</div>

<!-- Admin App -->
<div id="adminApp">
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-name">🌿 마더와이즈</div>
        <div class="sidebar-brand-sub">ADMIN PANEL</div>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section-label">콘텐츠 관리</div>
        <a class="sidebar-item active" data-tab="dashboard">
          <span class="icon">📊</span> 대시보드
        </a>
        <a class="sidebar-item" data-tab="news">
          <span class="icon">📰</span> 소식 / 공지
          <span class="sidebar-badge" id="newsBadge">0</span>
        </a>
        <a class="sidebar-item" data-tab="programs">
          <span class="icon">📚</span> 프로그램
        </a>
        <a class="sidebar-item" data-tab="about">
          <span class="icon">🏠</span> 단체 소개
        </a>
        <div class="sidebar-section-label">운영</div>
        <a class="sidebar-item" data-tab="messages">
          <span class="icon">✉️</span> 문의 메시지
          <span class="sidebar-badge" id="msgBadge">0</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" id="userAvatar">?</div>
          <div>
            <div class="sidebar-user-name" id="userName">-</div>
            <div class="sidebar-user-email" id="userEmail">-</div>
          </div>
        </div>
        <button class="btn-logout" id="logoutBtn">로그아웃</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="admin-main">
      <div class="admin-topbar">
        <div class="topbar-title" id="topbarTitle">대시보드</div>
        <div class="topbar-actions">
          <a href="index.html" target="_blank" class="btn btn-secondary btn-sm">🌐 사이트 보기</a>
        </div>
      </div>
      <div class="admin-content">

        <!-- Dashboard -->
        <div class="tab-panel active" id="panel-dashboard">
          <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="stat-icon">📰</div><div class="stat-number" id="statNews">-</div><div class="stat-label">소식 게시글</div></div>
            <div class="stat-card"><div class="stat-icon">✉️</div><div class="stat-number" id="statMsg">-</div><div class="stat-label">미확인 문의</div></div>
            <div class="stat-card"><div class="stat-icon">📚</div><div class="stat-number">4</div><div class="stat-label">운영 프로그램</div></div>
          </div>
          <div class="card">
            <div class="card-title" style="margin-bottom:1rem;">⚡ 빠른 작업</div>
            <div style="display:flex; flex-wrap:wrap; gap:0.8rem;">
              <button class="btn btn-primary" onclick="switchTab('news'); openNewsModal()">+ 새 소식 작성</button>
              <button class="btn btn-secondary" onclick="switchTab('messages')">📨 문의 확인하기</button>
              <button class="btn btn-secondary" onclick="switchTab('programs')">✏️ 프로그램 수정</button>
            </div>
          </div>
          <div class="card">
            <div class="card-title" style="margin-bottom:1rem;">📰 최근 소식</div>
            <div id="dashboardNews"><div class="loading"><div class="loading-spinner"></div>불러오는 중...</div></div>
          </div>
        </div>

        <!-- News -->
        <div class="tab-panel" id="panel-news">
          <div class="card">
            <div class="card-header">
              <div class="card-title">소식 / 공지 관리</div>
              <button class="btn btn-primary" onclick="openNewsModal()">+ 새 글 작성</button>
            </div>
            <div id="newsList"><div class="loading"><div class="loading-spinner"></div>불러오는 중...</div></div>
          </div>
        </div>

        <!-- Programs -->
        <div class="tab-panel" id="panel-programs">
          <div class="card">
            <div class="card-header">
              <div class="card-title">프로그램 내용 수정</div>
              <button class="btn btn-primary" id="saveProgramsBtn" onclick="savePrograms()">저장하기</button>
            </div>
            <div id="programsList"></div>
          </div>
        </div>

        <!-- About -->
        <div class="tab-panel" id="panel-about">
          <div class="card">
            <div class="card-header">
              <div class="card-title">단체 소개 수정</div>
              <button class="btn btn-primary" onclick="saveAbout()">저장하기</button>
            </div>
            <div id="aboutEditor"></div>
          </div>
        </div>

        <!-- Messages -->
        <div class="tab-panel" id="panel-messages">
          <div class="card">
            <div class="card-header">
              <div class="card-title">문의 메시지</div>
              <button class="btn btn-secondary btn-sm" onclick="markAllRead()">모두 읽음 처리</button>
            </div>
            <div id="messagesList"><div class="loading"><div class="loading-spinner"></div>불러오는 중...</div></div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- News Modal -->
<div class="modal-overlay" id="newsModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="newsModalTitle">새 소식 작성</div>
      <button class="modal-close" onclick="closeNewsModal()">✕</button>
    </div>
    <div class="form-group">
      <label>카테고리 *</label>
      <select id="newsCategory">
        <option value="공지">공지</option>
        <option value="후기">후기</option>
        <option value="특강">특강</option>
        <option value="모집">모집</option>
        <option value="일반">일반</option>
      </select>
    </div>
    <div class="form-group">
      <label>제목 *</label>
      <input type="text" id="newsTitle" placeholder="소식 제목을 입력하세요" />
    </div>
    <div class="form-group">
      <label>요약 (목록에 표시되는 짧은 설명)</label>
      <textarea id="newsExcerpt" style="min-height:70px;" placeholder="한두 문장으로 요약해 주세요"></textarea>
    </div>
    <div class="form-group">
      <label>본문 내용</label>
      <textarea id="newsContent" style="min-height:160px;" placeholder="자세한 내용을 작성해 주세요"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>날짜</label>
        <input type="text" id="newsDate" placeholder="예: 2025. 04. 01" />
      </div>
      <div class="form-group">
        <label>공개 여부</label>
        <select id="newsPublished">
          <option value="true">공개</option>
          <option value="false">비공개 (임시저장)</option>
        </select>
      </div>
    </div>
    <input type="hidden" id="newsDocId" />
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeNewsModal()">취소</button>
      <button class="btn btn-primary" onclick="saveNews()">저장하기</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDocs, addDoc, setDoc, updateDoc, deleteDoc,
  onSnapshot, serverTimestamp, query, orderBy, where
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

// ── Firebase 설정 ──────────────────────────────────────────────────
// ⚠️ 아래 값들을 Firebase Console에서 발급받은 마더와이즈 프로젝트 값으로 교체하세요.
// Firebase Console → 프로젝트 설정 → 내 앱 → 웹 앱 추가
const firebaseConfig = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT_ID.firebaseapp.com",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId:             "YOUR_APP_ID"
};

// ── 관리자 이메일 설정 ─────────────────────────────────────────────
// 로그인을 허용할 구글 이메일 주소를 추가하세요.
const ADMIN_EMAILS = [
  "your-admin@gmail.com",
  // "another-admin@gmail.com",
];
// ──────────────────────────────────────────────────────────────────

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// Default data
const DEFAULT_PROGRAMS = [
  { id:"study",   icon:"📚", name:"마더와이즈 스터디",  tag:"정규 과정", desc:"소그룹으로 함께 모여 성경적 양육 원리를 공부하는 핵심 과정입니다. 매주 1회, 약 10주간 진행됩니다.", schedule:"매 학기 운영", size:"소그룹 8~12명" },
  { id:"lecture", icon:"🎤", name:"어머니 특강",        tag:"특별 강의", desc:"양육, 교육, 정서, 관계 등 다양한 주제로 전문 강사의 강의를 듣는 시간입니다.",                         schedule:"비정기 개최",   size:"제한 없음" },
  { id:"retreat", icon:"🌿", name:"어머니 수련회",      tag:"수련회",    desc:"일상에서 벗어나 깊이 쉬고 새로운 힘을 얻는 1박 2일 수련회입니다. 어머니만을 위한 특별한 시간.",        schedule:"연 1~2회",      size:"선착순 등록" },
  { id:"leader",  icon:"👑", name:"리더십 트레이닝",    tag:"리더 훈련", desc:"마더와이즈 소그룹을 이끌어갈 리더를 세우는 과정입니다. 수료 후 각 지역 소그룹 리더로 활동합니다.",     schedule:"연 1회",        size:"지원자 심사" },
];

const DEFAULT_ABOUT = {
  heroTitle:  "지혜로운 어머니가\n건강한 가정을\n만듭니다",
  heroDesc:   "마더와이즈는 어머니들이 말씀 위에서 자녀를 지혜롭고 건강하게 양육하고, 서로를 격려하며 성장하는 공동체를 세워갑니다.",
  stat1Num:   "20+", stat1Label: "운영 년수",
  stat2Num:   "1,000+", stat2Label: "수료 어머니",
  stat3Num:   "전국", stat3Label: "지역 운영",
  aboutTitle: "마더와이즈는\n어떤 단체인가요?",
  aboutDesc1: "마더와이즈(Motherwise)는 어머니들이 성경적 가치관 위에서 자녀를 양육하고, 건강한 가정을 세울 수 있도록 교육과 공동체를 지원하는 단체입니다.",
  aboutDesc2: "소그룹 스터디, 강의, 수련회 등 다양한 프로그램을 통해 어머니들이 서로 배우고 격려하며 성장하는 자리를 마련합니다.",
};

let programsData = JSON.parse(JSON.stringify(DEFAULT_PROGRAMS));
let aboutData    = Object.assign({}, DEFAULT_ABOUT);
let newsUnsubscribe = null;
let messagesUnsubscribe = null;

// ── Auth ──────────────────────────────────────────────────────────
document.getElementById('loginBtn').addEventListener('click', async () => {
  const provider = new GoogleAuthProvider();
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    showToast('로그인 실패: ' + e.message, 'error');
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, user => {
  if (user) {
    if (!ADMIN_EMAILS.includes(user.email)) {
      signOut(auth);
      showToast('접근 권한이 없는 계정입니다.', 'error');
      return;
    }
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminApp').style.display = 'block';
    document.getElementById('userName').textContent  = user.displayName || '-';
    document.getElementById('userEmail').textContent = user.email;
    document.getElementById('userAvatar').textContent = (user.displayName || '?')[0];
    initAdmin();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminApp').style.display  = 'none';
    if (newsUnsubscribe)     { newsUnsubscribe();     newsUnsubscribe = null; }
    if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
  }
});

// ── Init ──────────────────────────────────────────────────────────
function initAdmin() {
  loadNewsRealtime();
  loadMessagesRealtime();
  loadPrograms();
  loadAbout();
}

// ── Navigation ───────────────────────────────────────────────────
document.querySelectorAll('.sidebar-item[data-tab]').forEach(el => {
  el.addEventListener('click', () => switchTab(el.dataset.tab));
});

window.switchTab = function(tab) {
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p  => p.classList.toggle('active', p.id === 'panel-' + tab));
  const titles = { dashboard:'대시보드', news:'소식 / 공지', programs:'프로그램 관리', about:'단체 소개 수정', messages:'문의 메시지' };
  document.getElementById('topbarTitle').textContent = titles[tab] || tab;
};

// ── News ─────────────────────────────────────────────────────────
function loadNewsRealtime() {
  const q = query(collection(db, 'mw_news'), orderBy('createdAt', 'desc'));
  newsUnsubscribe = onSnapshot(q, snap => {
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderNewsList(items);
    renderDashboardNews(items.slice(0, 3));
    document.getElementById('newsBadge').textContent  = items.length;
    document.getElementById('statNews').textContent   = items.length;
  }, () => renderNewsList([]));
}

function renderNewsList(items) {
  const el = document.getElementById('newsList');
  if (!items.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">작성된 소식이 없습니다.</div></div>';
    return;
  }
  el.innerHTML = items.map(item => `
    <div class="news-item">
      <div class="news-item-info">
        <span class="news-item-category">${item.category || '일반'}</span>
        <div class="news-item-title">${item.title}</div>
        <div class="news-item-meta">${item.date || ''} ${item.published === false ? '· <span style="color:var(--warning)">비공개</span>' : ''}</div>
      </div>
      <div class="news-item-actions">
        <button class="btn btn-secondary btn-sm" onclick="openNewsModal('${item.id}')">✏️ 수정</button>
        <button class="btn btn-danger btn-sm" onclick="deleteNews('${item.id}')">삭제</button>
      </div>
    </div>
  `).join('');
}

function renderDashboardNews(items) {
  const el = document.getElementById('dashboardNews');
  if (!items.length) {
    el.innerHTML = '<div style="color:var(--text-light);font-size:0.88rem;">아직 소식이 없습니다. 첫 번째 글을 작성해보세요!</div>';
    return;
  }
  el.innerHTML = items.map(item => `
    <div class="news-item">
      <div class="news-item-info">
        <span class="news-item-category">${item.category || '일반'}</span>
        <div class="news-item-title">${item.title}</div>
        <div class="news-item-meta">${item.date || ''}</div>
      </div>
    </div>
  `).join('');
}

window.openNewsModal = async function(docId) {
  const modal = document.getElementById('newsModal');
  document.getElementById('newsDocId').value = docId || '';

  if (docId) {
    // Load existing
    document.getElementById('newsModalTitle').textContent = '소식 수정';
    const snap = await getDocs(query(collection(db, 'mw_news')));
    const doc_ = snap.docs.find(d => d.id === docId);
    if (doc_) {
      const d = doc_.data();
      document.getElementById('newsCategory').value  = d.category  || '일반';
      document.getElementById('newsTitle').value      = d.title     || '';
      document.getElementById('newsExcerpt').value    = d.excerpt   || '';
      document.getElementById('newsContent').value    = d.content   || '';
      document.getElementById('newsDate').value       = d.date      || '';
      document.getElementById('newsPublished').value  = String(d.published !== false);
    }
  } else {
    document.getElementById('newsModalTitle').textContent = '새 소식 작성';
    document.getElementById('newsCategory').value  = '공지';
    document.getElementById('newsTitle').value      = '';
    document.getElementById('newsExcerpt').value    = '';
    document.getElementById('newsContent').value    = '';
    document.getElementById('newsDate').value       = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\. /g, '. ').replace(/\.$/, '');
    document.getElementById('newsPublished').value  = 'true';
  }
  modal.classList.add('open');
};

window.closeNewsModal = function() {
  document.getElementById('newsModal').classList.remove('open');
};

window.saveNews = async function() {
  const title = document.getElementById('newsTitle').value.trim();
  if (!title) { showToast('제목을 입력해주세요', 'error'); return; }

  const data = {
    category:  document.getElementById('newsCategory').value,
    title,
    excerpt:   document.getElementById('newsExcerpt').value.trim(),
    content:   document.getElementById('newsContent').value.trim(),
    date:      document.getElementById('newsDate').value.trim(),
    published: document.getElementById('newsPublished').value === 'true',
  };

  const docId = document.getElementById('newsDocId').value;
  try {
    if (docId) {
      await updateDoc(doc(db, 'mw_news', docId), { ...data, updatedAt: serverTimestamp() });
      showToast('소식이 수정되었습니다', 'success');
    } else {
      await addDoc(collection(db, 'mw_news'), { ...data, createdAt: serverTimestamp() });
      showToast('소식이 등록되었습니다! 🌿', 'success');
    }
    closeNewsModal();
  } catch (e) {
    showToast('저장 실패: ' + e.message, 'error');
  }
};

window.deleteNews = async function(docId) {
  if (!confirm('이 소식을 삭제하시겠습니까?')) return;
  try {
    await deleteDoc(doc(db, 'mw_news', docId));
    showToast('삭제되었습니다');
  } catch (e) {
    showToast('삭제 실패: ' + e.message, 'error');
  }
};

// ── Programs ──────────────────────────────────────────────────────
async function loadPrograms() {
  try {
    const snap = await getDocs(collection(db, 'mw_programs'));
    if (!snap.empty) {
      programsData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
  } catch {}
  renderPrograms();
}

function renderPrograms() {
  document.getElementById('programsList').innerHTML = programsData.map((p, i) => `
    <div class="program-edit-item">
      <div class="program-edit-header" onclick="toggleProgram(${i})">
        <span class="program-edit-icon">${p.icon}</span>
        <span class="program-edit-name">${p.name}</span>
        <span class="program-edit-toggle" id="prog-toggle-${i}">▼ 펼치기</span>
      </div>
      <div class="program-edit-body" id="prog-body-${i}">
        <div class="form-row">
          <div class="form-group">
            <label>프로그램 이름</label>
            <input type="text" id="prog-name-${i}" value="${p.name}" />
          </div>
          <div class="form-group">
            <label>태그 (예: 정규 과정)</label>
            <input type="text" id="prog-tag-${i}" value="${p.tag}" />
          </div>
        </div>
        <div class="form-group">
          <label>설명</label>
          <textarea id="prog-desc-${i}">${p.desc}</textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>일정 (예: 매 학기 운영)</label>
            <input type="text" id="prog-schedule-${i}" value="${p.schedule}" />
          </div>
          <div class="form-group">
            <label>정원 (예: 소그룹 8~12명)</label>
            <input type="text" id="prog-size-${i}" value="${p.size}" />
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

window.toggleProgram = function(i) {
  const body   = document.getElementById(`prog-body-${i}`);
  const toggle = document.getElementById(`prog-toggle-${i}`);
  const open = body.classList.toggle('open');
  toggle.textContent = open ? '▲ 접기' : '▼ 펼치기';
};

window.savePrograms = async function() {
  const updated = programsData.map((p, i) => ({
    ...p,
    name:     document.getElementById(`prog-name-${i}`).value.trim(),
    tag:      document.getElementById(`prog-tag-${i}`).value.trim(),
    desc:     document.getElementById(`prog-desc-${i}`).value.trim(),
    schedule: document.getElementById(`prog-schedule-${i}`).value.trim(),
    size:     document.getElementById(`prog-size-${i}`).value.trim(),
  }));
  try {
    for (const p of updated) {
      await setDoc(doc(db, 'mw_programs', p.id), p);
    }
    programsData = updated;
    showToast('프로그램이 저장되었습니다 ✅', 'success');
  } catch (e) {
    showToast('저장 실패: ' + e.message, 'error');
  }
};

// ── About ─────────────────────────────────────────────────────────
async function loadAbout() {
  try {
    const snap = await getDocs(collection(db, 'mw_about'));
    if (!snap.empty) aboutData = { ...DEFAULT_ABOUT, ...snap.docs[0].data() };
  } catch {}
  renderAbout();
}

function renderAbout() {
  document.getElementById('aboutEditor').innerHTML = `
    <div class="about-section">
      <div class="about-section-title">🌟 Hero 섹션 (메인 상단)</div>
      <div class="form-group">
        <label>메인 슬로건</label>
        <textarea id="ab-heroTitle" style="min-height:80px;">${aboutData.heroTitle}</textarea>
        <p class="form-hint">줄바꿈은 엔터로 입력하세요</p>
      </div>
      <div class="form-group">
        <label>부제 설명</label>
        <textarea id="ab-heroDesc">${aboutData.heroDesc}</textarea>
      </div>
      <div class="form-row" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="form-group"><label>통계 1 숫자</label><input type="text" id="ab-stat1Num" value="${aboutData.stat1Num}" /></div>
        <div class="form-group"><label>통계 2 숫자</label><input type="text" id="ab-stat2Num" value="${aboutData.stat2Num}" /></div>
        <div class="form-group"><label>통계 3 숫자</label><input type="text" id="ab-stat3Num" value="${aboutData.stat3Num}" /></div>
      </div>
      <div class="form-row" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="form-group"><label>통계 1 라벨</label><input type="text" id="ab-stat1Label" value="${aboutData.stat1Label}" /></div>
        <div class="form-group"><label>통계 2 라벨</label><input type="text" id="ab-stat2Label" value="${aboutData.stat2Label}" /></div>
        <div class="form-group"><label>통계 3 라벨</label><input type="text" id="ab-stat3Label" value="${aboutData.stat3Label}" /></div>
      </div>
    </div>
    <div class="about-section">
      <div class="about-section-title">🏠 단체 소개 섹션</div>
      <div class="form-group">
        <label>섹션 제목</label>
        <textarea id="ab-aboutTitle" style="min-height:70px;">${aboutData.aboutTitle}</textarea>
      </div>
      <div class="form-group">
        <label>소개 문단 1</label>
        <textarea id="ab-aboutDesc1">${aboutData.aboutDesc1}</textarea>
      </div>
      <div class="form-group">
        <label>소개 문단 2</label>
        <textarea id="ab-aboutDesc2">${aboutData.aboutDesc2}</textarea>
      </div>
    </div>
  `;
}

window.saveAbout = async function() {
  const fields = ['heroTitle','heroDesc','stat1Num','stat1Label','stat2Num','stat2Label','stat3Num','stat3Label','aboutTitle','aboutDesc1','aboutDesc2'];
  const data = {};
  fields.forEach(f => { data[f] = document.getElementById('ab-' + f).value.trim(); });
  try {
    await setDoc(doc(db, 'mw_about', 'main'), data);
    aboutData = data;
    showToast('단체 소개가 저장되었습니다 ✅', 'success');
  } catch (e) {
    showToast('저장 실패: ' + e.message, 'error');
  }
};

// ── Messages ──────────────────────────────────────────────────────
function loadMessagesRealtime() {
  const q = query(collection(db, 'mw_contacts'), orderBy('createdAt', 'desc'));
  messagesUnsubscribe = onSnapshot(q, snap => {
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderMessages(items);
    const unread = items.filter(i => !i.read).length;
    document.getElementById('msgBadge').textContent = unread || '';
    document.getElementById('statMsg').textContent  = unread;
  }, () => renderMessages([]));
}

function renderMessages(items) {
  const el = document.getElementById('messagesList');
  if (!items.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">아직 문의가 없습니다.</div></div>';
    return;
  }
  el.innerHTML = items.map(item => `
    <div class="message-item ${item.read ? '' : 'unread'}" onclick="markRead('${item.id}')">
      <div class="message-header">
        ${!item.read ? '<span style="width:8px;height:8px;border-radius:50%;background:var(--rose);flex-shrink:0;display:inline-block;"></span>' : ''}
        <span class="message-name">${item.name || '-'}</span>
        <span class="message-tag">${item.subject || '기타'}</span>
        <span class="message-date">${item.date || ''}</span>
      </div>
      <div class="message-body">${(item.message || '').replace(/\n/g, '<br>')}</div>
      <div class="message-contact">
        ${item.phone ? '📞 ' + item.phone : ''}
        ${item.email ? ' · 📧 ' + item.email : ''}
      </div>
    </div>
  `).join('');
}

window.markRead = async function(docId) {
  try { await updateDoc(doc(db, 'mw_contacts', docId), { read: true }); } catch {}
};

window.markAllRead = async function() {
  const snap = await getDocs(query(collection(db, 'mw_contacts'), where('read', '==', false)));
  await Promise.all(snap.docs.map(d => updateDoc(d.ref, { read: true })));
  showToast('모두 읽음 처리되었습니다');
};

// ── Toast ────────────────────────────────────────────────────────
window.showToast = function(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => t.className = 'toast', 3000);
};
</script>
</body>
</html>
