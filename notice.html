const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

let curUser  = null;
let isAdmin  = false;
let notices  = [];
let curCat   = '전체';
let editingId = null;

const CATS = ['전체', '이용 규정', '공지', '팀 소식'];
const CAT_COLOR = {
  '이용 규정': 'var(--blue)',
  '공지':      'var(--red)',
  '팀 소식':   'var(--green)',
};

setPersistence(auth, browserLocalPersistence).catch(console.error);

onAuthStateChanged(auth, async user => {
  if (!user) { showLogin(); return; }
  const domain  = user.email.split('@')[1];
  const allowed = domain === ALLOWED_DOMAIN || ADMIN_EMAILS.includes(user.email);
  if (!allowed) { await signOut(auth); showLoginError('아이엠센터 구성원만 이용할 수 있습니다.'); return; }
  curUser = user;
  isAdmin = ADMIN_EMAILS.includes(user.email) || domain === ALLOWED_DOMAIN;
  document.getElementById('login-wrap').style.display  = 'none';
  document.getElementById('app-wrap').style.display    = 'block';
  document.getElementById('user-avatar').textContent   = (user.displayName || user.email)[0].toUpperCase();
  document.getElementById('user-name').textContent     = user.displayName || user.email.split('@')[0];
  document.getElementById('write-btn').style.display   = isAdmin ? 'flex' : 'none';
  buildCatTabs();
  await seedIfNeeded();
  await loadNotices();
});

function showLogin() {
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('app-wrap').style.display   = 'none';
}
function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.style.display = 'block'; showLogin();
}
window.doLogin = async () => {
  document.getElementById('login-error').style.display = 'none';
  try {
    const p = new GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    await signInWithPopup(auth, p);
  } catch(e) { if (e.code !== 'auth/popup-closed-by-user') showLoginError('로그인 실패. 다시 시도해주세요.'); }
};
window.doLogout = async () => { await signOut(auth); };

async function seedIfNeeded() {
  try {
    const snap = await getDocs(collection(db,'notices'));
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    // 홀 이용 안내 시드 (최초 1회)
    const hasSeeded = docs.some(d => d.seeded === true);
    if (!hasSeeded) {
      const seeds = [
        { title:'아론홀 이용 안내 (2026)', category:'이용 규정', content: AARON_CONTENT, pinned:true, seeded:true, venue:'아론홀',   createdBy:'system' },
        { title:'샤론홀 이용 안내 (2026)', category:'이용 규정', content: SHARON_CONTENT, pinned:true, seeded:true, venue:'샤론홀', createdBy:'system' },
      ];
      for (const s of seeds)
        await addDoc(collection(db,'notices'), { ...s, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
    }

    // I AM 스토리 공지 (별도 시드 — 기존 시드와 독립)
    const hasStory = docs.some(d => d.seededStory === true);
    if (!hasStory) {
      await addDoc(collection(db,'notices'), {
        title: 'I AM ... Center 이야기',
        category: '공지',
        content: IAM_STORY_CONTENT,
        pinned: true,
        seeded: false,
        seededStory: true,
        createdBy: 'system',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
      });
    }
  } catch(e) { console.error('Seed error:', e); }
}

async function loadNotices() {
  try {
    const snap = await getDocs(query(collection(db,'notices'), orderBy('createdAt','desc')));
    notices = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // 고정 공지를 앞으로, 나머지는 최신순 유지
    notices.sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0));
    renderList();
  } catch(e) {
    console.error('Load notices error:', e);
    document.getElementById('notice-list').innerHTML =
      `<div style="text-align:center;padding:48px 20px;color:var(--red);font-size:13px">불러오기 실패: ${e.message}</div>`;
  }
}

function buildCatTabs() {
  const html = CATS.map(c =>
    `<button class="cat-tab${c===curCat?' active':''}" onclick="setCat('${c}')">${c}</button>`
  ).join('');
  const mob  = document.getElementById('cat-tabs');
  const desk = document.getElementById('cat-tabs-desktop');
  if (mob)  mob.innerHTML  = html;
  if (desk) desk.innerHTML = html;
}

window.setCat = (c) => {
  curCat = c;
  buildCatTabs();
  renderList();
  document.getElementById('detail-panel').style.display = 'none';
};

function renderList() {
  const filtered = curCat === '전체' ? notices : notices.filter(n => n.category === curCat);
  const el = document.getElementById('notice-list');
  if (!filtered.length) {
    el.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--text3);font-size:14px">등록된 공지가 없습니다.</div>`;
    return;
  }
  el.innerHTML = filtered.map(n => {
    const dateStr = n.createdAt?.toDate ? fmtDate(n.createdAt.toDate()) : '';
    const color   = CAT_COLOR[n.category] || 'var(--text3)';
    return `<div class="ncard${n.pinned?' pinned':''}" onclick="openNotice('${n.id}')">
      <div style="display:flex;align-items:flex-start;gap:10px">
        ${n.pinned ? '<span style="font-size:12px;margin-top:1px">📌</span>' : ''}
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px">
            <span class="cat-badge" style="background:${color}20;color:${color}">${n.category}</span>
            ${n.venue ? `<span class="cat-badge" style="background:var(--bg3);color:var(--text2)">${n.venue}</span>` : ''}
          </div>
          <div class="ncard-title">${n.title}</div>
          <div class="ncard-preview">${(n.content||'').slice(0,80).replace(/\n/g,' ')}${n.content?.length>80?'…':''}</div>
        </div>
        <div class="ncard-date">${dateStr}</div>
      </div>
    </div>`;
  }).join('');
}

window.openNotice = (id) => {
  const n = notices.find(x => x.id === id); if (!n) return;
  const color = CAT_COLOR[n.category] || 'var(--text3)';
  const dateStr = n.createdAt?.toDate ? fmtDate(n.createdAt.toDate()) : '';
  const updStr  = n.updatedAt?.toDate && n.updatedAt.seconds !== n.createdAt?.seconds
    ? ' (수정: ' + fmtDate(n.updatedAt.toDate()) + ')' : '';

  const adminBtns = isAdmin ? `
    <div style="display:flex;gap:8px;margin-top:20px">
      <button class="btn btn-ghost" onclick="openEditor('${id}')">수정</button>
      <button class="btn btn-red"   onclick="deleteNotice('${id}')">삭제</button>
    </div>` : '';

  document.getElementById('detail-panel').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap">
      <a href="notice.html" style="font-size:13px;color:var(--text3);text-decoration:none">← 목록</a>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <span class="cat-badge" style="background:${color}20;color:${color}">${n.category}</span>
      ${n.venue ? `<span class="cat-badge" style="background:var(--bg3);color:var(--text2)">${n.venue}</span>` : ''}
      ${n.pinned ? '<span class="cat-badge" style="background:var(--amber-lt);color:var(--amber)">📌 고정</span>' : ''}
    </div>
    <h2 style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.4">${n.title}</h2>
    <div style="font-size:12px;color:var(--text3);margin-bottom:24px">${dateStr}${updStr}</div>
    <div class="notice-body">${n.content || ''}</div>
    ${adminBtns}
  `;
  document.getElementById('detail-panel').style.display = 'block';
  document.getElementById('detail-panel').scrollTop = 0;
  // on mobile, hide list to show detail
  if (window.innerWidth < 768) {
    document.getElementById('notice-list').style.display = 'none';
    document.getElementById('detail-panel').style.display = 'block';
  }
};

// 뒤로가기: 모바일에서 목록 복귀
window.addEventListener('click', e => {
  if (e.target.closest('a[href="notice.html"]')) {
    e.preventDefault();
    document.getElementById('notice-list').style.display = '';
    document.getElementById('detail-panel').style.display = 'none';
  }
});

// ── 에디터 ──
window.openEditor = (id) => {
  editingId = id || null;
  const n   = id ? notices.find(x => x.id === id) : null;
  document.getElementById('ed-title').value    = n?.title    || '';
  document.getElementById('ed-cat').value      = n?.category || '공지';
  document.getElementById('ed-venue').value    = n?.venue    || '';
  document.getElementById('ed-content').value  = n?.content  || '';
  document.getElementById('ed-pinned').checked = !!n?.pinned;
  document.getElementById('ed-modal-title').textContent = id ? '공지 수정' : '새 공지 작성';
  document.getElementById('ed-modal').style.display = 'flex';
};
window.closeEditor = () => { document.getElementById('ed-modal').style.display = 'none'; editingId = null; };
window.saveNotice  = async () => {
  const title   = document.getElementById('ed-title').value.trim();
  const cat     = document.getElementById('ed-cat').value;
  const venue   = document.getElementById('ed-venue').value.trim();
  const content = document.getElementById('ed-content').value.trim();
  const pinned  = document.getElementById('ed-pinned').checked;
  if (!title || !content) { alert('제목과 내용을 입력해 주세요.'); return; }

  const data = { title, category: cat, venue, content, pinned,
    updatedAt: serverTimestamp(), createdBy: curUser?.email || '' };

  if (editingId) {
    await updateDoc(doc(db,'notices',editingId), data);
  } else {
    await addDoc(collection(db,'notices'), { ...data, createdAt: serverTimestamp(), seeded: false });
  }
  closeEditor();
  await loadNotices();
};

window.deleteNotice = async (id) => {
  if (!confirm('이 공지를 삭제하시겠습니까?')) return;
  await deleteDoc(doc(db,'notices',id));
  document.getElementById('detail-panel').style.display = 'none';
  if (window.innerWidth < 768) document.getElementById('notice-list').style.display = '';
  await loadNotices();
};

function fmtDate(d) {
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
</script>

<style>
:root {
  --blue:     #185FA5; --blue-lt:  #E6F1FB; --blue-mid: #378ADD;
  --green:    #3B6D11; --green-lt: #EAF3DE;
  --amber:    #854F0B; --amber-lt: #FAEEDA;
  --red:      #A32D2D; --red-lt:   #FCEBEB;
  --bg:  #fff; --bg2: #F8FAFD; --bg3: #F0F6FF;
  --border: #D4E4F4; --border2: #E8EFF7;
  --text: #1A2533; --text2: #4A6078; --text3: #8AA3BC;
  --font: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg2);color:var(--text);min-height:100vh;}

/* ── 로그인 ── */
#login-wrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0d2e5e,#185FA5 55%,#378ADD);}
.login-card{background:#fff;border-radius:20px;padding:48px 40px;width:360px;text-align:center;
  box-shadow:0 24px 64px rgba(0,0,0,.28);}
.login-emblem{font-size:44px;margin-bottom:14px;}
.login-title{font-size:22px;font-weight:800;color:var(--text);margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:32px;}
.login-btn{width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;
  background:var(--blue);color:#fff;font-size:15px;font-weight:700;font-family:var(--font);
  display:flex;align-items:center;justify-content:center;gap:10px;transition:filter .15s;}
.login-btn:hover{filter:brightness(.92);}
.login-error{margin-top:12px;font-size:13px;color:var(--red);display:none;
  padding:8px;background:var(--red-lt);border-radius:7px;}

/* ── 앱 ── */
#app-wrap{display:none;min-height:100vh;flex-direction:column;}

/* 상단바 */
.topbar{background:#fff;border-bottom:1px solid var(--border2);height:56px;padding:0 24px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;
  box-shadow:0 1px 6px rgba(24,95,165,.07);}
.tb-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.tb-mark{width:30px;height:30px;background:var(--blue);border-radius:7px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;}
.tb-name{font-size:15px;font-weight:800;color:var(--blue);}
.tb-sub{font-size:11px;color:var(--text3);}
.tb-sep{color:var(--border);font-size:20px;margin:0 2px;}
.tb-cur{font-size:14px;font-weight:600;color:var(--text2);}
.tb-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.user-chip{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;
  border:1px solid var(--border);border-radius:20px;}
.u-avatar{width:26px;height:26px;background:var(--blue);color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.u-name{font-size:13px;font-weight:600;color:var(--text);}
.logout-btn{font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;
  font-family:var(--font);padding:5px 9px;border-radius:6px;transition:all .15s;}
.logout-btn:hover{background:var(--red-lt);color:var(--red);}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-family:var(--font);
  cursor:pointer;border:none;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:5px;}
.btn:hover{filter:brightness(.92);}
.btn-primary{background:var(--blue);color:#fff;}
.btn-ghost{background:var(--bg2);color:var(--text2);border:1px solid var(--border);}
.btn-red{background:var(--red);color:#fff;}
#write-btn{display:none;}

/* 본문 레이아웃 */
.main-layout{display:flex;height:calc(100vh - 56px);}

/* 카테고리 사이드바 */
.cat-sidebar{width:160px;flex-shrink:0;border-right:1px solid var(--border2);
  background:#fff;padding:16px 10px;display:flex;flex-direction:column;gap:4px;}
.cat-tab{width:100%;padding:9px 12px;border-radius:8px;font-size:13px;font-family:var(--font);
  color:var(--text2);cursor:pointer;border:none;background:none;text-align:left;
  font-weight:500;transition:all .15s;}
.cat-tab.active{background:var(--blue);color:#fff;font-weight:700;}
.cat-tab:hover:not(.active){background:var(--bg3);color:var(--blue);}

/* 목록 패널 */
.list-panel{flex:1;overflow-y:auto;padding:20px;}
.list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.list-title{font-size:16px;font-weight:700;color:var(--text);}
#cat-tabs{display:none;}

/* 공지 카드 */
.ncard{background:#fff;border:1px solid var(--border2);border-radius:12px;padding:16px;
  margin-bottom:10px;cursor:pointer;transition:all .18s;}
.ncard:hover{box-shadow:0 4px 16px rgba(0,0,0,.09);border-color:var(--border);}
.ncard.pinned{border-left:3px solid var(--amber);}
.ncard-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.4;}
.ncard-preview{font-size:12px;color:var(--text3);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ncard-date{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0;margin-top:2px;}
.cat-badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px;white-space:nowrap;}

/* 상세 패널 */
.detail-panel{width:480px;flex-shrink:0;border-left:1px solid var(--border2);
  background:#fff;overflow-y:auto;padding:24px;display:none;}
.notice-body{font-size:14px;line-height:1.85;color:var(--text);white-space:pre-wrap;
  word-break:break-word;font-family:var(--font);}

/* 에디터 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
  align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:600px;
  max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-title{font-size:17px;font-weight:700;margin-bottom:18px;color:var(--text);}
.lbl{font-size:13px;color:var(--text2);margin-bottom:5px;font-weight:500;}
.fg{margin-bottom:13px;}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;font-family:var(--font);background:var(--bg);
  color:var(--text);outline:none;transition:border .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,.1);}
textarea{resize:vertical;min-height:260px;}

/* 반응형 */
@media(max-width:900px){.detail-panel{width:380px;}}
@media(max-width:767px){
  .cat-sidebar{display:none;}
  #cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .cat-tab{padding:6px 12px;border:1px solid var(--border);border-radius:20px;}
  .detail-panel{position:fixed;inset:0;width:100%;border-left:none;z-index:200;padding:16px;
    overflow-y:auto;background:#fff;}
  .list-panel{padding:14px;}
}
</style>
