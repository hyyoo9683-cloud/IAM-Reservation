<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAM 인트라넷 — 아이엠센터</title>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut,
  onAuthStateChanged, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, collection, getDocs }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyCSHQFknw_hsxNMCvrBDer3z0cB4mG347w",
  authDomain:        "iamreservation.firebaseapp.com",
  projectId:         "iamreservation",
  storageBucket:     "iamreservation.firebasestorage.app",
  messagingSenderId: "634977833386",
  appId:             "1:634977833386:web:043a9acab5b2b229f75bd3"
};

const ALLOWED_DOMAIN = "suwoncca.org";
const ADMIN_EMAILS   = ["hyyoo9683@gmail.com"];

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

setPersistence(auth, browserLocalPersistence).catch(console.error);

onAuthStateChanged(auth, async user => {
  if (!user) { showLogin(); return; }
  const domain  = user.email.split('@')[1];
  const allowed = domain === ALLOWED_DOMAIN || ADMIN_EMAILS.includes(user.email);
  if (!allowed) {
    await signOut(auth);
    showLoginError('이 서비스는 아이엠센터 구성원만 이용할 수 있습니다.');
    return;
  }
  showPortal(user);
});

function showLogin() {
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('portal-wrap').style.display = 'none';
}
function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.style.display = 'block';
  showLogin();
}

async function showPortal(user) {
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('portal-wrap').style.display = 'block';

  const initial = (user.displayName || user.email)[0].toUpperCase();
  document.getElementById('user-avatar').textContent = initial;
  document.getElementById('user-name').textContent   = user.displayName || user.email.split('@')[0];

  const h = new Date().getHours();
  const greet = h < 6 ? '좋은 새벽이에요' : h < 12 ? '좋은 아침이에요' : h < 18 ? '안녕하세요' : '수고 많으셨어요';
  const fname = user.displayName ? user.displayName.replace(/\s/g,'') + '님' : '';
  document.getElementById('greeting').textContent = `${greet}${fname ? ', ' + fname : ''} 👋`;

  const now  = new Date();
  const DAYS = ['일','월','화','수','목','금','토'];
  document.getElementById('today-date').textContent =
    `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${DAYS[now.getDay()]})`;

  loadStats();
}

async function loadStats() {
  try {
    const today = new Date().toISOString().slice(0,10);
    const snap  = await getDocs(collection(db, 'reservations'));
    const all   = snap.docs.map(d => d.data());
    document.getElementById('stat-today').textContent   = all.filter(r => r.date === today && r.status === '확정').length;
    document.getElementById('stat-pending').textContent = all.filter(r => r.status === '대기').length;
  } catch(e) { console.error('Stats error:', e); }
}

window.doLogin = async () => {
  document.getElementById('login-error').style.display = 'none';
  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    await signInWithPopup(auth, provider);
  } catch(e) {
    if (e.code !== 'auth/popup-closed-by-user')
      showLoginError('로그인에 실패했습니다. 다시 시도해주세요.');
  }
};
window.doLogout = async () => { await signOut(auth); };

window.comingSoon = (name) => {
  const t = document.getElementById('toast');
  t.textContent = `${name} 메뉴는 준비 중입니다`;
  t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; }, 2200);
};

function tick() {
  const now = new Date();
  const el  = document.getElementById('clock');
  if (el) el.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}
tick();
setInterval(tick, 15000);
</script>

<style>
:root {
  --blue:     #185FA5;
  --blue-lt:  #E6F1FB;
  --blue-mid: #378ADD;
  --green:    #3B6D11;
  --green-lt: #EAF3DE;
  --amber:    #854F0B;
  --amber-lt: #FAEEDA;
  --red:      #A32D2D;
  --red-lt:   #FCEBEB;
  --purple:   #5B3FA6;
  --purple-lt:#EDE8FF;
  --teal:     #0E7490;
  --teal-lt:  #E0F5F9;
  --bg:       #ffffff;
  --bg2:      #F8FAFD;
  --bg3:      #F0F6FF;
  --border:   #D4E4F4;
  --border2:  #E8EFF7;
  --text:     #1A2533;
  --text2:    #4A6078;
  --text3:    #8AA3BC;
  --font:     'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg2); color:var(--text); min-height:100vh; }

/* ── 로그인 ── */
#login-wrap {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#0d2e5e 0%,#185FA5 55%,#378ADD 100%);
}
.login-card {
  background:#fff; border-radius:20px; padding:48px 40px; width:360px;
  text-align:center; box-shadow:0 24px 64px rgba(0,0,0,.28);
}
.login-emblem { font-size:44px; margin-bottom:14px; }
.login-title  { font-size:22px; font-weight:800; color:var(--text); margin-bottom:4px; letter-spacing:-.3px; }
.login-sub    { font-size:13px; color:var(--text3); margin-bottom:32px; line-height:1.5; }
.login-btn {
  width:100%; padding:14px; border-radius:10px; border:none; cursor:pointer;
  background:var(--blue); color:#fff; font-size:15px; font-weight:700;
  font-family:var(--font); display:flex; align-items:center; justify-content:center;
  gap:10px; transition:filter .15s;
}
.login-btn:hover { filter:brightness(.92); }
.login-error { margin-top:12px; font-size:13px; color:var(--red); display:none; padding:8px; background:var(--red-lt); border-radius:7px; }

/* ── 포털 ── */
#portal-wrap { display:none; min-height:100vh; }

/* 상단바 */
.topbar {
  background:#fff; border-bottom:1px solid var(--border2);
  height:56px; padding:0 28px; display:flex; align-items:center; gap:14px;
  position:sticky; top:0; z-index:100; box-shadow:0 1px 6px rgba(24,95,165,.07);
}
.tb-logo { display:flex; align-items:center; gap:10px; flex:1; text-decoration:none; }
.tb-mark {
  width:32px; height:32px; background:var(--blue); border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:13px; font-weight:800; letter-spacing:-.5px; flex-shrink:0;
}
.tb-name { font-size:16px; font-weight:800; color:var(--blue); letter-spacing:-.2px; }
.tb-sub  { font-size:11px; color:var(--text3); }
.tb-clock { font-size:17px; font-weight:700; color:var(--text2); letter-spacing:.05em; }
.user-chip {
  display:flex; align-items:center; gap:8px; padding:5px 12px 5px 6px;
  border:1px solid var(--border); border-radius:20px; cursor:default;
}
.u-avatar {
  width:28px; height:28px; background:var(--blue); color:#fff; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
}
.u-name { font-size:13px; font-weight:600; color:var(--text); }
.logout-btn {
  font-size:12px; color:var(--text3); background:none; border:none; cursor:pointer;
  font-family:var(--font); padding:5px 10px; border-radius:6px; transition:all .15s;
}
.logout-btn:hover { background:var(--red-lt); color:var(--red); }

/* 본문 */
.content { max-width:1080px; margin:0 auto; padding:36px 24px 60px; }

/* 웰컴 배너 */
.welcome {
  background:linear-gradient(130deg,#0d2e5e,#185FA5 60%,#378ADD);
  border-radius:16px; padding:28px 32px; color:#fff;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  margin-bottom:32px; flex-wrap:wrap;
}
.welcome h1 { font-size:21px; font-weight:700; margin-bottom:5px; }
.welcome p  { font-size:13px; opacity:.75; }
.w-stats { display:flex; gap:28px; }
.w-stat { text-align:center; }
.w-stat-n { font-size:30px; font-weight:800; line-height:1; }
.w-stat-l { font-size:11px; opacity:.7; margin-top:4px; letter-spacing:.02em; }

/* 섹션 */
.sec-hd { font-size:11px; font-weight:700; color:var(--text3); letter-spacing:.1em; text-transform:uppercase; margin-bottom:14px; }

/* 모듈 그리드 */
.module-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-bottom:40px; }

.mcard {
  background:#fff; border:1px solid var(--border2); border-radius:14px; padding:22px 20px 18px;
  text-decoration:none; color:inherit; display:flex; flex-direction:column;
  position:relative; overflow:hidden; cursor:pointer; transition:transform .18s,box-shadow .18s,border-color .18s;
}
.mcard:hover { transform:translateY(-3px); box-shadow:0 10px 28px rgba(0,0,0,.1); border-color:var(--border); }
.mcard::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
.mcard.c-blue::before   { background:var(--blue); }
.mcard.c-green::before  { background:var(--green); }
.mcard.c-amber::before  { background:var(--amber); }
.mcard.c-purple::before { background:var(--purple); }
.mcard.c-teal::before   { background:var(--teal); }

.mcard-icon  { font-size:28px; margin-bottom:12px; }
.mcard-title { font-size:15px; font-weight:700; color:var(--text); margin-bottom:5px; }
.mcard-desc  { font-size:12px; color:var(--text3); line-height:1.55; flex:1; }
.mcard-foot  { margin-top:14px; font-size:12px; color:var(--text3); }

.mcard-badge-soon {
  position:absolute; top:14px; right:14px;
  background:var(--amber-lt); color:var(--amber);
  font-size:10px; font-weight:700; padding:2px 8px; border-radius:8px;
}
.mcard-badge-live {
  position:absolute; top:14px; right:14px;
  background:var(--green-lt); color:var(--green);
  font-size:10px; font-weight:700; padding:2px 8px; border-radius:8px;
}
.mcard-badge-cnt {
  position:absolute; top:14px; right:14px;
  background:var(--red); color:#fff;
  font-size:11px; font-weight:700; padding:2px 9px; border-radius:10px;
}

/* 토스트 */
#toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
  background:var(--text); color:#fff; padding:12px 24px; border-radius:10px;
  font-size:14px; font-weight:600; z-index:9999; opacity:0; transition:opacity .3s;
  pointer-events:none; white-space:nowrap;
}

/* 반응형 */
@media(max-width:600px){
  .content { padding:20px 14px 40px; }
  .welcome { padding:22px 20px; }
  .welcome h1 { font-size:18px; }
  .topbar { padding:0 16px; }
  .tb-clock { display:none; }
  .module-grid { grid-template-columns:1fr 1fr; gap:10px; }
  .mcard { padding:16px 14px 14px; }
  .mcard-icon { font-size:24px; margin-bottom:10px; }
}
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="login-wrap">
  <div class="login-card">
    <div class="login-emblem">✝️</div>
    <div class="login-title">IAM 인트라넷</div>
    <div class="login-sub">아이엠센터 구성원 전용<br>통합 업무 시스템</div>
    <button class="login-btn" onclick="doLogin()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.258h2.908C16.658 14.251 17.64 11.942 17.64 9.2z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Google 계정으로 로그인
    </button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<!-- 포털 화면 -->
<div id="portal-wrap">

  <!-- 상단바 -->
  <div class="topbar">
    <a class="tb-logo" href="portal.html">
      <div class="tb-mark">IM</div>
      <div>
        <div class="tb-name">IAM 인트라넷</div>
        <div class="tb-sub">아이엠센터</div>
      </div>
    </a>
    <div class="tb-clock" id="clock">00:00</div>
    <div class="user-chip">
      <div class="u-avatar" id="user-avatar">?</div>
      <span class="u-name" id="user-name"></span>
    </div>
    <button class="logout-btn" onclick="doLogout()">로그아웃</button>
  </div>

  <!-- 본문 -->
  <div class="content">

    <!-- 웰컴 배너 -->
    <div class="welcome">
      <div>
        <h1 id="greeting">안녕하세요 👋</h1>
        <p id="today-date"></p>
      </div>
      <div class="w-stats">
        <div class="w-stat">
          <div class="w-stat-n" id="stat-today">—</div>
          <div class="w-stat-l">오늘 확정 예약</div>
        </div>
        <div class="w-stat">
          <div class="w-stat-n" id="stat-pending">—</div>
          <div class="w-stat-l">승인 대기</div>
        </div>
      </div>
    </div>

    <!-- 모듈 카드 -->
    <div class="sec-hd">메뉴</div>
    <div class="module-grid">

      <a class="mcard c-blue" href="index.html">
        <div class="mcard-badge-live">운영 중</div>
        <div class="mcard-icon">📅</div>
        <div class="mcard-title">공간 예약</div>
        <div class="mcard-desc">회의실·소그룹실·홀 예약 신청 및 승인 관리</div>
        <div class="mcard-foot">예약 관리 →</div>
      </a>

      <a class="mcard c-green" href="quotation.html">
        <div class="mcard-badge-live">운영 중</div>
        <div class="mcard-icon">📋</div>
        <div class="mcard-title">견적서</div>
        <div class="mcard-desc">아론홀·샤론홀 대관료 계산 · 견적서 인쇄 · 발행 이력</div>
        <div class="mcard-foot">견적서 발급 →</div>
      </a>

      <a class="mcard c-amber" href="notice.html">
        <div class="mcard-badge-live">운영 중</div>
        <div class="mcard-icon">📣</div>
        <div class="mcard-title">공지사항</div>
        <div class="mcard-desc">센터 공지 · 이용 규정 · 팀 소식 공유</div>
        <div class="mcard-foot">공지 보기 →</div>
      </a>

      <a class="mcard c-purple" href="venue.html">
        <div class="mcard-icon">🏛️</div>
        <div class="mcard-title">대관 신청 관리</div>
        <div class="mcard-desc">대관 신청 접수 · 팀별 메모 · 승인 관리</div>
        <div class="mcard-foot">신청 현황 →</div>
      </a>

    </div>

  </div><!-- /content -->
</div><!-- /portal-wrap -->

<div id="toast"></div>

</body>
</html>
