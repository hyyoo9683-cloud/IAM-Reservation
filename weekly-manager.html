<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간 예약 현황 — 아이엠센터</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#185FA5; --blue-lt:#EBF4FF;
  --green-lt:#EAF3DE;
  --border:#D4E4F4; --border2:#E8EFF7;
  --bg:#F8FAFD; --bg2:#fff;
  --text:#1A2533; --text2:#4A6078; --text3:#8AA3BC;
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

/* 상단바 */
.topbar{
  background:var(--blue);color:#fff;
  padding:14px 20px;
  display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:100;
}
.topbar h1{font-size:17px;font-weight:800;}
.topbar .sub{font-size:13px;opacity:.75;margin-left:6px;}

/* 주간 네비 */
.week-nav{
  background:#fff;border-bottom:1px solid var(--border2);
  padding:10px 16px;
  display:flex;align-items:center;gap:8px;
  position:sticky;top:52px;z-index:99;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.week-label{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--text);}
.wbtn{
  background:var(--bg);border:1px solid var(--border);color:var(--blue);
  padding:6px 13px;border-radius:7px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:var(--font);transition:all .15s;white-space:nowrap;
}
.wbtn:hover{background:var(--blue-lt);}
.wbtn.today-btn{background:var(--blue);color:#fff;border-color:var(--blue);}

/* 본문 */
.body{padding:16px;max-width:900px;margin:0 auto;}

/* 요약 */
.summary{
  display:flex;gap:8px;flex-wrap:wrap;
  margin-bottom:16px;
  padding:10px 14px;
  background:#fff;border:1px solid var(--border2);border-radius:10px;
  font-size:13px;
}
.sum-chip{
  font-weight:600;padding:2px 10px;border-radius:7px;
  background:var(--blue-lt);color:var(--blue);
}

/* 섹션 */
.section{margin-bottom:24px;}
.section-title{
  font-size:13px;font-weight:700;color:var(--text2);
  padding:7px 12px;
  background:var(--border2);border-radius:7px 7px 0 0;
  border:1px solid var(--border);border-bottom:none;
}

/* 표 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:0 0 8px 8px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;background:#fff;}
thead th{
  background:#f0f5fb;
  padding:9px 10px;
  font-size:12px;font-weight:700;color:var(--text2);
  text-align:center;white-space:nowrap;
  border-bottom:2px solid var(--border);
}
thead th:first-child{text-align:center;width:88px;}
thead th:nth-child(2){width:80px;}
thead th:nth-child(3){width:96px;}
thead th:nth-child(4){width:120px;}

td{
  padding:9px 10px;
  font-size:13px;color:var(--text);
  border-bottom:1px solid var(--border2);
  vertical-align:middle;
}
tr:last-child td{border-bottom:none;}

/* 담당자 셀 */
.mgr-cell{
  font-weight:700;font-size:13px;
  text-align:center;
  border-right:2px solid var(--border);
  vertical-align:middle;
  white-space:nowrap;
}

/* 줄 교대 색 */
.row-a td{background:#fff;}
.row-b td{background:#F0F6FF;}

/* 날짜·시간 */
.td-date{text-align:center;white-space:nowrap;font-size:12px;font-weight:600;color:var(--text2);}
.td-date .dow{
  display:inline-block;font-size:11px;
  padding:1px 4px;border-radius:4px;margin-left:2px;
  font-weight:700;
}
.td-time{text-align:center;white-space:nowrap;font-size:12px;font-weight:700;color:var(--blue);}
.td-room{text-align:center;font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap;}
.td-purpose{font-size:13px;color:var(--text);}

/* 빈/로딩 */
.empty{text-align:center;padding:40px;color:var(--text3);font-size:14px;
  background:#fff;border:1px solid var(--border);border-radius:0 0 8px 8px;}
.loading{text-align:center;padding:48px;color:var(--text3);}

@media(max-width:540px){
  .body{padding:10px;}
  td,thead th{padding:8px 7px;font-size:12px;}
  .td-purpose{font-size:12px;}
  .topbar h1{font-size:15px;}
  .wbtn{padding:5px 9px;font-size:12px;}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>📅 주간 예약 현황</h1>
  <span class="sub">아이엠센터</span>
</div>

<div class="week-nav">
  <button class="wbtn" onclick="changeWeek(-1)">◀ 이전주</button>
  <div class="week-label" id="week-label">불러오는 중…</div>
  <button class="wbtn today-btn" onclick="changeWeek(0)">이번주</button>
  <button class="wbtn" onclick="changeWeek(1)">다음주 ▶</button>
</div>

<div class="body">
  <div id="summary" class="summary" style="display:none"></div>
  <div id="content"><div class="loading">불러오는 중…</div></div>
</div>

<script type="module">
import { initializeApp }  from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
import { getFirestore, collection, onSnapshot }
  from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

const app = initializeApp({
  apiKey:            "AIzaSyCSHQFknw_hsxNMCvrBDer3z0cB4mG347w",
  authDomain:        "iamreservation.firebaseapp.com",
  projectId:         "iamreservation",
  storageBucket:     "iamreservation.firebasestorage.app",
  messagingSenderId: "634977833386",
  appId:             "1:634977833386:web:4add20f3b8cd5c80c67fc8"
});
const db = getFirestore(app);

const SECTIONS = [
  { label:'5층 소그룹실', rooms:['505호','506호','507호','508호','509호','510호','511호'] },
  { label:'아론홀',       rooms:['아론홀'] },
  { label:'샤론홀',       rooms:['샤론홀'] },
];
const DOWS      = ['일','월','화','수','목','금','토'];
const DOW_COLOR = { '일':'#D04F7B','토':'#7B4FD0' };

let reservations = [];
let weekOffset   = 1; // 기본: 다음 주

const toStr = d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function getWeekRange(off) {
  const today = new Date();
  const daysSinceSat = (today.getDay() + 1) % 7;
  const sat = new Date(today);
  sat.setDate(today.getDate() - daysSinceSat + off * 7);
  const fri = new Date(sat); fri.setDate(sat.getDate() + 6);
  return { sat, fri };
}

function render() {
  const { sat, fri } = getWeekRange(weekOffset);
  const satStr = toStr(sat), friStr = toStr(fri);

  document.getElementById('week-label').textContent =
    `${sat.getFullYear()}년  ${sat.getMonth()+1}/${sat.getDate()}(토) – ${fri.getMonth()+1}/${fri.getDate()}(금)`;

  const weekRes = reservations.filter(r =>
    r.status === '확정' && r.date >= satStr && r.date <= friStr
  );

  // 요약
  const sumEl = document.getElementById('summary');
  if (!weekRes.length) {
    sumEl.style.display = 'none';
  } else {
    sumEl.style.display = 'flex';
    const managers = [...new Set(weekRes.map(r => r.managerName?.trim() || '미지정'))];
    sumEl.innerHTML =
      `<span class="sum-chip">총 ${weekRes.length}건</span>` +
      `<span class="sum-chip">담당자 ${managers.length}명</span>`;
  }

  // 섹션별 렌더
  const content = document.getElementById('content');
  if (!weekRes.length) {
    content.innerHTML = `<div class="empty">이번 주 확정 예약이 없습니다.</div>`;
    return;
  }

  content.innerHTML = SECTIONS.map(sec => {
    const secRes = weekRes.filter(r => sec.rooms.includes(r.room));
    if (!secRes.length) return '';

    // 담당자별 그룹
    const grouped = {};
    secRes.forEach(r => {
      const key = r.managerName?.trim() || '미지정';
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(r);
    });

    const managers = Object.keys(grouped).sort((a,b) => {
      if (a==='미지정') return 1; if (b==='미지정') return -1;
      return a.localeCompare(b, 'ko');
    });

    let rows = '';
    managers.forEach((mgr, idx) => {
      const cls  = idx % 2 === 0 ? 'row-a' : 'row-b';
      const list = grouped[mgr].slice().sort((a,b) =>
        a.date.localeCompare(b.date) || a.start.localeCompare(b.start)
      );

      list.forEach((r, i) => {
        const d    = new Date(r.date + 'T00:00:00');
        const dow  = DOWS[d.getDay()];
        const dcol = DOW_COLOR[dow] || '';
        const dowEl = dcol
          ? `<span class="dow" style="background:${dcol}20;color:${dcol}">${dow}</span>`
          : `<span class="dow" style="background:#E8EFF7;color:var(--text2)">${dow}</span>`;
        const room = r.room.replace(/호/g,'');
        const purpose = r.purpose || r.org || '';

        rows += `<tr class="${cls}">`;
        if (i === 0) {
          rows += `<td class="mgr-cell" rowspan="${list.length}">${mgr}</td>`;
        }
        rows += `
          <td class="td-date">${d.getMonth()+1}/${d.getDate()}${dowEl}</td>
          <td class="td-time">${r.start}–${r.end}</td>
          <td class="td-room">${room}</td>
          <td class="td-purpose">${purpose}</td>
        </tr>`;
      });
    });

    return `<div class="section">
      <div class="section-title">${sec.label}</div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>예약책임자</th><th>날짜</th><th>시간</th><th>예약실</th><th>예약항목</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  if (!content.innerHTML.trim()) {
    content.innerHTML = `<div class="empty">이번 주 확정 예약이 없습니다.</div>`;
  }
}

window.changeWeek = dir => {
  weekOffset = dir === 0 ? 0 : weekOffset + dir;
  render();
};

onSnapshot(collection(db,'reservations'), snap => {
  reservations = snap.docs.map(d => ({id:d.id,...d.data()}));
  render();
});
</script>
</body>
</html>
