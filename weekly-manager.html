<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간 예약 현황 — 아이엠센터</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#185FA5; --blue-lt:#EBF4FF;
  --green-lt:#EAF3DE;
  --border:#D4E4F4; --border2:#E8EFF7;
  --bg:#F8FAFD; --bg2:#fff;
  --text:#1A2533; --text2:#4A6078; --text3:#8AA3BC;
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

/* 상단바 */
.topbar{
  background:var(--blue);color:#fff;
  padding:14px 20px;
  display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:100;
}
.topbar h1{font-size:17px;font-weight:800;}
.topbar .sub{font-size:13px;opacity:.75;margin-left:6px;}

/* 주간 네비 */
.week-nav{
  background:#fff;border-bottom:1px solid var(--border2);
  padding:10px 16px;
  display:flex;align-items:center;gap:8px;
  position:sticky;top:52px;z-index:99;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.week-label{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--text);}
.wbtn{
  background:var(--bg);border:1px solid var(--border);color:var(--blue);
  padding:6px 13px;border-radius:7px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:var(--font);transition:all .15s;white-space:nowrap;
}
.wbtn:hover{background:var(--blue-lt);}
.wbtn.today-btn{background:var(--blue);color:#fff;border-color:var(--blue);}

/* 본문 */
.body{padding:16px;max-width:900px;margin:0 auto;}

/* 요약 */
.summary{
  display:flex;gap:8px;flex-wrap:wrap;
  margin-bottom:16px;
  padding:10px 14px;
  background:#fff;border:1px solid var(--border2);border-radius:10px;
  font-size:13px;
}
.sum-chip{
  font-weight:600;padding:2px 10px;border-radius:7px;
  background:var(--blue-lt);color:var(--blue);
}

/* 섹션 */
.section{margin-bottom:24px;}
.section-title{
  font-size:13px;font-weight:700;color:var(--text2);
  padding:7px 12px;
  background:var(--border2);border-radius:7px 7px 0 0;
  border:1px solid var(--border);border-bottom:none;
}

/* 표 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:0 0 8px 8px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;background:#fff;}
thead th{
  background:#f0f5fb;
  padding:9px 10px;
  font-size:12px;font-weight:700;color:var(--text2);
  text-align:center;white-space:nowrap;
  border-bottom:2px solid var(--border);
}
thead th:first-child{text-align:center;width:88px;}
thead th:nth-child(2){width:80px;}
thead th:nth-child(3){width:96px;}
thead th:nth-child(4){width:120px;}

td{
  padding:9px 10px;
  font-size:13px;color:var(--text);
  border-bottom:1px solid var(--border2);
  vertical-align:middle;
}
tr:last-child td{border-bottom:none;}

/* 담당자 셀 */
.mgr-cell{
  font-weight:700;font-size:13px;
  text-align:center;
  border-right:2px solid var(--border);
  vertical-align:middle;
  white-space:nowrap;
}

/* 줄 교대 색 */
.row-a td{background:#fff;}
.row-b td{background:#F0F6FF;}

/* 날짜·시간 */
.td-date{text-align:center;white-space:nowrap;font-size:12px;font-weight:600;color:var(--text2);}
.td-date .dow{
  display:inline-block;font-size:11px;
  padding:1px 4px;border-radius:4px;margin-left:2px;
  font-weight:700;
}
.td-time{text-align:center;white-space:nowrap;font-size:12px;font-weight:700;color:var(--blue);}
.td-room{text-align:left;font-size:12px;font-weight:600;color:var(--text2);line-height:1.7;}
.td-purpose{font-size:13px;color:var(--text);}

/* 빈/로딩 */
.empty{text-align:center;padding:40px;color:var(--text3);font-size:14px;
  background:#fff;border:1px solid var(--border);border-radius:0 0 8px 8px;}
.loading{text-align:center;padding:48px;color:var(--text3);}

@media(max-width:540px){
  .body{padding:10px;}
  td,thead th{padding:8px 7px;font-size:12px;}
  .td-purpose{font-size:12px;}
  .topbar h1{font-size:15px;}
  .wbtn{padding:5px 9px;font-size:12px;}
}
.dl-btn{background:#1A2533;color:#fff;border-color:#1A2533;}
.dl-btn:hover{background:#2d3d50;border-color:#2d3d50;}
.dl-btn:disabled{opacity:.5;cursor:not-allowed;}
</style>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>

<div class="topbar">
  <h1>📅 주간 예약 현황</h1>
  <span class="sub">아이엠센터</span>
</div>

<div class="week-nav">
  <button class="wbtn" onclick="changeWeek(-1)">◀ 이전주</button>
  <div class="week-label" id="week-label">불러오는 중…</div>
  <button class="wbtn today-btn" onclick="changeWeek(0)">이번주</button>
  <button class="wbtn" onclick="changeWeek(1)">다음주 ▶</button>
  <button class="wbtn dl-btn" id="dl-btn" onclick="downloadImages()">📥 저장</button>
</div>

<div class="body">
  <div id="summary" class="summary" style="display:none"></div>
  <div id="content"><div class="loading">불러오는 중…</div></div>
</div>

<script type="module">
import { initializeApp }  from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
import { getFirestore, collection, onSnapshot }
  from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

const app = initializeApp({
  apiKey:            "AIzaSyCSHQFknw_hsxNMCvrBDer3z0cB4mG347w",
  authDomain:        "iamreservation.firebaseapp.com",
  projectId:         "iamreservation",
  storageBucket:     "iamreservation.firebasestorage.app",
  messagingSenderId: "634977833386",
  appId:             "1:634977833386:web:4add20f3b8cd5c80c67fc8"
});
const db = getFirestore(app);

const SECTIONS = [
  { key:'5f',     label:'5층 소그룹실', rooms:['505호','506호','507호','508호','509호','510호','511호'] },
  { key:'aaron',  label:'아론홀',       rooms:['아론홀'] },
  { key:'sharon', label:'샤론홀',       rooms:['샤론홀'] },
];
const DOWS      = ['일','월','화','수','목','금','토'];
const DOW_COLOR = { '일':'#D04F7B','토':'#7B4FD0' };
const MGR_CHUNK = 8; // 5층 이미지당 담당자 수

let reservations = [];
let weekOffset   = 1;

// 다운로드용 처리된 섹션 데이터
// '5f'   : [{mgr, list}]  (담당자별)
// 'aaron', 'sharon': [{group}]  (날짜순)
let sectionData = { '5f': [], 'aaron': [], 'sharon': [] };

const toStr = d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function getWeekRange(off) {
  const today = new Date();
  const daysSinceSat = (today.getDay() + 1) % 7;
  const sat = new Date(today);
  sat.setDate(today.getDate() - daysSinceSat + off * 7);
  const fri = new Date(sat); fri.setDate(sat.getDate() + 6);
  const sun = new Date(sat); sun.setDate(sat.getDate() + 8); // 주일 (다음 일요일)
  return { sat, fri, sun };
}

// ── 행 HTML 생성 (모듈 최상단) ──
function buildRow(group, mgrLabel, rowspan, cls) {
  const r   = group[0];
  const d   = new Date(r.date + 'T00:00:00');
  const dow = DOWS[d.getDay()];
  const dc  = DOW_COLOR[dow] || '';
  const dowEl = `<span class="dow" style="background:${dc?dc+'20':'#E8EFF7'};color:${dc||'var(--text2)'};">${dow}</span>`;
  const roomList = group
    .map(g => g.room)
    .sort((a,b) => (parseInt(a)||0) - (parseInt(b)||0))
    .map(rm => /^\d/.test(rm) ? rm.replace(/호?$/, '')+'호' : rm);
  const chunks = [];
  for (let i = 0; i < roomList.length; i += 4) chunks.push(roomList.slice(i,i+4).join(', '));
  const rooms   = chunks.join('<br>');
  const purpose = [...new Set(group.map(g => g.purpose||g.org||'').filter(Boolean))].join(' / ');

  let html = `<tr class="${cls}">`;
  if (mgrLabel !== null) {
    html += rowspan
      ? `<td class="mgr-cell" rowspan="${rowspan}">${mgrLabel}</td>`
      : `<td class="mgr-cell">${mgrLabel}</td>`;
  }
  html += `
    <td class="td-date">${d.getMonth()+1}/${d.getDate()}${dowEl}</td>
    <td class="td-time">${r.start}–${r.end}</td>
    <td class="td-room">${rooms}</td>
    <td class="td-purpose">${purpose}</td>
  </tr>`;
  return html;
}

// ── 담당자 배열로 tbody HTML 생성 ──
function buildMgrRows(mgrList) {
  let rows = '';
  mgrList.forEach(({mgr, list}, idx) => {
    const cls = idx % 2 === 0 ? 'row-a' : 'row-b';
    list.forEach((group, i) => {
      rows += buildRow(group, i === 0 ? mgr : null, i === 0 ? list.length : null, cls);
    });
  });
  return rows;
}

// ── 섹션 HTML 조각 (레이블 + 표) ──
function buildSectionHTML(label, tbodyHTML) {
  return `<div class="section">
    <div class="section-title">${label}</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>예약책임자</th><th>날짜</th><th>시간</th><th>예약실</th><th>예약항목</th>
        </tr></thead>
        <tbody>${tbodyHTML}</tbody>
      </table>
    </div>
  </div>`;
}

function render() {
  const { sat, fri, sun } = getWeekRange(weekOffset);
  const satStr = toStr(sat), friStr = toStr(fri), sunStr = toStr(sun);

  document.getElementById('week-label').textContent =
    `${sat.getFullYear()}년  ${sat.getMonth()+1}/${sat.getDate()}(토) – ${fri.getMonth()+1}/${fri.getDate()}(금)`;

  const weekRes = reservations.filter(r =>
    r.status === '확정' && r.date >= satStr && r.date <= sunStr
  );

  const sumEl = document.getElementById('summary');
  if (!weekRes.length) {
    sumEl.style.display = 'none';
  } else {
    sumEl.style.display = 'flex';
    const mgrs = [...new Set(weekRes.map(r => r.managerName?.trim() || '미지정'))];
    sumEl.innerHTML =
      `<span class="sum-chip">총 ${weekRes.length}건</span>` +
      `<span class="sum-chip">담당자 ${mgrs.length}명</span>`;
  }

  const content = document.getElementById('content');
  if (!weekRes.length) {
    content.innerHTML = `<div class="empty">이번 주 확정 예약이 없습니다.</div>`;
    sectionData = { '5f': [], 'aaron': [], 'sharon': [] };
    return;
  }

  let html = '';
  SECTIONS.forEach(sec => {
    // 5층은 토~금, 아론홀·샤론홀은 토~주일
    const endStr = sec.key === '5f' ? friStr : sunStr;
    const secRes = weekRes.filter(r => sec.rooms.includes(r.room) && r.date <= endStr);
    if (!secRes.length) { sectionData[sec.key] = []; return; }

    if (sec.key === '5f') {
      // 담당자별 그룹 → 가나다 정렬
      const grouped = {};
      secRes.forEach(r => {
        const k  = r.managerName?.trim() || '미지정';
        const tk = `${r.date}|${r.start}|${r.end}`;
        if (!grouped[k]) grouped[k] = {};
        if (!grouped[k][tk]) grouped[k][tk] = [];
        grouped[k][tk].push(r);
      });
      const mgrList = Object.keys(grouped)
        .sort((a,b) => a==='미지정'?1:b==='미지정'?-1:a.localeCompare(b,'ko'))
        .map(mgr => ({
          mgr,
          list: Object.values(grouped[mgr]).sort((a,b) =>
            a[0].date.localeCompare(b[0].date) || a[0].start.localeCompare(b[0].start))
        }));
      sectionData['5f'] = mgrList;
      html += `<div class="section" id="section-5f">
        <div class="section-title">5층 소그룹실</div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>예약책임자</th><th>날짜</th><th>시간</th><th>예약실</th><th>예약항목</th></tr></thead>
          <tbody>${buildMgrRows(mgrList)}</tbody>
        </table></div>
      </div>`;

    } else {
      // 날짜 순
      const timeMap = {};
      secRes.forEach(r => {
        const tk = `${r.managerName?.trim()||'미지정'}|${r.date}|${r.start}|${r.end}`;
        if (!timeMap[tk]) timeMap[tk] = [];
        timeMap[tk].push(r);
      });
      const dateList = Object.values(timeMap).sort((a,b) =>
        a[0].date.localeCompare(b[0].date) || a[0].start.localeCompare(b[0].start)
      );
      sectionData[sec.key] = dateList;
      const rows = dateList.map((group, idx) => {
        const mgr = group[0].managerName?.trim() || '미지정';
        return buildRow(group, mgr, null, idx%2===0?'row-a':'row-b');
      }).join('');
      html += `<div class="section" id="section-${sec.key}">
        <div class="section-title">${sec.label}</div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>예약책임자</th><th>날짜</th><th>시간</th><th>예약실</th><th>예약항목</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>`;
    }
  });

  content.innerHTML = html || `<div class="empty">이번 주 확정 예약이 없습니다.</div>`;
}

window.changeWeek = dir => {
  weekOffset = dir === 0 ? 0 : weekOffset + dir;
  render();
};

// ── 이미지 다운로드 ──
window.downloadImages = async () => {
  const btn = document.getElementById('dl-btn');
  btn.disabled = true; btn.textContent = '생성 중…';

  const { sat, fri } = getWeekRange(weekOffset);
  const weekStr = `${sat.getFullYear()}_${sat.getMonth()+1}${String(sat.getDate()).padStart(2,'0')}-${fri.getMonth()+1}${String(fri.getDate()).padStart(2,'0')}`;
  const opt = { scale: 2, backgroundColor: '#F8FAFD', useCORS: true };

  async function captureDiv(innerHTML, filename) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:-9999px;top:0;background:#F8FAFD;padding:12px;display:inline-block;';
    wrap.innerHTML = innerHTML;
    wrap.querySelectorAll('table').forEach(t => t.style.width = 'auto');
    wrap.querySelectorAll('.tbl-wrap').forEach(t => { t.style.overflow = 'visible'; });
    document.body.appendChild(wrap);
    const canvas = await html2canvas(wrap, opt);
    document.body.removeChild(wrap);
    saveCanvas(canvas, filename);
  }

  // 1. 5층 소그룹실: 5명씩 분할
  const mgrs = sectionData['5f'];
  if (mgrs.length) {
    const total = Math.ceil(mgrs.length / MGR_CHUNK);
    for (let i = 0; i < mgrs.length; i += MGR_CHUNK) {
      const chunk = mgrs.slice(i, i + MGR_CHUNK);
      const suffix = total > 1 ? `_${Math.floor(i/MGR_CHUNK)+1}` : '';
      await captureDiv(
        buildSectionHTML('5층 소그룹실', buildMgrRows(chunk.map((item,j)=>({...item,cls:j%2===0?'row-a':'row-b'})))),
        `5층소그룹실${suffix}_${weekStr}.png`
      );
    }
  }

  // 2. 아론홀 + 샤론홀 합치기
  const aaronRows  = (sectionData['aaron']||[]).map((g,i)=>buildRow(g,g[0].managerName?.trim()||'미지정',null,i%2===0?'row-a':'row-b')).join('');
  const sharonRows = (sectionData['sharon']||[]).map((g,i)=>buildRow(g,g[0].managerName?.trim()||'미지정',null,i%2===0?'row-a':'row-b')).join('');
  const hallHTML   = (aaronRows ? buildSectionHTML('아론홀', aaronRows) : '') +
                     (sharonRows ? buildSectionHTML('샤론홀', sharonRows) : '');
  if (hallHTML) await captureDiv(hallHTML, `아론홀샤론홀_${weekStr}.png`);

  btn.disabled = false; btn.textContent = '📥 저장';
};

function saveCanvas(canvas, filename) {
  const a = document.createElement('a');
  a.download = filename; a.href = canvas.toDataURL('image/png'); a.click();
}

onSnapshot(collection(db,'reservations'), snap => {
  reservations = snap.docs.map(d => ({id:d.id,...d.data()}));
  render();
});
</script>
</body>
</html>
