<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예약 현황</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #185FA5; --blue-lt: #EBF4FF;
    --green: #3B6D11; --green-lt: #F0FFF4;
    --amber: #92400E; --amber-lt: #FFFBEB;
    --red: #A32D2D;
    --bg: #FFFFFF; --bg2: #F7F8FA;
    --border: #D1D5DB; --border2: #E5E7EB;
    --text: #111827; --text2: #4B5563; --text3: #9CA3AF;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
         background: var(--bg); color: var(--text); font-size: 13px; }

  /* 헤더 */
  .header { background: var(--blue); color: #fff; padding: 12px 16px;
             display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .header h1 { font-size: 15px; font-weight: 700; }
  .week-label { font-size: 13px; opacity: .85; }
  .nav-btns { display: flex; gap: 6px; margin-left: auto; }
  .nav-btns button { background: rgba(255,255,255,.18); border: none; color: #fff;
                      padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .nav-btns button:hover { background: rgba(255,255,255,.3); }

  /* 탭 */
  .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); background: var(--bg); }
  .tab { flex: 1; padding: 10px 4px; text-align: center; font-size: 12px; font-weight: 600;
          color: var(--text3); cursor: pointer; border: none; background: none;
          border-bottom: 3px solid transparent; margin-bottom: -2px; transition: .15s; }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  /* 테이블 */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 420px; }
  th, td { border: 1px solid var(--border2); padding: 6px 5px; vertical-align: top; }
  th { background: var(--bg2); font-size: 11px; font-weight: 700; text-align: center;
        color: var(--text2); white-space: nowrap; }
  th.today-col { background: var(--blue-lt); color: var(--blue); }
  th.sun { color: #D04F7B; } th.sat { color: #7B4FD0; }
  .room-th { min-width: 64px; text-align: left; font-size: 11px; }

  /* 예약 칩 */
  .chip { border-radius: 5px; padding: 3px 5px; margin-bottom: 3px; font-size: 10px; line-height: 1.4; }
  .chip-ok   { background: var(--blue-lt);  color: var(--blue); }
  .chip-none { color: var(--text3); font-size: 10px; padding: 6px 2px; text-align: center; }
  .chip-blk  { background: #F5F5F5; color: #999; font-size: 10px; padding: 6px 2px; text-align: center; }
  .time { font-weight: 700; font-size: 10px; }
  .org  { font-size: 9px; opacity: .75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 단일홀 세로 레이아웃 */
  .date-th { min-width: 72px; text-align: left; font-size: 11px; font-weight: 700; }
  .empty-msg { text-align: center; padding: 40px; color: var(--text3); font-size: 13px; }
  .loading   { text-align: center; padding: 40px; color: var(--text3); }
</style>
</head>
<body>

<div class="header">
  <h1>📅 예약 현황</h1>
  <span class="week-label" id="week-label"></span>
  <div class="nav-btns">
    <button onclick="changeWeek(-1)">◀ 이전</button>
    <button onclick="changeWeek(0)">오늘</button>
    <button onclick="changeWeek(1)">다음 ▶</button>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="tbl-wrap"><div id="cal-body"><div class="loading">불러오는 중…</div></div></div>

<script type="module">
import { initializeApp }           from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
import { getFirestore, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

const app = initializeApp({
  apiKey:            "AIzaSyCSHQFknw_hsxNMCvrBDer3z0cB4mG347w",
  authDomain:        "iamreservation.firebaseapp.com",
  projectId:         "iamreservation",
  storageBucket:     "iamreservation.firebasestorage.app",
  messagingSenderId: "634977833386",
  appId:             "1:634977833386:web:4add20f3b8cd5c80c67fc8"
});
const db = getFirestore(app);

const TABS = [
  { key: '5f',     label: '5층 소그룹실', rooms: ['505호','506호','507호','508호','509호','510호','511호'] },
  { key: 'aaron',  label: '아론홀',        rooms: ['아론홀'] },
  { key: 'sharon', label: '샤론홀',        rooms: ['샤론홀'] },
];
const DOWS = ['일','월','화','수','목','금','토'];

let reservations = [], spaces = [], blockedDates = [];
let weekOffset = 0, curTab = '5f';
let loaded = { res: false, sp: false, bd: false };

const toDateStr = d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const tsToday = () => toDateStr(new Date());

function getWeekDays() {
  const today = new Date(); today.setDate(today.getDate() + weekOffset * 7);
  const dw = today.getDay();
  const mon = new Date(today); mon.setDate(today.getDate() - dw + (dw === 0 ? -6 : 1));
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
}

function render() {
  if (!loaded.res || !loaded.sp || !loaded.bd) return;

  const days    = getWeekDays();
  const todayS  = tsToday();
  const tab     = TABS.find(t => t.key === curTab);
  const fmt     = d => d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });
  document.getElementById('week-label').textContent = `${fmt(days[0])} – ${fmt(days[6])}`;

  const tabRooms = tab.rooms.map(name => spaces.find(s => s.name === name) || { name, cap: '' });

  let html = '';

  if (tabRooms.length === 1) {
    // 단일 홀: 날짜 세로
    const sp = tabRooms[0];
    html = `<table><thead><tr>
      <th class="date-th">날짜</th>
      <th>${sp.name}${sp.cap ? ' · ' + sp.cap + '명' : ''}</th>
    </tr></thead><tbody>`;
    days.forEach((d, i) => {
      const ds  = toDateStr(d);
      const isT = ds === todayS;
      const bd  = blockedDates.find(b => b.date === ds);
      const res = reservations.filter(r => r.room === sp.name && r.date === ds && r.status === '확정')
                              .sort((a,b) => a.start.localeCompare(b.start));
      const dow = DOWS[d.getDay()];
      const isW = d.getDay() === 0 || d.getDay() === 6;
      const bgT = isT ? 'background:var(--blue-lt)' : '';
      html += `<tr>
        <td style="${bgT};white-space:nowrap;font-weight:600;color:${isW?'#D04F7B':isT?'var(--blue)':'var(--text2)'}">
          ${dow} · ${d.getMonth()+1}/${d.getDate()}${isT ? ' ◀오늘' : ''}
        </td>
        <td style="${bd ? 'background:#F5F5F5' : bgT}">`;
      if (bd) {
        html += `<div class="chip-blk">🚫 ${bd.reason}</div>`;
      } else if (!res.length) {
        html += `<div class="chip-none">–</div>`;
      } else {
        res.forEach(r => {
          html += `<div class="chip chip-ok">
            <div class="time">${r.start}–${r.end}</div>
            <div class="org">${r.managerName || ''} ${r.people ? '· ' + r.people + '명' : ''}</div>
          </div>`;
        });
      }
      html += `</td></tr>`;
    });
    html += '</tbody></table>';

  } else {
    // 다중 공간: 날짜 가로
    html = `<table><thead><tr><th class="room-th">공간</th>`;
    days.forEach((d, i) => {
      const ds  = toDateStr(d);
      const isT = ds === todayS;
      const dow = DOWS[d.getDay()];
      const isS = d.getDay() === 6, isSu = d.getDay() === 0;
      const cls = [isT ? 'today-col' : '', isSu ? 'sun' : isS ? 'sat' : ''].filter(Boolean).join(' ');
      html += `<th class="${cls}">${dow}<br>${d.getMonth()+1}/${d.getDate()}</th>`;
    });
    html += '</tr></thead><tbody>';

    tabRooms.forEach(sp => {
      html += `<tr><td class="room-th" style="font-weight:600">${sp.name}${sp.cap ? '<br><span style="font-size:9px;font-weight:400;color:var(--text3)">' + sp.cap + '명</span>' : ''}</td>`;
      days.forEach(d => {
        const ds  = toDateStr(d);
        const isT = ds === todayS;
        const bd  = blockedDates.find(b => b.date === ds);
        const res = reservations.filter(r => r.room === sp.name && r.date === ds && r.status === '확정')
                                .sort((a,b) => a.start.localeCompare(b.start));
        const bg  = bd ? 'background:#F5F5F5' : isT ? 'background:var(--blue-lt)' : '';
        html += `<td style="${bg}">`;
        if (bd) {
          html += `<div class="chip-blk">🚫</div>`;
        } else if (!res.length) {
          html += `<div class="chip-none">–</div>`;
        } else {
          res.forEach(r => {
            html += `<div class="chip chip-ok">
              <div class="time">${r.start}–${r.end}</div>
              <div class="org">${r.managerName || ''}</div>
            </div>`;
          });
        }
        html += '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
  }

  document.getElementById('cal-body').innerHTML = html;
}

// 탭 렌더링
document.getElementById('tabs').innerHTML = TABS.map(t =>
  `<button class="tab${t.key === curTab ? ' active' : ''}" onclick="setTab('${t.key}')">${t.label}</button>`
).join('');

window.setTab = (key) => {
  curTab = key;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.textContent === (TABS.find(t=>t.key===key)?.label)));
  render();
};
window.changeWeek = (dir) => { weekOffset = dir === 0 ? 0 : weekOffset + dir; render(); };

// Firestore 실시간 구독 (인증 없이)
onSnapshot(collection(db, 'reservations'), snap => {
  reservations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  loaded.res = true; render();
});
onSnapshot(collection(db, 'spaces'), snap => {
  spaces = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  loaded.sp = true; render();
});
onSnapshot(collection(db, 'blockedDates'), snap => {
  blockedDates = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  loaded.bd = true; render();
});
</script>
</body>
</html>
