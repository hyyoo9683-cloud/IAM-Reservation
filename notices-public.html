<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 — 아이엠센터</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#185FA5; --blue-lt:#EBF4FF;
  --amber:#854F0B; --amber-lt:#FAEEDA;
  --red:#A32D2D;
  --green:#3B6D11;
  --border:#D4E4F4; --border2:#E8EFF7;
  --bg:#F8FAFD; --bg2:#fff; --bg3:#F0F6FF;
  --text:#1A2533; --text2:#4A6078; --text3:#8AA3BC;
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

/* 헤더 */
.header{
  background:var(--blue);
  padding:16px 20px 14px;
  position:sticky;top:0;z-index:100;
}
.header-logo{font-size:11px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:2px;margin-bottom:3px;}
.header-title{font-size:19px;font-weight:800;color:#fff;}

/* 카테고리 탭 */
.cat-wrap{
  background:#fff;
  border-bottom:1px solid var(--border2);
  position:sticky;top:58px;z-index:99;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.cat-wrap::-webkit-scrollbar{display:none;}
.cat-tabs{display:flex;padding:0 12px;gap:2px;min-width:max-content;}
.cat-tab{
  padding:10px 14px;
  font-size:13px;font-weight:600;color:var(--text3);
  border:none;background:none;cursor:pointer;
  border-bottom:3px solid transparent;
  margin-bottom:-1px;white-space:nowrap;
  font-family:var(--font);transition:.15s;
}
.cat-tab.active{color:var(--blue);border-bottom-color:var(--blue);}

/* 목록 */
.list{padding:14px 16px;}

.ncard{
  background:#fff;
  border:1px solid var(--border2);
  border-radius:12px;
  padding:16px;
  margin-bottom:10px;
  cursor:pointer;
  transition:box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
}
.ncard:active{background:var(--bg3);}
.ncard.pinned{border-left:3px solid var(--amber);}
.badge-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px;}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px;white-space:nowrap;}
.ncard-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:5px;line-height:1.4;}
.ncard-preview{
  font-size:12px;color:var(--text3);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.ncard-date{font-size:11px;color:var(--text3);margin-top:8px;}

.empty{text-align:center;padding:56px 20px;color:var(--text3);font-size:14px;}

/* 상세 오버레이 */
#detail{
  display:none;
  position:fixed;inset:0;
  background:#fff;z-index:200;
  overflow-y:auto;
}
.detail-topbar{
  background:#fff;
  border-bottom:1px solid var(--border2);
  padding:14px 16px;
  display:flex;align-items:center;
  position:sticky;top:0;z-index:10;
}
.back-btn{
  background:none;border:none;cursor:pointer;
  font-size:14px;font-weight:600;color:var(--blue);
  display:flex;align-items:center;gap:4px;
  padding:4px 0;font-family:var(--font);
}
.detail-content{padding:20px 16px 56px;}
.detail-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.detail-title{font-size:20px;font-weight:800;color:var(--text);margin-bottom:8px;line-height:1.4;}
.detail-date{font-size:12px;color:var(--text3);margin-bottom:24px;}
.detail-body{font-size:15px;line-height:1.9;color:var(--text);white-space:pre-wrap;word-break:break-word;}

@media(min-width:600px){
  .list{max-width:640px;margin:0 auto;padding:20px 24px;}
  .ncard:hover{box-shadow:0 4px 16px rgba(0,0,0,.09);border-color:var(--border);}
  .detail-content{max-width:640px;margin:0 auto;padding:28px 24px 64px;}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">IAM CENTER</div>
  <div class="header-title">공지사항</div>
</div>

<div class="cat-wrap">
  <div class="cat-tabs" id="cat-tabs"></div>
</div>

<div class="list" id="notice-list">
  <div class="empty">불러오는 중…</div>
</div>

<div id="detail">
  <div class="detail-topbar">
    <button class="back-btn" onclick="closeDetail()">← 목록</button>
  </div>
  <div class="detail-content" id="detail-content"></div>
</div>

<script type="module">
import { initializeApp }  from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
import { getFirestore, collection, getDocs, query, orderBy }
  from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

const app = initializeApp({
  apiKey:            "AIzaSyCSHQFknw_hsxNMCvrBDer3z0cB4mG347w",
  authDomain:        "iamreservation.firebaseapp.com",
  projectId:         "iamreservation",
  storageBucket:     "iamreservation.firebasestorage.app",
  messagingSenderId: "634977833386",
  appId:             "1:634977833386:web:043a9acab5b2b229f75bd3"
});
const db = getFirestore(app);

const CATS = ['전체', '공지', '이용 규정', '팀 소식'];
const CAT_COLOR = {
  '이용 규정': '#185FA5',
  '공지':      '#A32D2D',
  '팀 소식':   '#3B6D11',
};

let notices = [];
let curCat = '전체';

function buildTabs() {
  document.getElementById('cat-tabs').innerHTML = CATS.map(c =>
    `<button class="cat-tab${c===curCat?' active':''}" onclick="setCat('${c}')">${c}</button>`
  ).join('');
}

window.setCat = c => {
  curCat = c;
  buildTabs();
  renderList();
};

function fmtDate(d) {
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function renderList() {
  const filtered = curCat === '전체' ? notices : notices.filter(n => n.category === curCat);
  const el = document.getElementById('notice-list');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty">등록된 공지가 없습니다.</div>`;
    return;
  }
  el.innerHTML = filtered.map(n => {
    const color   = CAT_COLOR[n.category] || '#8AA3BC';
    const dateStr = n.createdAt?.toDate ? fmtDate(n.createdAt.toDate()) : '';
    return `<div class="ncard${n.pinned?' pinned':''}" onclick="openDetail('${n.id}')">
      <div class="badge-row">
        ${n.pinned ? '<span style="font-size:12px">📌</span>' : ''}
        <span class="badge" style="background:${color}18;color:${color}">${n.category}</span>
        ${n.venue ? `<span class="badge" style="background:#F0F6FF;color:#4A6078">${n.venue}</span>` : ''}
      </div>
      <div class="ncard-title">${n.title}</div>
      <div class="ncard-preview">${(n.content||'').replace(/\n/g,' ')}</div>
      <div class="ncard-date">${dateStr}</div>
    </div>`;
  }).join('');
}

window.openDetail = id => {
  const n = notices.find(x => x.id === id); if (!n) return;
  const color   = CAT_COLOR[n.category] || '#8AA3BC';
  const dateStr = n.createdAt?.toDate ? fmtDate(n.createdAt.toDate()) : '';
  document.getElementById('detail-content').innerHTML = `
    <div class="detail-badges">
      ${n.pinned ? '<span style="font-size:13px">📌</span>' : ''}
      <span class="badge" style="background:${color}18;color:${color}">${n.category}</span>
      ${n.venue ? `<span class="badge" style="background:#F0F6FF;color:#4A6078">${n.venue}</span>` : ''}
    </div>
    <div class="detail-title">${n.title}</div>
    <div class="detail-date">${dateStr}</div>
    <div class="detail-body">${n.content||''}</div>
  `;
  const detail = document.getElementById('detail');
  detail.style.display = 'block';
  detail.scrollTop = 0;
};

window.closeDetail = () => {
  document.getElementById('detail').style.display = 'none';
};

async function load() {
  try {
    const snap = await getDocs(query(collection(db,'notices'), orderBy('createdAt','desc')));
    notices = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    notices.sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0));
    buildTabs();
    renderList();
  } catch(e) {
    document.getElementById('notice-list').innerHTML =
      `<div class="empty" style="color:#A32D2D">불러오기 실패: ${e.message}</div>`;
  }
}

load();
</script>
</body>
</html>
