<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공간 안내</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --ink: #1d1f1a;
    --ink-soft: #565a4f;
    --ink-faint: #8b8f80;
    --accent: #45604f;
    --accent-soft: #e2e8de;
    --accent-strong: #2f4436;
    --line: #dcdbd0;
    --line-strong: #1d1f1a;
    --shadow: 0 1px 3px rgba(29,31,26,0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15170f;
      --surface: #1b1d15;
      --ink: #ecece3;
      --ink-soft: #b7bcac;
      --ink-faint: #767b6a;
      --accent: #8fb69a;
      --accent-soft: #26301f;
      --accent-strong: #a9cdb2;
      --line: #33362a;
      --line-strong: #ecece3;
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
  }

  :root[data-theme="dark"] {
    --bg: #15170f;
    --surface: #1b1d15;
    --ink: #ecece3;
    --ink-soft: #b7bcac;
    --ink-faint: #767b6a;
    --accent: #8fb69a;
    --accent-soft: #26301f;
    --accent-strong: #a9cdb2;
    --line: #33362a;
    --line-strong: #ecece3;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.7;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: clamp(40px, 8vw, 96px) clamp(20px, 5vw, 32px) 64px;
  }

  .home-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    color: var(--ink-faint);
    text-decoration: none;
    margin: 0 0 22px;
  }
  .home-link:hover { color: var(--accent-strong); }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-strong);
    margin: 0 0 18px;
  }

  header h1 {
    font-family: "Noto Serif KR", serif;
    font-weight: 700;
    font-size: clamp(30px, 5.4vw, 44px);
    letter-spacing: 0.02em;
    margin: 0 0 22px;
    text-wrap: balance;
  }

  .contact-line {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    align-items: baseline;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 26px;
  }
  .contact-line a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line); }
  .contact-line a:hover { color: var(--accent-strong); border-color: var(--accent-strong); }
  .contact-line .sep { color: var(--ink-faint); }

  .rule { border: 0; border-top: 2px solid var(--line-strong); margin: 0; }

  .intro {
    color: var(--ink-soft);
    font-size: 15.5px;
    max-width: 58ch;
    margin: 28px 0 0;
  }
  .intro strong { color: var(--ink); font-weight: 600; }

  main { margin-top: 12px; }

  section.item {
    display: grid;
    grid-template-columns: 84px 1px 1fr;
    gap: 0 28px;
    padding: 40px 0;
    border-bottom: 1px solid var(--line);
  }
  section.item:last-of-type { border-bottom: none; }

  .num {
    font-family: "Noto Serif KR", serif;
    font-weight: 600;
    font-size: 40px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
    line-height: 1;
    padding-top: 2px;
  }

  .divider { background: var(--line); }

  .item h2 {
    font-family: "Noto Serif KR", serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 4px;
    color: var(--ink);
    text-wrap: balance;
  }
  .item .floor-count { font-size: 13px; color: var(--ink-faint); margin: 0 0 18px; }
  .item-note { font-size: 15px; color: var(--ink-soft); margin: 0; }

  .subgroup { margin-top: 24px; }
  .subgroup:first-child { margin-top: 0; }
  .subgroup-heading {
    font-family: "Noto Serif KR", serif;
    font-weight: 600;
    font-size: 14.5px;
    color: var(--accent-strong);
    margin: 0 0 10px;
  }

  .venue-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }

  .venue-cell {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .venue-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .venue-img {
    aspect-ratio: 1 / 1;
    background: var(--accent-soft);
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }
  .venue-img img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }

  .venue-desc-box {
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13.5px;
    color: var(--ink-soft);
    white-space: pre-line;
  }

  .venue-body {
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .venue-name {
    font-family: "Noto Serif KR", serif;
    font-weight: 600;
    font-size: 16.5px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .venue-name::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }

  .capacity-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .cap-label { color: var(--ink-faint); font-size: 12.5px; }
  .capacity-row .cap-num {
    font-family: "Noto Serif KR", serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--accent-strong);
  }
  .capacity-row .cap-num small {
    font-size: 11.5px;
    font-weight: 400;
    color: var(--ink-faint);
    margin-left: 2px;
  }

  .venue-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .venue-tag {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-strong);
  }

  /* ── 사진 확대 보기 ── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.82);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    cursor: zoom-out;
  }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 24px 64px rgba(0,0,0,0.4); }
  .lightbox-close {
    position: absolute;
    top: 16px; right: 20px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── 아이엠홀 사진 캐러셀 ── */
  .im-carousel {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: var(--accent-soft);
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .im-track { display: flex; transition: transform .3s ease; }
  .im-slide { position: relative; flex: 0 0 100%; aspect-ratio: 16 / 10; }
  .im-slide img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .im-caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 8px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,0.55));
    color: #fff;
    font-size: 12.5px;
  }
  .im-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.4);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .im-prev { left: 10px; }
  .im-next { right: 10px; }
  .im-dots {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px;
  }
  .im-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    cursor: pointer;
  }
  .im-dot.active { background: #fff; }

  .state-msg {
    color: var(--ink-faint);
    font-size: 14px;
    padding: 32px 0;
    text-align: center;
  }

  .cta-box {
    margin-top: 40px;
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .cta-box h2 {
    font-family: "Noto Serif KR", serif;
    font-weight: 600;
    font-size: 18px;
    margin: 0 0 8px;
  }
  .cta-box p { font-size: 14px; color: var(--ink-soft); margin: 0 0 16px; }
  .cta-box .contact-line { justify-content: center; margin: 0; font-size: 14px; }

  footer {
    margin-top: 48px;
    padding-top: 22px;
    border-top: 2px solid var(--line-strong);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 20px;
  }
  .wordmark {
    font-family: "Noto Serif KR", serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
  .wordmark .dots { color: var(--accent); letter-spacing: 0.14em; }
  footer .contact-line { margin: 0; }

  @media (min-width: 900px) {
    .page { max-width: 900px; }
    .intro { max-width: 70ch; }
  }

  @media (max-width: 520px) {
    section.item { grid-template-columns: 52px 1px 1fr; gap: 0 16px; padding: 30px 0; }
    .num { font-size: 30px; }
  }
</style>
</head>
<body>

<div class="page">
  <a class="home-link" href="guide.html">← 이용 안내로</a>

  <header>
    <p class="eyebrow">I AM CENTER · VENUE SPACES</p>
    <h1>공간 안내</h1>
    <hr class="rule">
    <p class="intro">아이엠센터에서 예약 이용 가능한 공간을 소개합니다.<br>
      정확한 이용 견적은 상담 후 메일로 보내드립니다.
    </p>
  </header>

  <main id="venue-main">
    <p class="state-msg">공간 정보를 불러오는 중입니다...</p>
  </main>

  <div class="cta-box">
    <h2>상담 및 문의</h2>
    <p class="contact-line">
      <a href="tel:07070181439">070-7018-1439</a>
      <span class="sep">/</span>
      <a href="mailto:iamspace@suwoncca.org">iamspace@suwoncca.org</a>
    </p>
  </div>

  <footer>
    <p class="wordmark">I AM <span class="dots">···</span></p>
    <p class="contact-line">
      <span>문의</span>
      <a href="tel:07070181439">070-7018-1439</a>
      <span class="sep">/</span>
      <a href="mailto:iamspace@suwoncca.org">iamspace@suwoncca.org</a>
    </p>
  </footer>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button type="button" class="lightbox-close" onclick="closeLightbox()">×</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyCSHQFknw_hsxNMCvrBDer3z0cB4mG347w",
  authDomain:        "iamreservation.firebaseapp.com",
  projectId:         "iamreservation",
  storageBucket:     "iamreservation.firebasestorage.app",
  messagingSenderId: "634977833386",
  appId:             "1:634977833386:web:043a9acab5b2b229f75bd3"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// 소개 대상에서 제외 — 아이엠홀은 별도 사이트 예정, 지혜홀은 숙박 전용이라 이 페이지 대상 아님
const EXCLUDE_NAMES = ['아이엠홀', '지혜홀'];
// 소그룹실(5층) 내 소형/중형 구분 기준 — 소형 10~16인, 중형 20인 이상
const SMALL_GROUP_MAX_CAP = 16;

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function byNameKo(a, b) {
  return (a.name || '').localeCompare(b.name || '', 'ko', { numeric: true });
}

function cardHtml(s) {
  const photoUrl = s.photos && s.photos[0];
  const img = photoUrl
    ? `<div class="venue-img"><img src="${esc(photoUrl)}" alt="${esc(s.name)}" loading="lazy" onclick="openLightbox('${esc(photoUrl)}')"></div>`
    : `<div class="venue-img">사진 준비 중</div>`;
  const tags = (s.amenities || []).map(a => `<span class="venue-tag">${esc(a)}</span>`).join('');
  return `<div class="venue-card">
    ${img}
    <div class="venue-body">
      <p class="venue-name">${esc(s.name)}</p>
      ${s.cap ? `<div class="capacity-row"><span class="cap-label">정원</span><span class="cap-num">${esc(s.cap)}<small>명</small></span></div>` : ''}
      ${tags ? `<div class="venue-tags">${tags}</div>` : ''}
    </div>
  </div>`;
}

function descBoxHtml(s) {
  const text = s.venueDesc || s.desc;
  return text ? `<div class="venue-desc-box">${esc(text)}</div>` : '';
}

function cellHtml(s) {
  return `<div class="venue-cell">${cardHtml(s)}${descBoxHtml(s)}</div>`;
}

function gridHtml(items) {
  return `<div class="venue-grid">${items.map(cellHtml).join('')}</div>`;
}

function subgroupHtml(label, items) {
  if (!items.length) return '';
  return `<div class="subgroup">
    <p class="subgroup-heading">${esc(label)}</p>
    ${gridHtml(items)}
  </div>`;
}

// ── 사진 확대 보기 ──
window.openLightbox = function(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('show');
};
window.closeLightbox = function() {
  document.getElementById('lightbox').classList.remove('show');
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ── 아이엠홀 사진 캐러셀 (아이엠센터 소개 > 층별 안내 > B1/B2층에 등록된 사진 재사용) ──
let imIndex = 0, imCount = 0;
window.imMove = function(delta) {
  imIndex = (imIndex + delta + imCount) % imCount;
  imRenderPosition();
};
window.imGoTo = function(i) { imIndex = i; imRenderPosition(); };
function imRenderPosition() {
  const track = document.getElementById('im-track');
  if (!track) return;
  track.style.transform = `translateX(-${imIndex * 100}%)`;
  document.querySelectorAll('.im-dot').forEach((d, i) => d.classList.toggle('active', i === imIndex));
}

async function loadImPhotos() {
  try {
    const snap = await getDoc(doc(db, 'siteContent', 'floors'));
    if (!snap.exists()) return [];
    const floors = snap.data().floors || [];
    const f = floors.find(x => x.name && /B1|B2/i.test(x.name));
    return (f && f.photos) ? f.photos.filter(p => p && p.url) : [];
  } catch (e) {
    return [];
  }
}

function imCarouselHtml(photos) {
  if (!photos.length) return '';
  const slides = photos.map(p => `<div class="im-slide">
    <img src="${esc(p.url)}" alt="아이엠홀" loading="lazy" onclick="openLightbox('${esc(p.url)}')">
    ${p.caption ? `<div class="im-caption">${esc(p.caption)}</div>` : ''}
  </div>`).join('');
  const nav = photos.length > 1
    ? `<button type="button" class="im-nav im-prev" onclick="imMove(-1)">‹</button>
       <button type="button" class="im-nav im-next" onclick="imMove(1)">›</button>
       <div class="im-dots">${photos.map((_, i) => `<span class="im-dot${i === 0 ? ' active' : ''}" onclick="imGoTo(${i})"></span>`).join('')}</div>`
    : '';
  return `<div class="im-carousel"><div class="im-track" id="im-track">${slides}</div>${nav}</div>`;
}

function sectionHtml(title, num, count, bodyHtml) {
  return `<section class="item">
    <div class="num">${String(num).padStart(2, '0')}</div>
    <div class="divider"></div>
    <div>
      <h2>${esc(title)}</h2>
      ${count != null ? `<p class="floor-count">${count}개 공간</p>` : ''}
      ${bodyHtml}
    </div>
  </section>`;
}

async function load() {
  const main = document.getElementById('venue-main');
  const sections = [];
  let n = 1;

  try {
    const snap = await getDocs(collection(db, 'spaces'));
    const list = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(s => s.name && !EXCLUDE_NAMES.includes(s.name) && !/로비/.test(s.name));

    // 세미나실(2층 아론홀·6층 샤론홀) / 소그룹실(5층) / 그 외로 분류
    const seminar = list.filter(s => s.floor === '2층' || s.floor === '6층' || ['아론홀', '샤론홀'].includes(s.name));
    const groupRooms = list.filter(s => s.floor === '5층' && !seminar.includes(s));
    const rest = list.filter(s => !seminar.includes(s) && !groupRooms.includes(s));

    seminar.sort(byNameKo);
    groupRooms.sort(byNameKo);
    rest.sort((a, b) => (a.floor || '').localeCompare(b.floor || '') || byNameKo(a, b));

    const small  = groupRooms.filter(s => s.cap > 0 && s.cap <= SMALL_GROUP_MAX_CAP);
    const medium = groupRooms.filter(s => !small.includes(s));

    if (seminar.length) sections.push(sectionHtml('세미나실', n++, seminar.length, gridHtml(seminar)));
    if (groupRooms.length) {
      const body = subgroupHtml('소형 · 10~16인', small) + subgroupHtml('중형 · 20인 이상', medium);
      sections.push(sectionHtml('소그룹실', n++, groupRooms.length, body));
    }
    if (rest.length) sections.push(sectionHtml('기타 공간', n++, rest.length, gridHtml(rest)));
  } catch (e) {
    sections.push('<p class="state-msg">공간 정보를 불러오지 못했습니다. 아래 연락처로 문의해 주세요.</p>');
  }

  // 아이엠홀은 별도 사이트 예정이라 목록에는 없지만, 안내를 위해 고정 섹션으로 표시
  // (사진은 "아이엠센터 소개 > 층별 안내 > B1/B2층"에 등록된 것을 그대로 재사용)
  const imPhotos = await loadImPhotos();
  imCount = imPhotos.length;
  imIndex = 0;
  sections.push(sectionHtml('아이엠홀', n++, null, `${imCarouselHtml(imPhotos)}<p class="item-note">이용은 개별적으로 문의 부탁드립니다.</p>`));

  main.innerHTML = sections.join('');
}

load();
</script>

</body>
</html>
