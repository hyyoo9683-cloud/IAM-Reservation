<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카카오톡 알림 연동 — IAM 인트라넷</title>
<style>
:root {
  --blue:#185FA5;--blue-lt:#E6F1FB;
  --green:#3B6D11;--green-lt:#EAF3DE;
  --red:#A32D2D;--red-lt:#FCEBEB;
  --bg:#fff;--bg2:#F8FAFD;
  --border2:#E8EFF7;
  --text:#1A2533;--text2:#4A6078;--text3:#8AA3BC;
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg2);color:var(--text);min-height:100vh;}
#login-wrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0d2e5e,#185FA5 55%,#378ADD);}
.login-card{background:#fff;border-radius:20px;padding:48px 40px;width:360px;text-align:center;
  box-shadow:0 24px 64px rgba(0,0,0,.28);}
.login-emblem{font-size:44px;margin-bottom:14px;}
.login-title{font-size:22px;font-weight:800;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:32px;}
.login-btn{width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;
  background:var(--blue);color:#fff;font-size:15px;font-weight:700;font-family:var(--font);
  display:flex;align-items:center;justify-content:center;gap:10px;transition:filter .15s;}
.login-btn:hover{filter:brightness(.92);}
.login-error{margin-top:12px;font-size:13px;color:var(--red);display:none;padding:8px;background:var(--red-lt);border-radius:7px;}

#app-wrap{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px;}
.card{background:var(--bg);border:1px solid var(--border2);border-radius:16px;padding:36px 32px;
  width:420px;max-width:100%;box-shadow:0 8px 28px rgba(24,95,165,.08);}
.card h1{font-size:19px;font-weight:800;margin-bottom:6px;}
.card .sub{font-size:13px;color:var(--text3);margin-bottom:24px;}
.status{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:10px;margin-bottom:20px;font-size:14px;font-weight:600;}
.status.ok{background:var(--green-lt);color:var(--green);}
.status.no{background:var(--red-lt);color:var(--red);}
.status .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none;}
.kakao-btn{width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;
  background:#FEE500;color:#191919;font-size:15px;font-weight:700;font-family:var(--font);
  display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s;}
.kakao-btn:hover{filter:brightness(.95);}
.note{margin-top:16px;font-size:12px;color:var(--text3);line-height:1.6;}
.back{display:inline-block;margin-top:20px;font-size:13px;color:var(--text2);text-decoration:none;}
.back:hover{text-decoration:underline;}
</style>
</head>
<body>

<div id="login-wrap">
  <div class="login-card">
    <div class="login-emblem">✝️</div>
    <div class="login-title">IAM 인트라넷</div>
    <div class="login-sub">관리자 전용 — 카카오톡 알림 연동</div>
    <button class="login-btn" onclick="doLogin()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.258h2.908C16.658 14.251 17.64 11.942 17.64 9.2z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Google 계정으로 로그인
    </button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<div id="app-wrap">
  <div class="card">
    <h1>카카오톡 알림 연동</h1>
    <div class="sub">새 예약·변경취소·대관 신청이 들어오면 관리자 본인의 카카오톡으로 알림을 보냅니다.</div>
    <div id="status" class="status">확인 중…</div>
    <button class="kakao-btn" onclick="connectKakao()">카카오톡으로 연동하기</button>
    <div class="note">
      연동을 다시 눌러도 기존 연결을 안전하게 덮어씁니다. 다른 카카오 계정으로 바꾸고 싶으면
      그냥 다시 연동하면 됩니다.
    </div>
    <a class="back" href="portal.html">← 인트라넷으로</a>
  </div>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut,
  onAuthStateChanged, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, getDoc, doc }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { getFunctions, httpsCallable }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-functions.js";

const firebaseConfig = {
  apiKey:            "AIzaSyCSHQFknw_hsxNMCvrBDer3z0cB4mG347w",
  authDomain:        "iamreservation.firebaseapp.com",
  projectId:         "iamreservation",
  storageBucket:     "iamreservation.firebasestorage.app",
  messagingSenderId: "634977833386",
  appId:             "1:634977833386:web:043a9acab5b2b229f75bd3"
};
const ADMIN_EMAILS = ["hyyoo9683@gmail.com"];

// 카카오 로그인 REST API 키 — OAuth client_id로 쓰이는 공개 값(카카오 공식 문서 기준 비밀값 아님)
const KAKAO_REST_API_KEY = "cc05b6939c64a59c947838d942114701";
const KAKAO_REDIRECT_URI = "https://iamreservation.web.app/kakao-auth-callback.html";

async function isAdminAccount(email) {
  if (!email) return false;
  if (ADMIN_EMAILS.includes(email)) return true;
  try { return (await getDoc(doc(db, 'admins', email))).exists(); } catch (_) { return false; }
}

const app   = initializeApp(firebaseConfig);
const auth  = getAuth(app);
const db    = getFirestore(app);
const fns   = getFunctions(app);

function showLogin() {
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('app-wrap').style.display   = 'none';
}
function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.style.display = 'block'; showLogin();
}
window.doLogin = async () => {
  document.getElementById('login-error').style.display = 'none';
  try {
    const p = new GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    await signInWithPopup(auth, p);
  } catch (e) { if (e.code !== 'auth/popup-closed-by-user') showLoginError('로그인 실패. 다시 시도해주세요.'); }
};

window.connectKakao = () => {
  const url = `https://kauth.kakao.com/oauth/authorize?client_id=${KAKAO_REST_API_KEY}` +
    `&redirect_uri=${encodeURIComponent(KAKAO_REDIRECT_URI)}&response_type=code&scope=talk_message`;
  location.href = url;
};

async function renderStatus() {
  const statusEl = document.getElementById('status');
  try {
    const getStatus = httpsCallable(fns, 'getKakaoAuthStatusCallable');
    const { data } = await getStatus();
    if (data.connected) {
      const when = data.connectedAt ? new Date(data.connectedAt).toLocaleString('ko-KR') : '';
      statusEl.className = 'status ok';
      statusEl.innerHTML = `<span class="dot"></span>연동됨${when ? ' · ' + when : ''}`;
    } else {
      statusEl.className = 'status no';
      statusEl.innerHTML = `<span class="dot"></span>아직 연동되지 않았습니다`;
    }
  } catch (e) {
    console.error(e);
    statusEl.className = 'status no';
    statusEl.textContent = '상태 확인 실패 — ' + (e.message || e);
  }
}

setPersistence(auth, browserLocalPersistence).catch(console.error);
onAuthStateChanged(auth, async user => {
  if (!user) { showLogin(); return; }
  const allowed = await isAdminAccount(user.email);
  if (!allowed) { await signOut(auth); showLoginError('관리자로 등록된 계정만 이용할 수 있습니다.'); return; }
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('app-wrap').style.display   = 'flex';
  await renderStatus();
});
</script>
</body>
</html>
