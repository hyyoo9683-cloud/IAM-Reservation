<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대관 신청 관리 — IAM 인트라넷</title>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut,
  onAuthStateChanged, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, doc,
  getDocs, orderBy, query, where, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

const firebaseConfig = {
  apiKey:            "AIzaSyCSHQFknw_hsxNMCvrBDer3z0cB4mG347w",
  authDomain:        "iamreservation.firebaseapp.com",
  projectId:         "iamreservation",
  storageBucket:     "iamreservation.firebasestorage.app",
  messagingSenderId: "634977833386",
  appId:             "1:634977833386:web:043a9acab5b2b229f75bd3"
};
const ALLOWED_DOMAIN = "suwoncca.org";
const ADMIN_EMAILS   = ["hyyoo9683@gmail.com"];

// ── 공간별 장비 설정 ──────────────────────────────────────
const CATERING_VENDORS = ['차폰팩토리', '조스테이블', '참방'];

const VENUES = {
  '아론홀': {
    type: 'hourly',
    stdEquip: ['무선 마이크 2', 'TV', '스피커', '보면대', '마이크 스탠드 1'],
    paidServices: ['방송 촬영 (BMS)', '음향 지원 (BMS)', '케이터링', '다과 별도 준비'],
  },
  '샤론홀': {
    type: 'hourly',
    stdEquip: ['무선 마이크 2', '유선 마이크 2', 'TV 2대', '키보드'],
    paidServices: ['방송 촬영 (BMS)', '음향 지원 (BMS)', '미디어 지원 (BMS)', '케이터링', '다과 별도 준비'],
  },
  '지혜홀': {
    type: 'lodging',
    stdEquip: [],
    paidServices: ['다과 IAM 제공', '케이터링', '다과 별도 준비', '기타 서비스'],
  },
};

const STATUSES = {
  '접수':   { label: '접수완료', color: '#185FA5', bg: '#E6F1FB' },
  '검토중': { label: '검토 중',  color: '#854F0B', bg: '#FAEEDA' },
  '승인':   { label: '승인',     color: '#3B6D11', bg: '#EAF3DE' },
  '거절':   { label: '거절',     color: '#A32D2D', bg: '#FCEBEB' },
  '취소':   { label: '취소',     color: '#6B7280', bg: '#F3F4F6' },
};

const app     = initializeApp(firebaseConfig);
const auth    = getAuth(app);
const db      = getFirestore(app);
const storage = getStorage(app);
let curUser  = null;
let requests = [];
let quotesByRef = {}; // venue_requests 문서 id → 그 신청에 연결된 가장 최근 견적서 {id, total}
let curId    = null;
let curTab   = '전체';
let formDates = [];
let pendingCueSheet = null; // 업로드 대기 중인 큐시트 파일

function renderDateRows() {
  const el = document.getElementById('date-rows');
  if (!el) return;
  el.innerHTML = formDates.map((d, i) => `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:7px">
      <input type="date" value="${d.date||''}" oninput="syncDR(${i},'date',this.value)" style="flex:1.2;min-width:0">
      <input type="time" value="${d.timeStart||''}" oninput="syncDR(${i},'timeStart',this.value)" style="flex:1;min-width:0">
      <span style="color:var(--text3);font-size:12px;flex-shrink:0">~</span>
      <input type="time" value="${d.timeEnd||''}" oninput="syncDR(${i},'timeEnd',this.value)" style="flex:1;min-width:0">
      ${formDates.length > 1
        ? `<button onclick="removeDR(${i})" style="flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;color:var(--text2)">×</button>`
        : '<span style="width:26px;flex-shrink:0"></span>'}
    </div>`).join('');
}
window.syncDR    = (i, f, v) => { if (formDates[i]) formDates[i][f] = v; };
window.addDateRow = () => {
  const last = formDates[formDates.length - 1];
  let nextDate = '';
  if (last?.date) {
    const d = new Date(last.date); d.setDate(d.getDate() + 1);
    nextDate = d.toISOString().slice(0, 10);
  }
  formDates.push({ date: nextDate, timeStart: last?.timeStart||'', timeEnd: last?.timeEnd||'' });
  renderDateRows();
};
window.removeDR  = i => { formDates.splice(i, 1); renderDateRows(); };

setPersistence(auth, browserLocalPersistence).catch(console.error);
onAuthStateChanged(auth, async user => {
  if (!user) { showLogin(); return; }
  const domain  = user.email.split('@')[1];
  const allowed = domain === ALLOWED_DOMAIN || ADMIN_EMAILS.includes(user.email);
  if (!allowed) { await signOut(auth); showLoginError('아이엠센터 구성원만 이용할 수 있습니다.'); return; }
  curUser = user;
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('app-wrap').style.display   = 'flex';
  document.getElementById('user-avatar').textContent  = (user.displayName||user.email)[0].toUpperCase();
  document.getElementById('user-name').textContent    = user.displayName||user.email.split('@')[0];
  await Promise.all([loadRequests(), loadQuotes()]);
  showNewForm();
});

function showLogin() {
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('app-wrap').style.display   = 'none';
}
function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.style.display = 'block'; showLogin();
}
window.doLogin = async () => {
  document.getElementById('login-error').style.display = 'none';
  try {
    const p = new GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    await signInWithPopup(auth, p);
  } catch(e) { if (e.code !== 'auth/popup-closed-by-user') showLoginError('로그인 실패. 다시 시도해주세요.'); }
};
window.doLogout = async () => { await signOut(auth); };

// ── 데이터 로드 ────────────────────────────────────────────
async function loadRequests() {
  try {
    const snap = await getDocs(query(collection(db,'venue_requests'), orderBy('createdAt','desc')));
    requests   = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderList();
  } catch(e) { console.error(e); }
}

// 대관 신청과 연결된 견적서(quotations.refRequestId) — 신청 하나당 여러 번 재발행될 수 있어
// issuedAt 내림차순으로 불러온 뒤 신청 id별 첫 번째(=가장 최근) 것만 남김
async function loadQuotes() {
  try {
    const snap = await getDocs(query(collection(db,'quotations'), orderBy('issuedAt','desc')));
    quotesByRef = {};
    snap.docs.forEach(d => {
      const q = d.data();
      if (q.refRequestId && !quotesByRef[q.refRequestId]) {
        quotesByRef[q.refRequestId] = { id: d.id, total: q.total || 0 };
      }
    });
    renderList();
  } catch(e) { console.error(e); }
}

// ── 목록 렌더 ──────────────────────────────────────────────
window.setTab = t => { curTab = t; renderList(); };

function renderList() {
  const tabs = ['전체','접수','검토중','승인','거절','취소'];
  document.getElementById('tab-bar').innerHTML = tabs.map(t =>
    `<button class="tab${t===curTab?' active':''}" onclick="setTab('${t}')">${t==='전체'?'전체':STATUSES[t]?.label||t}</button>`
  ).join('');

  const filtered = curTab === '전체' ? requests : requests.filter(r => r.status === curTab);
  const el = document.getElementById('req-list');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty-msg">신청 내역이 없습니다</div>`; return;
  }
  el.innerHTML = filtered.map(r => {
    const st = STATUSES[r.status] || STATUSES['접수'];
    const active = r.id === curId ? ' active' : '';
    const quote = quotesByRef[r.id];
    const quoteHtml = quote
      ? `<div class="req-card-quote" onclick="event.stopPropagation();window.open('quotation.html?id=${quote.id}','_blank')">
          📄 견적 ${comma(quote.total)}원 보기
        </div>`
      : '';
    const regHtml = r.reservationIds?.length
      ? `<div class="req-card-reg">✓ 예약 ${r.reservationIds.length}건 등록됨</div>`
      : '';
    return `<div class="req-card${active}" onclick="openRequest('${r.id}')">
      <div class="req-card-top">
        <span class="req-org">${esc(r.orgName||'–')}</span>
        <span class="status-chip" style="color:${st.color};background:${st.bg}">${st.label}</span>
      </div>
      <div class="req-card-mid">${esc(r.eventName||'(행사명 없음)')}</div>
      <div class="req-card-bot">
        <span>${esc(r.space||'–')}</span>
        <span>${r.eventDate||'날짜 미정'}</span>
        <span>${esc(r.managerName||'–')}</span>
      </div>
      ${quoteHtml}
      ${regHtml}
    </div>`;
  }).join('');
}

// ── 폼 빌더 ───────────────────────────────────────────────
window.showNewForm = () => {
  curId = null;
  pendingCueSheet = null;
  formDates = [{ date: new Date().toISOString().slice(0,10), timeStart: '', timeEnd: '' }];
  renderList();
  document.getElementById('detail-panel').innerHTML = buildFormHTML(null);
  renderDateRows();
};

window.onCueSheetSelect = (input) => {
  pendingCueSheet = input.files[0] || null;
  const label = document.getElementById('cuesheet-pending');
  if (label) label.textContent = pendingCueSheet ? `선택됨: ${pendingCueSheet.name}` : '';
};

async function uploadCueSheet(file) {
  const safeName = file.name.replace(/[^\w.\-가-힣 ]/g, '_');
  const sref = ref(storage, `venue_requests/cuesheet_${Date.now()}_${safeName}`);
  await uploadBytes(sref, file);
  const url = await getDownloadURL(sref);
  return { url, name: file.name };
}

function buildFormHTML(r) {
  const isEdit  = !!r;
  const v       = (f, def='') => isEdit ? esc(r[f]||def) : def;
  const curSpace = isEdit ? (r.space||'아론홀') : '아론홀';
  const vInfo   = VENUES[curSpace] || VENUES['아론홀'];

  const spaceChips = Object.keys(VENUES).map(s =>
    `<button type="button" class="space-chip${s===curSpace?' sel':''}" onclick="selectSpace('${s}')">${s}</button>`
  ).join('');

  const stdEquipHTML = vInfo.stdEquip.map(e =>
    `<span class="equip-tag">${e}</span>`
  ).join('');

  const savedVendor = isEdit ? (r.cateringVendor||'') : '';
  const cateringChecked = isEdit && r.paidServices?.includes('케이터링');
  const paidHTML = vInfo.paidServices.map(e => {
    if (e === '케이터링') {
      return `<div style="width:100%">
        <label class="equip-opt" style="display:inline-flex" onchange="toggleCateringDetail(this.querySelector('input'))">
          <input type="checkbox" value="케이터링"${cateringChecked?' checked':''}> 케이터링
        </label>
        <div id="catering-detail" style="display:${cateringChecked?'':'none'};margin-top:8px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg2)">
          <div class="lbl" style="margin-bottom:6px">케이터링 업체</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${CATERING_VENDORS.map(v =>
              `<label class="equip-opt" style="padding:5px 10px;font-size:12px">
                <input type="radio" name="catering-vendor" value="${v}"${savedVendor===v?' checked':''}> ${v}
              </label>`
            ).join('')}
          </div>
        </div>
      </div>`;
    }
    return `<label class="equip-opt">
      <input type="checkbox" value="${e}"${isEdit && r.paidServices?.includes(e)?' checked':''}> ${e}
    </label>`;
  }).join('');

  const lodgingFields = `
    <div id="sec-lodging" style="display:${vInfo.type==='lodging'?'':'none'}">
      <div class="fl">
        <div class="fg"><div class="lbl">날짜</div>
          <input type="date" id="f-date-in" value="${v('dateIn', new Date().toISOString().slice(0,10))}"></div>
        <div class="fg"><div class="lbl">박수</div>
          <input type="number" id="f-nights" min="1" value="${v('nights','1')}"></div>
      </div>
      <div class="fg"><div class="lbl">룸 선택</div>
        <div class="fl" style="flex-wrap:wrap;gap:8px;margin-top:4px">
          ${['Room 1 (3인실)','Room 2 (2인실)','Room 3 (2인실)'].map(rm =>
            `<label class="equip-opt"><input type="checkbox" name="f-rooms" value="${rm}"${isEdit&&r.rooms?.includes(rm)?' checked':''}> ${rm}</label>`
          ).join('')}
        </div>
      </div>
    </div>`;

  const hourlyFields = `
    <div id="sec-hourly" style="display:${vInfo.type==='hourly'?'':'none'}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div class="lbl">날짜 / 시간</div>
        <button type="button" class="btn-add-date" onclick="addDateRow()">+ 날짜 추가</button>
      </div>
      <div id="date-rows"></div>
    </div>`;

  const existingQuote = isEdit ? quotesByRef[r.id] : null;
  const quoteBtnHtml = existingQuote
    ? `<button class="btn-quote" onclick="window.open('quotation.html?id=${existingQuote.id}','_blank')">📄 견적서 보기 (${comma(existingQuote.total)}원)</button>
       <button class="btn-ghost" onclick="openQuotation('${r.id}')" title="이 신청으로 새 견적서를 다시 작성합니다">+ 새 견적서</button>`
    : (isEdit ? `<button class="btn-quote" onclick="openQuotation('${r.id}')">📋 견적서 작성</button>` : '');

  const regBannerHtml = (isEdit && r.status === '승인') ? (
    r.reservationIds?.length
      ? `<div class="reg-banner done">
          <span>✓ 예약 ${r.reservationIds.length}건 등록됨</span>
          <button id="btn-register-reservation" class="btn-ghost" onclick="registerAsReservation('${r.id}')">다시 등록</button>
        </div>`
      : `<div class="reg-banner">
          <span>승인된 신청이에요 — 아직 실제 예약(reservations)으로는 등록되지 않았습니다</span>
          <button id="btn-register-reservation" class="btn-primary" onclick="registerAsReservation('${r.id}')">📅 예약으로 등록</button>
        </div>`
  ) : '';

  return `
  <div class="detail-header">
    <div class="detail-title">${isEdit?'신청서 수정':'새 대관 신청 접수'}</div>
    <div style="display:flex;gap:8px">
      ${quoteBtnHtml}
      ${isEdit?`<button class="btn-ghost" onclick="showNewForm()">+ 새 접수</button>`:''}
    </div>
  </div>
  ${regBannerHtml}
  <div class="form-body">
    <input type="hidden" id="f-space" value="${curSpace}">

    <!-- 1. 공간 선택 -->
    <div class="form-sec first">공간 선택</div>
    <div class="space-chips">${spaceChips}</div>

    <!-- 2. 업체 정보 -->
    <div class="form-sec">신청 업체 정보</div>
    <div class="fl">
      <div class="fg"><div class="lbl">업체·단체명 <span class="req-mark">*</span></div>
        <input id="f-org" value="${v('orgName')}"></div>
      <div class="fg"><div class="lbl">담당자 이름 <span class="req-mark">*</span></div>
        <input id="f-mgr" value="${v('managerName')}" placeholder="홍길동"></div>
    </div>
    <div class="fl">
      <div class="fg"><div class="lbl">연락처 <span class="req-mark">*</span></div>
        <input id="f-tel" value="${v('tel')}" placeholder="010-0000-0000" oninput="formatTel(this)"></div>
      <div class="fg"><div class="lbl">이메일</div>
        <input id="f-email" value="${v('email')}" placeholder="example@email.com"></div>
    </div>

    <!-- 3. 행사 정보 -->
    <div class="form-sec">행사 정보</div>
    <div class="fl">
      <div class="fg"><div class="lbl">행사명</div>
        <input id="f-name" value="${v('eventName')}" placeholder="예: 세미나"></div>
      <div class="fg"><div class="lbl">예상 인원</div>
        <input type="number" id="f-ppl" min="1" value="${v('headcount')}" placeholder="0"></div>
    </div>
    ${hourlyFields}
    ${lodgingFields}
    <div class="fg"><div class="lbl">행사 내용 / 목적</div>
      <textarea id="f-purpose" style="min-height:64px" placeholder="행사 목적, 프로그램 등">${v('purpose')}</textarea></div>

    <!-- 4. 기본 제공 장비 (숙박 공간 제외) -->
    <div id="sec-std-equip" style="display:${vInfo.stdEquip.length?'':'none'}">
      <div class="form-sec">기본 제공 장비 <span style="font-size:11px;font-weight:400;color:var(--text3);letter-spacing:0;text-transform:none">(해당 공간 기본 사양)</span></div>
      <div class="equip-tags" id="std-equip">${stdEquipHTML}</div>
    </div>

    <!-- 5. 추가 서비스 (유료) -->
    <div class="form-sec">추가 서비스 <span style="font-size:11px;font-weight:400;color:var(--amber);letter-spacing:0;text-transform:none">유료 / 사전 협의 필요</span></div>
    <div class="equip-grid" id="paid-services">${paidHTML}</div>
    <div class="fg" style="margin-top:10px"><div class="lbl">기타 요청사항</div>
      <textarea id="f-etc" style="min-height:56px" placeholder="추가 요청사항">${v('etcRequest')}</textarea></div>

    <!-- 큐시트 첨부 -->
    <div class="form-sec">큐시트 <span style="font-size:11px;font-weight:400;color:var(--text3);letter-spacing:0;text-transform:none">(선택, 방송·음향·진행 순서표 등)</span></div>
    <div class="fg">
      ${isEdit && r.cueSheetUrl ? `<div style="margin-bottom:8px;font-size:13px"><a href="${r.cueSheetUrl}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:600;text-decoration:none">📎 ${esc(r.cueSheetName||'첨부파일')} 다운로드</a></div>` : ''}
      <input type="file" id="f-cuesheet" onchange="onCueSheetSelect(this)">
      <div id="cuesheet-pending" style="font-size:11px;color:var(--blue);margin-top:4px"></div>
    </div>

    ${isEdit ? `
    <!-- 6. 팀 메모 -->
    <div class="form-sec">팀 메모</div>
    <div class="fg"><div class="lbl">행정 메모</div>
      <textarea id="f-memo-admin" style="min-height:48px">${v('memoAdmin')}</textarea></div>
    <div class="fg"><div class="lbl">관리 메모</div>
      <textarea id="f-memo-mgmt" style="min-height:48px">${v('memoMgmt')}</textarea></div>
    <div class="fg"><div class="lbl">미디어 메모</div>
      <textarea id="f-memo-media" style="min-height:48px">${v('memoMedia')}</textarea></div>

    <!-- 7. 상태 -->
    <div class="form-sec">처리 상태</div>
    <div class="status-btns">
      ${Object.entries(STATUSES).map(([k,s]) =>
        `<button class="status-btn${r.status===k?' sel':''}"
          style="${r.status===k?`background:${s.bg};color:${s.color};border-color:${s.color}`:''}"
          onclick="setStatus('${r.id}','${k}')">${s.label}</button>`
      ).join('')}
    </div>` : ''}

    <div style="margin-top:20px;display:flex;gap:10px">
      <button class="btn-primary" onclick="${isEdit?`saveEdit('${r.id}')`:'saveNew()'}">
        ${isEdit?'저장':'접수 등록'}
      </button>
      ${isEdit?`<button class="btn-ghost" onclick="showNewForm()">취소</button>`:''}
    </div>
  </div>`;
}

// ── 공간 전환 ──────────────────────────────────────────────

window.selectSpace = space => {
  document.getElementById('f-space').value = space;
  // 칩 선택 표시
  document.querySelectorAll('.space-chip').forEach(b =>
    b.classList.toggle('sel', b.textContent === space)
  );
  const vInfo = VENUES[space];
  // 시간제/숙박 섹션 토글
  const hourly = document.getElementById('sec-hourly');
  const lodging = document.getElementById('sec-lodging');
  if (hourly)  hourly.style.display  = vInfo.type === 'hourly'  ? '' : 'none';
  if (lodging) lodging.style.display = vInfo.type === 'lodging' ? '' : 'none';
  // 기본 장비 태그 (없으면 섹션 숨김)
  const stdSec = document.getElementById('sec-std-equip');
  const stdEl  = document.getElementById('std-equip');
  if (stdSec) stdSec.style.display = vInfo.stdEquip.length ? '' : 'none';
  if (stdEl)  stdEl.innerHTML = vInfo.stdEquip.map(e => `<span class="equip-tag">${e}</span>`).join('');
  // 추가 서비스 체크박스
  document.getElementById('paid-services').innerHTML =
    vInfo.paidServices.map(e =>
      `<label class="equip-opt"><input type="checkbox" value="${e}"> ${e}</label>`
    ).join('');
};

window.formatTel = el => {
  let v = el.value.replace(/\D/g,'');
  if (v.length <= 3) el.value = v;
  else if (v.length <= 7) el.value = v.slice(0,3)+'-'+v.slice(3);
  else el.value = v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
};

window.toggleCateringDetail = el => {
  const d = document.getElementById('catering-detail');
  if (d) d.style.display = el.checked ? '' : 'none';
};

function collectForm(id) {
  const g = i => document.getElementById(i);
  const space  = g('f-space')?.value || '';
  const vInfo  = VENUES[space];
  const isHourly = vInfo?.type === 'hourly';

  const paidServices   = [...document.querySelectorAll('#paid-services input[type=checkbox]:checked')].map(c => c.value);
  const cateringVendor = document.querySelector('input[name="catering-vendor"]:checked')?.value || '';
  const rooms          = [...document.querySelectorAll('input[name="f-rooms"]:checked')].map(c => c.value);

  const dates     = isHourly ? formDates.filter(d => d.date) : [];
  const eventDate = dates.length ? dates[0].date : (g('f-date-in')?.value || '');
  const eventDateEnd = dates.length > 1 ? dates[dates.length-1].date : '';

  const data = {
    space,
    orgName:      g('f-org')?.value.trim()  || '',
    managerName:  g('f-mgr')?.value.trim()  || '',
    tel:          g('f-tel')?.value.trim()  || '',
    email:        g('f-email')?.value.trim()|| '',
    eventName:    g('f-name')?.value.trim() || '',
    headcount:    parseInt(g('f-ppl')?.value)||0,
    eventDate,
    eventDateEnd,
    dates,
    timeStart:    dates[0]?.timeStart || '',
    timeEnd:      dates[0]?.timeEnd   || '',
    dateIn:       g('f-date-in')?.value || '',
    nights:       parseInt(g('f-nights')?.value)||0,
    rooms,
    purpose:      g('f-purpose')?.value.trim()||'',
    paidServices,
    cateringVendor,
    etcRequest:   g('f-etc')?.value.trim() || '',
  };
  if (id) {
    data.memoAdmin = g('f-memo-admin')?.value.trim()||'';
    data.memoMgmt  = g('f-memo-mgmt')?.value.trim() ||'';
    data.memoMedia = g('f-memo-media')?.value.trim()||'';
  }
  return data;
}

window.saveNew = async () => {
  const data = collectForm(null);
  if (!data.orgName || !data.managerName || !data.tel) {
    alert('업체명, 담당자 이름, 연락처는 필수입니다.'); return;
  }
  const btn = document.querySelector('.btn-primary');
  btn.disabled = true; btn.textContent = '저장 중...';
  try {
    if (pendingCueSheet) {
      const { url, name } = await uploadCueSheet(pendingCueSheet);
      data.cueSheetUrl = url; data.cueSheetName = name;
    }
    await addDoc(collection(db,'venue_requests'), {
      ...data, status: '접수',
      createdBy: curUser.email, createdAt: serverTimestamp(),
    });
    pendingCueSheet = null;
    await loadRequests(); showNewForm();
  } catch(e) { alert('저장 실패: ' + e.message); btn.disabled=false; btn.textContent='접수 등록'; }
};

window.saveEdit = async id => {
  const data = collectForm(id);
  const btn = document.querySelector('.btn-primary');
  btn.disabled = true; btn.textContent = '저장 중...';
  try {
    if (pendingCueSheet) {
      const { url, name } = await uploadCueSheet(pendingCueSheet);
      data.cueSheetUrl = url; data.cueSheetName = name;
    }
    await updateDoc(doc(db,'venue_requests',id), {
      ...data, updatedBy: curUser.email, updatedAt: serverTimestamp(),
    });
    pendingCueSheet = null;
    await loadRequests(); openRequest(id);
  } catch(e) { alert('저장 실패: ' + e.message); btn.disabled=false; btn.textContent='저장'; }
};

window.setStatus = async (id, status) => {
  try {
    await updateDoc(doc(db,'venue_requests',id), {
      status, updatedBy: curUser.email, updatedAt: serverTimestamp(),
    });
    await loadRequests(); openRequest(id);
  } catch(e) { alert('상태 변경 실패: ' + e.message); }
};

window.openRequest = id => {
  curId = id; renderList();
  pendingCueSheet = null;
  const r = requests.find(x => x.id === id);
  if (!r) return;
  formDates = (r.dates?.length)
    ? r.dates.map(d => ({...d}))
    : [{ date: r.eventDate||'', timeStart: r.timeStart||'', timeEnd: r.timeEnd||'' }];
  document.getElementById('detail-panel').innerHTML = buildFormHTML(r);
  renderDateRows();
};

window.openQuotation = id => {
  const r = requests.find(x => x.id === id);
  if (!r) return;
  const dates = r.dates?.length
    ? r.dates
    : [{ date: r.eventDate||'', timeStart: r.timeStart||'', timeEnd: r.timeEnd||'' }];
  const params = new URLSearchParams({
    venue:   r.space   || '',
    dates:   JSON.stringify(dates),
    client:  r.orgName || '',
    purpose: r.purpose || '',
    ref:     id,
  });
  window.open(`quotation.html?${params}`, '_blank');
};

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function comma(n) { return Math.round(n||0).toLocaleString('ko-KR'); }
// toISOString()은 UTC 기준이라 UTC+9에서 날짜가 하루 밀림 → 로컬 날짜 문자열 사용 (index.html과 동일)
const toDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function nowStr() {
  return new Date().toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

// ── 승인된 대관 신청을 실제 예약(reservations)으로 등록 ──────────
// 같은 공간에 이미 확정된 예약이 겹치는지 확인 (index.html의 noConflict와 같은 겹침 판정)
async function checkRoomConflicts(room, items) {
  const snap = await getDocs(query(collection(db,'reservations'), where('room','==', room)));
  const existing = snap.docs.map(d => d.data());
  return items.filter(it => existing.some(r2 =>
    r2.date === it.date && r2.status === '확정' && !(it.end <= r2.start || it.start >= r2.end)
  ));
}

window.registerAsReservation = async (id) => {
  const r = requests.find(x => x.id === id);
  if (!r) return;
  if (r.status !== '승인') { alert('승인된 신청만 예약으로 등록할 수 있습니다.'); return; }
  if (r.reservationIds?.length &&
      !confirm(`이미 ${r.reservationIds.length}건의 예약이 등록되어 있습니다. 그래도 새로 등록하시겠습니까? (기존 예약은 그대로 남고 새로 추가됩니다)`)) return;

  const vInfo = VENUES[r.space];
  const isLodging = vInfo?.type === 'lodging';
  let items = [];
  if (isLodging) {
    if (!r.dateIn || !r.nights) { alert('체크인 날짜·박수 정보가 없어 예약을 등록할 수 없습니다. 신청서를 먼저 채워주세요.'); return; }
    const d = new Date(r.dateIn + 'T00:00:00');
    for (let i = 0; i <= r.nights; i++) { // 체크아웃 당일도 실제 사용일로 보고 함께 차단 (index.html 지혜홀 규칙과 동일)
      items.push({ date: toDateStr(d), start: '00:00', end: '23:59' });
      d.setDate(d.getDate() + 1);
    }
  } else {
    const src = (r.dates && r.dates.length) ? r.dates : [{ date: r.eventDate, timeStart: r.timeStart, timeEnd: r.timeEnd }];
    items = src.filter(x => x.date && x.timeStart && x.timeEnd).map(x => ({ date: x.date, start: x.timeStart, end: x.timeEnd }));
  }
  if (!items.length) { alert('예약을 만들 날짜·시간 정보가 부족합니다. 신청서 내용을 확인해주세요.'); return; }

  const conflicts = await checkRoomConflicts(r.space, items);
  if (conflicts.length) {
    alert(`다음 날짜에 이미 확정된 예약이 있어 등록할 수 없습니다:\n${conflicts.map(c => c.date).join(', ')}`);
    return;
  }

  const btn = document.getElementById('btn-register-reservation');
  if (btn) { btn.disabled = true; btn.textContent = '등록 중...'; }
  try {
    const recurGroup = items.length > 1 ? `venue_${Date.now()}` : null;
    const base = {
      type: r.orgName || '외부 대관',
      managerName: r.managerName || '',
      stewardName: r.managerName || '',
      stewardTel:  r.tel || '',
      people: r.headcount || 0,
      purpose: r.eventName || r.purpose || '',
      status: '확정',
      userEmail: '', // 관리자가 대신 등록하는 예약이라 신청자 이메일 없음 — 담당자 이름으로만 매칭
    };
    if (isLodging) {
      base.jihyeRooms  = r.rooms || [];
      base.checkinTime = r.timeStart || '';
      base.checkoutTime = r.timeEnd || '';
    }
    if (recurGroup) {
      base.recurGroup = recurGroup;
      base.recurType  = isLodging ? '연박' : '비정기';
      base.recurTotal = items.length;
    }
    const newIds = [];
    for (const it of items) {
      const docRef = await addDoc(collection(db,'reservations'), {
        ...base, room: r.space, date: it.date, start: it.start, end: it.end,
        createdAt: serverTimestamp(),
        history: [{ time: nowStr(), msg: `대관 신청에서 예약 등록 (venue_requests/${r.id})` }],
      });
      newIds.push(docRef.id);
    }
    await updateDoc(doc(db,'venue_requests', r.id), {
      reservationIds: [...(r.reservationIds||[]), ...newIds],
    });
    await loadRequests();
    openRequest(r.id);
    alert(`예약 ${items.length}건이 등록되었습니다.`);
  } catch(e) {
    alert('예약 등록 실패: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '📅 예약으로 등록'; }
  }
};
</script>

/* 목록 패널 */

<style id="pc-font-boost">
