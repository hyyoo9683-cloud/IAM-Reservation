<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>주차 등록 — IAM 센터</title>
<script>
window.esc = window.esc || function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#4C7660;--gl:#E8F0EA;--ink:#2B2E2C;--mut:#6b706d;--line:#e3e5e3;--red:#b3402a;--font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:#fff;word-break:keep-all;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{min-height:100%;display:flex;flex-direction:column}
.kbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:2px solid var(--ink);flex-shrink:0}
.kbar .t{display:flex;align-items:center}
/* 아이엠 로고 — 앱의 다른 화면과 같은 파일(home/logo-iam.png)을 진회색으로 칠해서 씀. 로고를 바꿀 땐 같은 이름의 투명 PNG로 교체하고 aspect-ratio(가로/세로)만 맞추면 됨 */
.logo{display:block;height:26px;aspect-ratio:720/167;background:#4B4F4D;-webkit-mask:url(home/logo-iam.png) left center/contain no-repeat;mask:url(home/logo-iam.png) left center/contain no-repeat}
.logo.big{height:42px;margin:0 auto 22px;-webkit-mask-position:center;mask-position:center}
.kbar .clock{font-size:15px;color:var(--mut);font-variant-numeric:tabular-nums}
.kbody{flex:1;padding:28px;display:flex;flex-direction:column;max-width:1100px;width:100%;margin:0 auto}
h2{font-size:30px;letter-spacing:-.03em;margin-bottom:6px}
.sub{color:var(--mut);margin-bottom:22px;font-size:17px;line-height:1.55}
.stepper{display:flex;gap:6px;margin-bottom:18px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.stepper span{padding:4px 10px;border-radius:99px;background:#f0f1f0}
.stepper span.on{background:var(--g);color:#fff;font-weight:700}
.roomrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px;max-width:640px}
.roombtn{font:inherit;font-size:20px;font-weight:700;letter-spacing:-.02em;border:0;border-radius:12px;padding:18px 8px;cursor:pointer;background:var(--gl);color:#2f5a44}
.roombtn.g2{background:#F3ECDD;color:#6a5426}
.roombtn.dim{opacity:.4}
.roombtn.g3{background:#ECEBF5;color:#454077}
.cform{max-width:520px;display:flex;flex-direction:column;gap:12px}
.cform label{font-size:17px;font-weight:700}
.cform input{font:inherit;font-size:24px;padding:16px 18px;border:2px solid var(--ink);border-radius:12px;width:100%;user-select:text;-webkit-user-select:text}
.cform input:focus{outline:none;border-color:var(--g)}
.cform .btn:disabled{opacity:.5}
.roombtn:active{filter:brightness(.92)}
.rgroup{margin-bottom:18px}
.rgroup h3{font-size:15px;font-weight:700;color:var(--mut);margin-bottom:8px;letter-spacing:-.01em}
.rooms.one{grid-template-columns:minmax(300px,520px)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start}
.rgrp{border:0;border-radius:14px;background:#F4F7F5;overflow:hidden}
.rname{font-size:24px;font-weight:800;color:#2f5a44;letter-spacing:-.03em;line-height:1.1;padding:14px 18px 10px}
.rlist{display:flex;flex-direction:column}
.ritem{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:transparent;border:0;border-top:1px solid #E1E8E3;padding:13px 18px;cursor:pointer}
.ritem:active{background:#E3ECE6}
.ritem .rl{display:flex;flex-direction:column;gap:3px;min-width:0}
.ritem .rs{font-size:13px;font-weight:500;color:var(--mut)}
.ritem .rn{font-size:15px;font-weight:600;word-break:break-all}
.ritem .rt{font-size:14px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{border:2px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--mut);font-size:17px;line-height:1.8}
.row{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.pad{display:grid;grid-template-columns:repeat(3,80px);gap:14px}
.pad button{width:80px;height:80px;font-size:28px;font-weight:700;border-radius:50%;border:0;background:#E3EDE7;font-family:inherit;cursor:pointer;color:#2f5a44;-webkit-tap-highlight-color:transparent;transition:transform .08s,background .08s}
.pad button:active{background:#CFE0D6;transform:scale(.94)}
.pad .fn{font-size:16px;font-weight:700}
.pad .fn[data-k="back"]{background:#F0EEE8;color:#6b6556}
.pad .fn[data-k="back"]:active{background:#E4E1D8}
.pad .fn[data-k="ok"]{background:var(--g);color:#fff}
.pad .fn[data-k="ok"]:active{background:#3f6450}
.dots{display:flex;gap:12px;margin:6px 0 14px}
.dots span{width:54px;height:64px;border:2px solid var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.chosen{background:var(--gl);border-radius:12px;padding:14px 18px;margin-bottom:18px;min-width:260px}
.chosen .room{font-size:30px;font-weight:800;color:var(--g);letter-spacing:-.03em;line-height:1.1}
.chosen .nm{font-size:15px;font-weight:600;margin-top:4px}
.chosen .tm{font-size:14px;color:var(--mut)}
.msg{min-height:44px;font-size:15px;font-weight:600;color:var(--red);max-width:340px;line-height:1.5}
.btn{font:inherit;font-size:18px;font-weight:800;padding:16px 26px;border-radius:12px;border:2px solid var(--g);background:var(--g);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--g)}
.btn.sm{font-size:14px;padding:8px 14px}
.foot{display:flex;gap:12px;margin-top:auto;padding-top:20px;align-items:center;flex-wrap:wrap}
.foot .cd{margin-left:auto;font-size:14px;color:var(--mut)}
.frame-wrap{flex:1;display:flex;flex-direction:column;border:2px solid var(--ink);border-radius:14px;overflow:hidden;min-height:480px;background:#fff}
.frame-wrap iframe{flex:1;border:0;width:100%;min-height:480px}
.warn{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#FFF4D6;border-radius:12px;padding:12px 16px;margin-top:12px;font-size:15px;font-weight:600;color:#6a5426}
.warn[hidden]{display:none}
.ok{text-align:center;margin:auto}
.ok .ck{width:84px;height:84px;border-radius:50%;background:var(--g);color:#fff;font-size:46px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.center{margin:auto;text-align:center;max-width:520px}
.start{margin:auto;text-align:center;max-width:620px;padding:20px 0}
.start h1{font-size:44px;letter-spacing:-.04em;line-height:1.15;margin-bottom:14px}
.start p{font-size:18px;color:var(--mut);line-height:1.7;margin-bottom:34px}
.btn.big{font-size:28px;padding:26px 64px;border-radius:18px;min-width:320px}
.err{color:var(--red)}
@media(max-width:600px){.kbody{padding:18px}h2{font-size:24px}.pad{grid-template-columns:repeat(3,72px);gap:12px}.pad button{width:72px;height:72px}.kbar{padding:12px 16px}}
</style>
</head>
<body>
<div id="app">
  <div class="kbar"><div class="t"><span class="logo" role="img" aria-label="IAM 센터 주차 등록"></span></div><div class="clock" id="clock"></div></div>
  <div class="kbody" id="body"><div class="center"><p class="sub">불러오는 중…</p></div></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-functions.js';

const app = initializeApp({
  apiKey:            "AIzaSyCSHQFknw_hsxNMCvrBDer3z0cB4mG347w",
  authDomain:        "iamreservation.firebaseapp.com",
  projectId:         "iamreservation",
  storageBucket:     "iamreservation.firebasestorage.app",
  messagingSenderId: "634977833386",
  appId:             "1:634977833386:web:043a9acab5b2b229f75bd3"
});
const fns = getFunctions(app);
const callRooms    = httpsCallable(fns, 'kioskRooms');
const callMeetings = httpsCallable(fns, 'kioskMeetings');
const callCounsel  = httpsCallable(fns, 'kioskCounseling');
const callVerify   = httpsCallable(fns, 'kioskVerify');

// ── 기기 키: 관리자가 발급한 설정 주소(kiosk.html?setup=키)를 이 기기에서 한 번 열면 저장됨 ──
const KEY_STORE = 'iamKioskKey';
function readKey() { try { return localStorage.getItem(KEY_STORE) || ''; } catch (_) { return ''; } }
(function applySetup() {
  const q = new URLSearchParams(location.search);
  const k = q.get('setup');
  if (k) {
    try { localStorage.setItem(KEY_STORE, k); } catch (_) {}
    history.replaceState(null, '', location.pathname);   // 주소창에 키가 남지 않게
  }
})();
const KEY = readKey();

const $ = id => document.getElementById(id);
const body = $('body');
const IDLE_MS = 2 * 60 * 1000;  // 모임 선택·연락처 입력 화면에서 2분 동안 아무 조작이 없으면 처음 화면으로
const PARK_IDLE_SEC = 120;      // 주차 화면: 움직임이 없어진 뒤 이만큼 지나면 처음 화면으로 (움직임이 있으면 다시 처음부터 잼)
const PARK_WARN_SEC = 30;       // 남은 시간이 이만큼이면 '계속 이용하기' 안내를 띄움
let parkActivity = null;        // 주차 화면이 열려 있는 동안만 연결되는 '움직임 감지' 함수
let st = { step: 'start', rooms: [], activeRooms: null, counselRooms: [], counselEnabled: true, room: '', meetings: [], sel: null, pin: '', busy: false, afterMin: null };
let timers = [];
function clearTimers() { timers.forEach(clearInterval); timers.forEach(clearTimeout); timers = []; }
function every(fn, ms) { timers.push(setInterval(fn, ms)); }
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
let idleT = null;
const IDLE_STEPS = ['rooms', 'pick', 'pin', 'counsel'];
function armIdle() { clearTimeout(idleT); if (IDLE_STEPS.includes(st.step)) idleT = setTimeout(() => { if (IDLE_STEPS.includes(st.step)) goHome(); }, IDLE_MS); }
['pointerdown', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, armIdle, true));
document.addEventListener('contextmenu', e => e.preventDefault());
// 주차 화면의 움직임 감지 — 안쪽(업체 페이지)에서 누르거나 입력하면 이 화면은 이벤트를 못 받지만, 처음 누를 때 이 창이 포커스를 잃는(blur) 것은 알 수 있음
['pointerdown', 'touchstart', 'keydown', 'mousemove', 'wheel'].forEach(ev => document.addEventListener(ev, () => { if (parkActivity) parkActivity(); }, { capture: true, passive: true }));
window.addEventListener('blur', () => { if (parkActivity) parkActivity(); });
window.addEventListener('focus', () => { if (parkActivity) parkActivity(); });

function tickClock() {
  const d = new Date();
  $('clock').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
tickClock(); setInterval(tickClock, 15000);

function stepper(n) {
  const s = ['장소·모임 선택', '본인 확인', '주차 등록', '완료'];
  return '<div class="stepper">' + s.map((x, i) => `<span class="${i === n ? 'on' : ''}">${i + 1}. ${x}</span>`).join('') + '</div>';
}
function errMsg(e) {
  const m = (e && e.message) || '';
  if (e && e.code === 'functions/internal') return '일시적인 오류입니다. 잠시 후 다시 시도해 주시기 바랍니다.';
  if (e && (e.code === 'functions/unavailable' || /network|fetch/i.test(m))) return '인터넷 연결을 확인해 주시기 바랍니다.';
  return m || '오류가 발생했습니다. 사무실로 문의해 주시기 바랍니다.';
}

// 505~511호를 호수 순으로 먼저, 그 밖의 공간은 뒤에 (서버 정렬과 같은 기준 — 서버가 아직 옛 버전이어도 화면에서 맞춤)
function roomRank(room) { const m = /^(\d{3})호$/.exec(String(room || '').trim()); return m ? Number(m[1]) : 100000; }
function compareMeetings(a, b) {
  const ra = roomRank(a.room), rb = roomRank(b.room);
  if (ra !== rb) return ra - rb;
  if (ra === 100000) { const c = String(a.room || '').localeCompare(String(b.room || ''), 'ko'); if (c) return c; }
  return String(a.start || '').localeCompare(String(b.start || '')) || String(a.name || '').localeCompare(String(b.name || ''), 'ko');
}

// 종료 후 몇 분까지 등록할 수 있는지는 서버 설정(afterMin, 기본 120분)을 그대로 안내문에 씀 — 설정을 바꿔도 문구가 어긋나지 않게
function fmtMin(m) { const h = Math.floor(m / 60), r = m % 60; return h && r ? `${h}시간 ${r}분` : h ? `${h}시간` : `${r}분`; }

function goHome() { parkActivity = null; mtgCache.clear(); clearTimers(); clearTimeout(idleT); st = { step: 'start', rooms: [], activeRooms: null, counselRooms: [], counselEnabled: true, room: '', meetings: [], sel: null, pin: '', busy: false, afterMin: st.afterMin }; renderStart(); }

// 처음 화면 — 이용자가 '주차 등록하기'를 눌러야 모임 선택으로 넘어감
function renderStart() {
  clearTimers(); clearTimeout(idleT);
  if (!KEY) {
    body.innerHTML = '<div class="center"><h2>키오스크로 설정되지 않은 기기입니다</h2><p class="sub">관리자 화면(주차 등록 관리)에서 발급한 설정 주소를 이 기기에서 한 번 열어 주시기 바랍니다.</p></div>';
    return;
  }
  st.step = 'start';
  body.innerHTML = '<div class="start"><span class="logo big" role="img" aria-label="IAM 센터"></span><h1>주차등록</h1><p>5층(혹은 6층) 모임 예약 사용자분들은 이곳에서 주차 할인 등록 가능합니다.<br>아래 버튼을 눌러 시작해주세요.</p><button class="btn big" id="go">주차 할인 등록 →</button></div>';
  $('go').onclick = () => renderRooms();
}

// ── 속도: 호실 목록·모임 목록은 요청을 한 번만 보내고 잠깐 기억해 두며, 함수가 잠들지 않게 미리 깨워 둠 ──
const ROOMS_TTL = 60 * 1000;        // 호실 목록(지금 예약이 있는 호실 표시 포함)은 1분까지만 재사용
const MTG_TTL = 60 * 1000;          // 모임 목록은 1분까지만 재사용
let roomsCache = { t: 0, p: null };
const mtgCache = new Map();         // 호실 이름 → { t, p }
function fetchRooms(force) {
  if (!force && roomsCache.p && Date.now() - roomsCache.t < ROOMS_TTL) return roomsCache.p;
  const p = callRooms({ key: KEY }).then(r => r.data);
  roomsCache = { t: Date.now(), p };
  p.catch(() => { if (roomsCache.p === p) roomsCache = { t: 0, p: null }; });
  return p;
}
function fetchMeetings(room, force) {
  const c = mtgCache.get(room);
  if (!force && c && Date.now() - c.t < MTG_TTL) return c.p;
  const p = callMeetings({ key: KEY, room }).then(r => r.data);
  mtgCache.set(room, { t: Date.now(), p });
  p.catch(() => { const cur = mtgCache.get(room); if (cur && cur.p === p) mtgCache.delete(room); });
  return p;
}
// 서버 함수는 한동안 안 쓰면 꺼졌다가 첫 호출 때 몇 초 걸려 켜짐 → 화면이 열려 있는 동안 몇 분마다, 그리고 화면을 처음 만질 때 미리 한 번씩 불러 둠
let lastWarm = 0;
function warmAll() {
  if (!KEY) return;
  lastWarm = Date.now();
  fetchRooms(true).catch(() => {});
  callMeetings({ key: KEY, warm: true }).catch(() => {});
  callVerify({ key: KEY, warm: true }).catch(() => {});
  callCounsel({ key: KEY, warm: true }).catch(() => {});
}
setInterval(warmAll, 4 * 60 * 1000);
document.addEventListener('pointerdown', () => { if (Date.now() - lastWarm > 60 * 1000) warmAll(); }, true);

const NOKEY = '<div class="center"><h2>키오스크로 설정되지 않은 기기입니다</h2><p class="sub">관리자 화면(주차 등록 관리)에서 발급한 설정 주소를 이 기기에서 한 번 열어 주시기 바랍니다.</p></div>';
function discountNote() { return '모임 이용자만 주차 할인이 가능합니다.'; }

// 호실을 '5층 소그룹실'(505~511호)과 '세미나실'(그 밖의 홀)로 나눠 보여줌
function roomGroupsHtml() {
  const groups = [
    { title: '5층 소그룹실', cls: 'g1', list: [] },
    { title: '세미나실', cls: 'g2', list: [] },
  ];
  st.rooms.forEach((r, i) => (/^5\d{2}호$/.test(r) ? groups[0] : groups[1]).list.push({ r, i }));
  // 5층 소그룹실은 505~507호 한 줄, 508~511호 한 줄로 나눠 보여줌(나머지는 한 줄)
  const num = r => Number(String(r).slice(0, 3));
  const rowsOf = g => g.cls === 'g1'
    ? [g.list.filter(x => num(x.r) <= 507), g.list.filter(x => num(x.r) > 507)].filter(a => a.length)
    : [g.list];
  const dim = r => (st.activeRooms && !st.activeRooms.includes(r) ? ' dim' : '');   // 지금 예약이 없는 호실은 연하게(누를 수는 있음)
  const btn = (g, { r, i }) => `<button class="roombtn ${g.cls}${dim(r)}" data-i="${i}">${esc(r)}</button>`;
  let html = groups.filter(g => g.list.length).map(g =>
    `<section class="rgroup"><h3>${g.title}</h3>` +
    rowsOf(g).map(row => `<div class="roomrow">${row.map(x => btn(g, x)).join('')}</div>`).join('') + '</section>').join('');
  // 상담실(502~504호)은 맨 아래 별도 묶음 — 예약 확인 없이 담당 목회자 성함만 적어 등록
  if (st.counselRooms.length && st.counselEnabled !== false) {
    html += '<section class="rgroup"><h3>상담실</h3><div class="roomrow">' +
      st.counselRooms.map((r, i) => `<button class="roombtn g3" data-c="${i}">${esc(r)}</button>`).join('') + '</div></section>';
  }
  return html;
}

// 1) 호실 선택 — 어느 호실에 지금 모임이 있는지는 보이지 않게, 호실 이름만 항상 같은 모양으로 보여줌
async function renderRooms() {
  clearTimers(); st.step = 'rooms'; st.room = ''; st.sel = null; armIdle();
  if (!KEY) { body.innerHTML = NOKEY; return; }
  body.innerHTML = stepper(0) + '<h2>예약 장소 선택</h2><p class="sub">불러오는 중…</p>';
  try {
    const data = await fetchRooms();
    if (st.step !== 'rooms') return;
    st.rooms = data.rooms || [];
    st.activeRooms = Array.isArray(data.activeRooms) ? data.activeRooms : null;
    st.counselRooms = data.counselRooms || [];
    st.counselEnabled = data.counselEnabled !== false;
    if (typeof data.afterMin === 'number') st.afterMin = data.afterMin;
    body.innerHTML = stepper(0) + '<h2>예약 장소 선택</h2><p class="sub">' + discountNote() + '</p>' +
      roomGroupsHtml() +
      '<div class="foot"><button class="btn ghost" id="back">← 처음으로</button></div>';
    $('back').onclick = goHome;
    body.querySelectorAll('.roombtn[data-i]').forEach(b => b.addEventListener('pointerdown', () => { fetchMeetings(st.rooms[+b.dataset.i]).catch(() => {}); }));
    body.querySelectorAll('.roombtn[data-i]').forEach(b => b.onclick = () => { st.room = st.rooms[+b.dataset.i]; st.meetings = []; st.step = 'pick'; renderPick(true); });
    body.querySelectorAll('.roombtn[data-c]').forEach(b => b.onclick = () => renderCounsel(st.counselRooms[+b.dataset.c]));
  } catch (e) {
    if (st.step !== 'rooms') return;
    body.innerHTML = stepper(0) + `<h2>예약 장소 선택</h2><div class="empty err">${esc(errMsg(e))}</div><div class="foot"><button class="btn ghost" id="back">← 처음으로</button></div>`;
    $('back').onclick = goHome;
  }
}

// 2) 고른 호실의 모임 선택 — 같은 호실에 예약이 여럿이면 시간순 목록으로
async function renderPick(fresh) {
  clearTimers(); if (fresh) armIdle();
  if (!KEY) { body.innerHTML = NOKEY; return; }
  if (!st.room) { renderRooms(); return; }
  if (fresh) body.innerHTML = stepper(0) + `<h2>${esc(st.room)}</h2><p class="sub">불러오는 중…</p>`;
  try {
    const data = await fetchMeetings(st.room, !fresh);
    if (st.step !== 'pick') return;
    st.meetings = (data.meetings || []).slice().sort(compareMeetings);
    if (typeof data.afterMin === 'number') st.afterMin = data.afterMin;
    drawPick();
  } catch (e) {
    if (st.step !== 'pick') return;
    body.innerHTML = stepper(0) + `<h2>${esc(st.room)}</h2><div class="empty err">${esc(errMsg(e))}</div><div class="foot"><button class="btn ghost" id="back">← 장소 다시 선택</button></div>`;
    $('back').onclick = renderRooms;
  }
  every(() => { if (st.step === 'pick') renderPick(false); }, 60000);
}
function drawPick() {
  const a = st.meetings;
  body.innerHTML = stepper(0) + '<h2>어느 모임이신가요?</h2><p class="sub">' + discountNote() + '</p>' +
    (a.length
      ? `<div class="rooms one"><div class="rgrp"><div class="rname">${esc(st.room)}</div><div class="rlist">` +
          a.map((x, i) => `<button class="ritem" data-i="${i}"><span class="rl"><span class="rn">${esc(x.name)}</span>${x.steward ? `<span class="rs">청지기 ${esc(x.steward)}</span>` : ''}</span><span class="rt">${esc(x.start)} – ${esc(x.end)}</span></button>`).join('') +
          '</div></div></div>'
      : `<div class="empty">${esc(st.room)}에는 현재 예약 모임이 없습니다.<br>주차 등록은 모임 시간 후 ${fmtMin(st.afterMin == null ? 120 : st.afterMin)} 이내에만 가능합니다.<br>문의: 070-7018-1439(아이엠센터 공간예약) / 카카오톡채널 ‘아이엠센터’</div>`) +
    '<div class="foot"><button class="btn ghost" id="back">← 장소 다시 선택</button></div>';
  $('back').onclick = renderRooms;
  body.querySelectorAll('.ritem').forEach(c => c.onclick = () => { st.sel = st.meetings[+c.dataset.i]; st.pin = ''; st.step = 'pin'; renderPin(''); });
}

// 3) 상담실 — 예약 확인 없이 '모임을 예약한 담당 목회자 성함'만 적어 등록(기록은 나중에 상담 시스템과 대조하는 자료)
function renderCounsel(room, msg) {
  clearTimers(); st.step = 'counsel'; st.room = room; armIdle();
  body.innerHTML = stepper(0) + `<h2>${esc(room)} 상담실</h2><p class="sub">사전 예약 이용자만 주차 할인이 가능합니다.</p>` +
    `<div class="cform"><label for="pastor">모임을 예약한 담당 목회자 성함을 작성해 주시기 바랍니다</label>
     <input id="pastor" type="text" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: 홍길동">
     <div class="msg" id="msg">${esc(msg || '')}</div>
     <button class="btn" id="cgo">주차 등록하기</button></div>
     <div class="foot"><button class="btn ghost" id="back">← 장소 다시 선택</button></div>`;
  $('back').onclick = renderRooms;
  const input = $('pastor');
  const go = async () => {
    if (st.busy) return;
    const name = input.value.replace(/\s+/g, ' ').trim();
    if (!/^[가-힣A-Za-z·. ]{2,20}$/.test(name)) { $('msg').style.color = 'var(--red)'; $('msg').textContent = '성함을 한글 또는 영문 2~20자로 입력해 주시기 바랍니다.'; return; }
    st.busy = true; $('cgo').disabled = true; $('msg').style.color = 'var(--mut)'; $('msg').textContent = '확인하는 중…';
    try {
      const { data } = await callCounsel({ key: KEY, room, pastor: name });
      st.busy = false;
      st.sel = { room, name: '상담실 이용' };
      openParking(data);
    } catch (e) {
      st.busy = false;
      renderCounsel(room, errMsg(e));
    }
  };
  $('cgo').onclick = go;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
  setTimeout(() => input.focus(), 50);
}

function renderPin(msg) {
  clearTimers(); armIdle();
  const x = st.sel;
  body.innerHTML = stepper(1) + '<h2>청지기(대표 사용자) 연락처 뒤 4자리를 입력해주세요</h2><p class="sub">이용에 어려움이 있을 경우 문의 바랍니다. (070-7018-1439 / 카카오톡채널 ‘아이엠센터’)</p>' +
    `<div class="row"><div><div class="chosen"><div class="room">${esc(x.room)}</div><div class="nm">${esc(x.name)}</div><div class="tm">${esc(x.start)} – ${esc(x.end)}${x.steward ? ' · 청지기 ' + esc(x.steward) : ''}</div></div>
     <div class="dots" id="dots"></div><div class="msg" id="msg">${esc(msg || '')}</div></div>
     <div class="pad" id="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button class="fn" data-k="back">지움</button><button data-k="0">0</button><button class="fn" data-k="ok">확인</button></div></div>
     <div class="foot"><button class="btn ghost" id="back">← 모임 다시 선택</button></div>`;
  drawDots();
  $('back').onclick = () => { st.step = 'pick'; renderPick(true); };
  $('pad').onclick = e => {
    const k = e.target.dataset.k; if (k == null || st.busy) return;
    if (k === 'back') st.pin = st.pin.slice(0, -1);
    else if (k === 'ok') { submitPin(); return; }
    else if (st.pin.length < 4) st.pin += k;
    drawDots();
    if (st.pin.length === 4 && k !== 'back') submitPin();
  };
}
function drawDots() { $('dots').innerHTML = [0, 1, 2, 3].map(i => `<span>${st.pin[i] ? '●' : ''}</span>`).join(''); }

async function submitPin() {
  if (st.busy) return;
  if (st.pin.length < 4) { $('msg').textContent = '4자리를 모두 입력해 주시기 바랍니다.'; return; }
  st.busy = true; $('msg').style.color = 'var(--mut)'; $('msg').textContent = '확인하는 중…';
  try {
    const { data } = await callVerify({ key: KEY, reservationId: st.sel.id, last4: st.pin });
    st.busy = false;
    openParking(data);
  } catch (e) {
    st.busy = false; st.pin = '';
    renderPin(errMsg(e));
    if (e && e.code === 'functions/failed-precondition' && /이용할 수 있는 모임이 아닙니다/.test(e.message || '')) later(goHome, 2500);
  }
}

function openParking(info) {
  clearTimers(); clearTimeout(idleT);
  if (info.mode === 'redirect') { location.href = info.url; return; }
  st.step = 'park';
  let left = PARK_IDLE_SEC;
  body.innerHTML = stepper(2) + '<h2>주차 등록</h2><p class="sub">아래 화면에서 차량을 조회한 뒤 ‘무료 2시간 할인’을 등록해주세요.<br>모임 인원의 주차 등록이 모두 끝나면 아래 ‘등록 완료’를 눌러주세요.</p>' +
    `<div class="frame-wrap"><iframe id="pf" title="주차 등록" referrerpolicy="no-referrer" sandbox="allow-scripts allow-forms allow-same-origin"></iframe></div>
     <div class="warn" id="warn" hidden><span id="warn-t"></span><button class="btn sm" id="keep">계속 이용하기</button></div>
     <div class="foot"><button class="btn" id="fin">등록 완료</button><button class="btn ghost" id="cancel">처음으로</button><span class="cd" id="cd"></span></div>`;
  const reset = () => { const wasWarn = left <= PARK_WARN_SEC; left = PARK_IDLE_SEC; if (wasWarn) show(); };
  const show = () => {
    const el = $('cd'); if (!el) return;
    el.textContent = `움직임이 없으면 ${Math.floor(left / 60)}분 ${String(left % 60).padStart(2, '0')}초 후 처음 화면으로 돌아갑니다`;
    const w = $('warn'); w.hidden = left > PARK_WARN_SEC;
    if (!w.hidden) $('warn-t').textContent = `${left}초 뒤 처음 화면으로 돌아갑니다. 계속 이용하시려면 아래 버튼을 눌러 주시기 바랍니다.`;
  };
  parkActivity = reset;                                 // 이 화면을 누르거나 움직이거나 창 포커스가 바뀌면 시간을 처음부터 다시 잼
  $('pf').addEventListener('load', reset);              // 업체 페이지가 새로 열릴 때마다(조회·선택·등록 단계 이동) 움직임으로 봄
  $('pf').src = info.url;
  $('keep').onclick = reset;
  $('fin').onclick = () => { parkActivity = null; renderDone(); };
  $('cancel').onclick = () => { parkActivity = null; goHome(); };
  show();
  every(() => { left--; show(); if (left <= 0) { parkActivity = null; goHome(); } }, 1000);
}

function renderDone() {
  clearTimers(); st.step = 'done';
  let left = 10;
  body.innerHTML = stepper(3) + `<div class="ok"><div class="ck">✓</div><h2>감사합니다</h2><p class="sub">${esc(st.sel.room)} · ${esc(st.sel.name)}<br>모임을 마치고 나가실 때 호실의 퇴실 체크도 부탁드립니다.</p><button class="btn" id="home">처음으로 <span id="cd2">(10)</span></button></div>`;
  $('home').onclick = goHome;
  every(() => { left--; const el = $('cd2'); if (el) el.textContent = `(${left})`; if (left <= 0) goHome(); }, 1000);
}

renderStart();
warmAll();
</script>
</body>
</html>
